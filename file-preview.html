<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Просмотр файла</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    html,body { margin:0; height:100%; background:#1d2125; color:#dee4ea; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
    #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
    #wrap.pdf { display:block; overflow:auto; padding:10px 0; }
    #wrap.pdf canvas { display:block; margin:0 auto 10px; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.4); max-width:calc(100% - 20px); height:auto; }
    iframe { width:100%; height:100%; border:0; background:#fff; }
    img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
    #msg { padding:24px; text-align:center; font-size:14px; color:#9fadbc; }
  </style>
</head>
<body>
  <div id="wrap"><div id="msg">Загрузка…</div></div>
  <script>
    // ПРОСМОТР PDF / КАРТИНКИ во всплывающем окне (решение Асхата, 12.11.2026): не скачивается,
    // закрывается крестиком или кликом мимо окна. Для скачивания — кнопка ⬇ в списке файлов.
    var t = window.TrelloPowerUp.iframe();
    var W = (window.WORKER_URL || '').replace(/\/$/, '');
    var fileName = t.arg('fileName') || '', ext = String(fileName).toLowerCase().split('.').pop();
    var src = W + '/download?' + new URLSearchParams({ cardId: t.arg('cardId'), attachmentId: t.arg('attachmentId'), fileName: fileName }).toString() + '&inline=1';
    var wrap = document.getElementById('wrap');
    if (ext === 'pdf') {
      // PDF рисуем сами (pdf.js), без встроенного просмотрщика браузера: Edge/Chrome блокируют
      // его внутри окна Trello («Эта страница заблокирована Microsoft Edge»)
      fetch(src).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); }).then(function(buf){
        var lib = window.pdfjsLib; if (!lib) throw new Error('просмотрщик PDF не загрузился');
        lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        return lib.getDocument({ data: buf }).promise;
      }).then(function(pdf){
        wrap.innerHTML = ''; wrap.className = 'pdf';
        var width = Math.max(320, wrap.clientWidth - 20), n = 1;
        function page(){
          if (n > pdf.numPages) return;
          return pdf.getPage(n++).then(function(pg){
            var v0 = pg.getViewport({ scale: 1 }), sc = width / v0.width, dpr = window.devicePixelRatio || 1;
            var vp = pg.getViewport({ scale: sc * dpr });
            var c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; c.style.width = (vp.width / dpr) + 'px';
            wrap.appendChild(c);
            return pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise.then(page);
          });
        }
        return page();
      }).catch(function(e){ wrap.className = ''; wrap.innerHTML = '<div id="msg">Не удалось открыть PDF: ' + String(e && e.message || e) + '</div>'; });
    } else if (/^(png|jpe?g|webp|gif|svg|bmp)$/.test(ext)) {
      // картинку тоже берём данными (blob), а не прямой ссылкой — так её ничто не блокирует
      var im = new Image(); im.onload = function(){ wrap.innerHTML = ''; wrap.appendChild(im); };
      im.onerror = function(){ document.getElementById('msg').textContent = 'Не удалось открыть картинку'; };
      fetch(src).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
        .then(function(b){ im.src = URL.createObjectURL(b); })
        .catch(function(e){ document.getElementById('msg').textContent = 'Не удалось открыть картинку: ' + (e && e.message || e); });
      // клик по пустому месту вокруг картинки тоже закрывает окно
      wrap.addEventListener('click', function(e){ if (e.target === wrap) t.closeModal(); });
    } else {
      document.getElementById('msg').textContent = 'Этот тип файла нельзя показать в окне — скачайте его кнопкой ⬇.';
    }
  </script>
</body>
</html>
