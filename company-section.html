<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Компания и контакты</title>
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css" />
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    /* Colours that follow Trello's light/dark theme automatically */
    html[data-color-mode="light"] { --txt: #172b4d; --muted: #5e6c84; --line: #dfe1e6; }
    html[data-color-mode="dark"]  { --txt: #c7d1db; --muted: #9fadbc; --line: #3c4757; }
    html { --txt: #172b4d; --muted: #5e6c84; --line: #dfe1e6; } /* fallback */

    html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--txt); }
    #root { padding: 4px 2px 8px; }
    .muted { color: var(--muted); font-size: 13px; }
    .company-name { font-size: 15px; font-weight: 700; margin: 0 0 2px; color: var(--txt); }
    .req { font-size: 12px; color: var(--muted); margin: 1px 0; }
    .contacts { margin-top: 8px; }
    .contact {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px;
    }
    .contact .who { overflow: hidden; }
    .contact .nm { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--txt); }
    .contact .role { font-size: 11px; color: var(--muted); }
    .contact .num { font-size: 12px; color: var(--muted); }
    .actions { display: flex; gap: 6px; flex: 0 0 auto; }
    /* ---- unified buttons & action links ---- */
    a.wa, a.call, button.btn, .map-links a {
      display: inline-flex; align-items: center; justify-content: center; line-height: 1;
      box-sizing: border-box; border-radius: 5px; font-weight: 600; cursor: pointer;
      text-decoration: none; white-space: nowrap; transition: background .05s ease;
    }
    a.wa { background: #25d366; color: #fff; font-size: 12px; height: 32px; padding: 0 12px; }
    a.wa:active { background: #1da851; }
    a.call { background: transparent; color: var(--txt); border: 1px solid var(--line); font-size: 12px; height: 32px; padding: 0 11px; }
    a.call:active { background: rgba(127,127,127,0.18); }
    .toolbar { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    button.btn { background: #0c66e4; color: #fff; border: none; height: 32px; padding: 0 14px; font-size: 13px; }
    button.btn:active { background: #09326c; }
    button.btn.secondary { background: transparent; color: var(--txt); border: 1px solid var(--line); }
    button.btn.secondary:active { background: rgba(127,127,127,0.18); }
    /* clickable address + map route links */
    a.addr-link { color: #4c9aff; text-decoration: none; font-size: 12px; border-bottom: 1px dashed rgba(76,154,255,0.6); cursor: pointer; }
    a.addr-link:hover { border-bottom-style: solid; }
    .map-links { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin: 3px 0 2px; }
    .map-links .lbl { font-size: 11px; color: var(--muted); }
    .map-links a { background: transparent; color: #4c9aff; border: 1px solid var(--line); font-size: 11px; padding: 4px 8px; }
    .map-links a:active { background: rgba(76,154,255,0.18); }
    .empty-box { padding: 6px 2px; }
    /* одна строка: компания · заказчик · телефон · WhatsApp · Звонок (решение Асхата, 05.11.2026) */
    .line1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
    .line1 .co { font-size: 14px; font-weight: 700; color: var(--txt); }
    .line1 .nm { font-size: 13px; font-weight: 600; color: var(--txt); }
    .line1 .num { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .line1 .sep { color: var(--muted); }
    .line1 .actions { margin-left: auto; }
  </style>
</head>
<body>
  <div id="root"><div class="muted">Загрузка…</div></div>

  <script src="./config.js"></script>
  <script src="./crm-common.js"></script>
  <script>
    var t = window.TrelloPowerUp.iframe();

    function openManager() {
      return t.modal({
        title: 'Компания и контакты',
        url: './company-modal.html',
        height: 600,
        fullscreen: false
      });
    }

    function renderContactRow(contact) {
      var wa = CRM.waLink(contact.phone);
      var tel = CRM.telLink(contact.phone);
      var html = '<div class="contact">';
      html += '<div class="who">';
      html += '<div class="nm">' + CRM.esc(contact.name || 'Без имени') + '</div>';
      if (contact.role) html += '<div class="role">' + CRM.esc(contact.role) + '</div>';
      if (contact.phone) html += '<div class="num">' + CRM.esc(contact.phone) + '</div>';
      html += '</div><div class="actions">';
      if (wa) html += '<a class="wa" href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a>';
      if (tel) html += '<a class="call" href="' + tel + '" target="_blank" rel="noopener">Звонок</a>';
      html += '</div></div>';
      return html;
    }

    t.render(function () {
      var root = document.getElementById('root');

      return CRM.getCardCompanyId(t).then(function (companyId) {
        if (!companyId) {
          root.innerHTML =
            '<div class="empty-box"><div class="muted">Компания для этой карточки ещё не выбрана.</div>' +
            '<div class="toolbar"><button class="btn" id="choose">Выбрать компанию</button></div></div>';
          document.getElementById('choose').addEventListener('click', openManager);
          return t.sizeTo('#root');
        }

        return Promise.all([
          CRM.getCompanyById(t, companyId),
          CRM.getCardContacts(t),
          CRM.getCardObjectId(t)
        ]).then(function (res) {
          var company = res[0];
          var cardContactIds = res[1] || [];
          var cardObjectId = res[2] || null;

          if (!company) {
            root.innerHTML =
              '<div class="empty-box"><div class="muted">Связанная компания не найдена (возможно, удалена).</div>' +
              '<div class="toolbar"><button class="btn" id="choose">Выбрать компанию</button></div></div>';
            document.getElementById('choose').addEventListener('click', openManager);
            return t.sizeTo('#root');
          }

          var contacts = company.contacts || [];
          // показываем ТОЛЬКО выбранного заказчика (решение Асхата, 05.11.2026); раньше,
          // если никто не отмечен, показывались все контакты компании — путало
          var selected = contacts.filter(function (c) { return c.id === cardContactIds[0]; });
          var toShow = selected;

          var html = '';
          var c0 = toShow[0] || null;
          var wa0 = c0 ? CRM.waLink(c0.phone) : null, tel0 = c0 ? CRM.telLink(c0.phone) : null;
          html += '<div class="line1">' +
            '<span class="co">' + CRM.esc(company.name) + '</span>' +
            (c0 ? '<span class="sep">·</span><span class="nm" title="' + CRM.esc(c0.role || '') + '">' + CRM.esc(c0.name || 'Без имени') + '</span>' : '') +
            (c0 && c0.phone ? '<span class="sep">·</span><span class="num">' + CRM.esc(c0.phone) + '</span>' : '') +
            '<span class="actions">' +
              (wa0 ? '<a class="wa" href="' + wa0 + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
              (tel0 ? '<a class="call" href="' + tel0 + '" target="_blank" rel="noopener">Позвонить</a>' : '') +
              '<button class="btn" id="manage">Управление</button>' +
            '</span></div>';

          var obj = (company.objects || []).filter(function (o) { return o.id === cardObjectId; })[0];
          if (obj) {
            html += '<div class="req" style="margin-top:4px">Объект: ' + CRM.esc(obj.name) + '</div>';
            if (obj.addr) {
              var mu = CRM.mapUrls(obj.addr);
              html += '<a class="addr-link" href="' + mu.gis + '" target="_blank" rel="noopener" title="Открыть в 2ГИС">' + CRM.esc(obj.addr) + '</a>';
            }
          }

          if (!c0) {
            html += '<div class="req" style="margin-top:6px;color:#e8c07d;">⚠ Заказчик не выбран. Нажмите «Управление» и отметьте одного человека — без этого расчёт не сохранится.</div>';
          }

          root.innerHTML = html;
          document.getElementById('manage').addEventListener('click', openManager);
          return t.sizeTo('#root');
        });
      }).catch(function (err) {
        root.innerHTML = '<div class="muted">Ошибка: ' + CRM.esc(err && err.message ? err.message : 'неизвестно') + '</div>';
        return t.sizeTo('#root');
      });
    });
  </script>
</body>
</html>
