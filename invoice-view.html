<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Счёт на оплату</title>
  <script src="./pay-dialog.js?v=20"></script>
  <script src="./config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.72/pdfmake.min.js"></script>
  <script src="./dejavu-vfs.js"></script>
  <script src="./invoice-doc.js?v=3"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="./invoice-xls.js?v=1"></script>
  <style>
    :root{ --bg:#1d2125; --bg2:#22272b; --line:#3a414a; --txt:#c7d1db; --muted:#9fadbc; --blue:#4f7cff; --green:#4bce97; --red:#f28b82; --amber:#e8c07d; }
    html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13.5px}
    #app{max-width:760px;margin:0 auto;padding:16px 16px 80px}
    h2{margin:0;font-size:17px}
    .muted{color:var(--muted);font-size:12.5px}
    .pillrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
    .pill{border-radius:10px;padding:3px 10px;font-size:11.5px;font-weight:600;background:var(--bg2);border:1px solid var(--line)}
    .pill.g{background:#1c3329;color:var(--green);border-color:#2e5c44}
    .pill.a{background:#3a2f1a;color:var(--amber);border-color:#5c4a2e}
    .pill.r{background:#42221f;color:var(--red);border-color:#5a3a3a}
    .doc{background:#fff;color:#172b4d;border-radius:12px;padding:22px 24px;margin-top:8px;font-size:13px}
    .doc h3{margin:4px 0 10px;font-size:16px;border-bottom:2px solid #172b4d;padding-bottom:6px}
    .doc table{width:100%;border-collapse:collapse;margin-top:8px}
    .doc th,.doc td{border:1px solid #b9c2cf;padding:5px 7px;font-size:12px}
    .doc th{background:#eef1f5}
    .doc .num{text-align:right}
    .doc .tot{ text-align:right;font-weight:700;font-size:14px;margin-top:8px }
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
    .otbl{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:12.5px}
    .otbl th{color:var(--muted);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);font-size:11.5px}
    .otbl td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
    .otbl td.num{text-align:right;white-space:nowrap}
    .onum{color:#8fb4ff;cursor:pointer;text-decoration:none;font-weight:600;white-space:nowrap}
    .onum:hover{text-decoration:underline}
    .chip{display:inline-block;border-radius:8px;padding:3px 9px;font-size:11px;font-weight:600;
          background:var(--bg2);border:1px solid var(--line);color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
    .chip:hover{border-color:var(--blue)}
    .chip.on{background:#1c3329;color:var(--green);border-color:#2e5c44}
    .chip.part{background:#3a2f14;color:#f5cd47;border-color:#7f5f01}
    .chip.busy{opacity:.5;pointer-events:none}
    .warn12{font-size:11.5px;color:var(--amber);margin:2px 0 6px}
    .tabbtn{border:1px solid var(--line);background:var(--bg2);color:var(--txt);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:12.5px}
    .tabbtn.active{border-color:var(--blue);color:#cfe1ff}
    .bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:flex-end;gap:10px}
    .btn{background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:9px 16px;font-size:13px;cursor:pointer}
    .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  </style>
</head>
<body>
  <div id="app"><div class="muted">Загрузка счёта…</div></div>
  <div class="bar">
    <button class="btn" id="invEdit" type="button" style="display:none;margin-right:auto" title="Исправить строки счёта (название, кол-во, цена) — номер НЕ меняется, старая версия сохраняется в истории">✎ Изменить счёт</button>
    <button class="btn" id="invSplit" type="button" style="display:none" title="Выделить выбранные строки в отдельный счёт со следующим номером">✂ Выделить в отдельный счёт</button>
    <button class="btn" id="invPay" type="button" style="display:none;background:#1f845a;border-color:#1f845a;color:#fff" title="Внести оплату по всему счёту: сумма сама разделится между заказами счёта">₸ Оплата по счёту</button>
    <button class="btn" id="invResid" type="button" style="display:none" title="Выставить счёт на неоплаченный остаток по этому счёту — номер возьмётся из системы, счета не будут дублироваться">💠 Счёт на остаток</button>
    <button class="btn" id="invAnnul" type="button" style="display:none;color:#f28b82" title="Аннулировать счёт: не входит в суммы, заказы снова свободны, номер и история сохраняются">Аннулировать</button>
    <button class="btn" id="xls1c" type="button" style="display:none" title="Файл в формате счёта 1С — бухгалтер импортирует его в 1С:Бухгалтерию">📗 Excel для 1С</button>
    <button class="btn primary" id="pdf" type="button" style="display:none">⬇ Скачать PDF</button>
  </div>
  <script>
    var WORKER = (window.CONFIG && window.CONFIG.WORKER_URL) || window.WORKER_URL || '';
    var Q = new URLSearchParams(location.search);
    var FROM_CARD = Q.get('from')==='card';   // открыт из окна «Счета по заказу»: «Счёт на остаток» и «Excel для 1С» стоят там
    var ROWS = [], CUR = null, PAYINFO = {};
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    function money(v){ return (window.INVOICE&&window.INVOICE.money)?window.INVOICE.money(v):(Math.round(+v||0)).toLocaleString('ru-RU'); }
    function parse(s,d){ try{ var v=JSON.parse(s); return v==null?d:v; }catch(e){ return d; } }

    // ОПЛАТА ПО СЧЁТУ ЦЕЛИКОМ (решение Асхата, 19.11.2026): статус и кнопка считают оплаты всех заказов счёта
    var PSUM = {};
    function loadPaySum(num){
      if(!num) return;
      fetch(WORKER+'/invoice-payment?number='+encodeURIComponent(num)).then(function(r){return r.json();}).then(function(j){
        if(j && j.ok){ PSUM[String(num)]=j; if(CUR && String(CUR.number)===String(num)) render(); }
      }).catch(function(){});
    }
    function statusPill(p){
      var ps = CUR && PSUM[String(CUR.number)];
      if(ps && ps.orders && ps.orders.length && ps.total>0){
        var got=ps.paidSum, pc=Math.min(100,Math.round(got/ps.total*100)), full=ps.rest<=0.5 && ps.pendingSum<=0.5;
        return '<span class="pill '+(full?'g':(got>0||ps.pendingSum>0)?'a':'r')+'">'+(full?'оплачен полностью':(got>0?'частично оплачен':'не оплачен'))+' · поступило '+money(got)+' ₸ ('+pc+'%)'+
          (ps.pendingSum>0?(' · ждёт подтверждения '+money(ps.pendingSum)+' ₸'):'')+(full?'':(' · остаток '+money(ps.rest)+' ₸'))+'</span>';
      }
      if(!p) return '';
      var st=p.status, cls=st==='full'?'g':(st==='launched'||st==='partial')?'a':'r';
      var lbl=st==='full'?'оплачен полностью':st==='launched'?'аванс — в производстве':st==='partial'?'частично оплачен':'не оплачен';
      return '<span class="pill '+cls+'">'+lbl+' · поступило '+money(p.received)+' ₸'+(p.pct!=null?(' ('+p.pct+'%)'):'')+'</span>';
    }

    function render(){
      var el=document.getElementById('app');
      if(!ROWS.length){
        el.innerHTML='<h2>Счёт не найден</h2><div class="muted" style="margin-top:8px">'+
          (Q.get('cardId')?'По этому заказу счёт ещё не выставлялся — его можно сформировать кнопкой «Счёт на оплату» на карточке.':'Счёт с таким номером не найден в журнале.')+'</div>';
        return;
      }
      var h='';
      if(ROWS.length>1){
        h+='<div class="muted">По этому заказу выставлено счетов: '+ROWS.length+'</div><div class="tabs">';
        ROWS.forEach(function(r,i){ h+='<button class="tabbtn'+(r===CUR?' active':'')+'" data-i="'+i+'" type="button">№'+esc(r.number)+' · '+money(r.total)+' ₸</button>'; });
        h+='</div>';
      }
      var r=CUR;
      var p=PAYINFO[r.number];
      h+='<h2>Счёт на оплату №'+esc(r.number)+' от '+esc(r.date_text||r.date_iso||'')+(+r.version>1?' <span class="pill" title="Счёт исправлялся — номер тот же">версия '+(+r.version)+'</span>':'')+'</h2>';
      if(+r.archived===1) h+='<div class="warn12" style="color:#f28b82">⛔ Счёт аннулирован'+(r.archive_reason?(': '+esc(r.archive_reason)):'')+' — не входит в суммы и дебиторку.</div>';
      h+='<div class="muted" style="font-size:11.5px;margin:-4px 0 8px">Номер счёта — системный. В 1С вносите этот же номер: №'+esc(r.number)+'.'+
        (r.parent_number?(' Это счёт на остаток по счёту №'+esc(r.parent_number)+'.'):'')+'</div>';
      if(+r.prepay_pct>0){
        var rest=Math.max(0, Math.round((+r.full_total||0)-(+r.total||0)));
        h+='<div class="warn12" style="color:#e8c07d">💠 Счёт на <b>предоплату '+Math.round(+r.prepay_pct)+'%</b> от '+money(+r.full_total||0)+' ₸.'+
          (rest?(' Остаток <b>'+money(rest)+' ₸</b> ещё не выставлен — когда придёт время, нажмите «Счёт на остаток».'):'')+'</div>';
      }
      h+='<div class="pillrow">'+
         (r.sent_at?('<span class="pill g">📤 выслан '+esc(String(r.sent_at).slice(0,16).replace('T',' '))+(r.sent_to?(' → '+esc(r.sent_to)):'')+'</span>'):'<span class="pill">не выслан</span>')+
         statusPill(p)+'</div>';
      // ЗАКАЗЫ СЧЁТА — как во вкладке «Заказы»: статусы правятся прямо здесь,
      // теми же серверными вызовами (/acct-set, /calc-paid), что и раздел «Заказы».
      // Источник данных один (calculations + acct_flags), рассинхрон невозможен.
      h+=renderOrders(r);
      // сам счёт показываем HTML-копией PDF (браузеры блокируют PDF во вложенном
      // окне Trello); скачивание отдаёт настоящий PDF тем же генератором
      h+=renderDocHtml(r);
      var hist=parse(r.versions_json,[])||[];
      if(hist.length){
        h+='<div style="margin:14px 0 70px"><div style="font-weight:700;margin-bottom:6px">История изменений</div>';
        hist.slice().reverse().forEach(function(v){
          h+='<div class="muted" style="font-size:12px;margin-bottom:3px">'+esc(String(v.at||'').slice(0,16).replace('T',' '))+(v.by?(' · '+esc(v.by)):'')+
            (v.v?(' · версия '+v.v+' была на '+money(v.total)+' ₸'):'')+(v.reason?(' · '+esc(v.reason)):'')+'</div>';
        });
        h+='</div>';
      }
      el.innerHTML=h;
      [].forEach.call(document.querySelectorAll('.tabbtn'), function(b){
        b.onclick=function(){ CUR=ROWS[+this.getAttribute('data-i')]; render(); };
      });
      bindOrderChips();
      document.getElementById('pdf').style.display='';
      document.getElementById('xls1c').style.display=FROM_CARD?'none':'';
      var arch=(+r.archived===1);
      ['invEdit','invSplit','invAnnul','invResid'].forEach(function(id){ document.getElementById(id).style.display=arch?'none':''; });
      if(FROM_CARD) document.getElementById('invResid').style.display='none';
      document.getElementById('invPay').style.display=(arch||!invCardIds(r).length)?'none':'';
      if(!arch && invCardIds(r).length && PSUM[String(r.number)]===undefined){ PSUM[String(r.number)]=null; loadPaySum(r.number); }
      if(parse(r.items_json,[]).length<2) document.getElementById('invSplit').style.display='none';
    }

    // ---- заказы счёта со статусами ----
    var ORD = {};        // cardId -> строка статусов с сервера
    function invCardIds(r){
      var ids=[], seen={};
      (parse(r.items_json,[])||[]).forEach(function(it){ if(it&&it.cardId&&!seen[it.cardId]){ seen[it.cardId]=1; ids.push(it.cardId); } });
      (parse(r.card_ids_json,[])||[]).forEach(function(id){ if(id&&!seen[id]){ seen[id]=1; ids.push(id); } });
      // ремонтные заявки счёта — id вида R91 (решение Асхата, 09.2026)
      (parse(r.repair_ids_json,[])||[]).forEach(function(rid){ var k='R'+rid; if(rid&&!seen[k]){ seen[k]=1; ids.push(k); } });
      return ids;
    }
    // сумма заказа — ПО СЧЁТУ (после подгонки или правки счёта она отличается от расчёта): от неё считаются оплата и остаток
    function billCell(o){
      var ps=CUR && PSUM[String(CUR.number)], po=(!o.isRepair && ps && ps.orders) ? ps.orders.filter(function(x){ return x.cardId===o.cardId; })[0] : null;
      if(po && po.total>0 && Math.abs(po.total-(+o.total||0))>1)
        return '<span title="По счёту '+money(po.total)+' ₸ · по расчёту '+money(o.total)+' ₸. Оплата и остаток считаются от суммы по счёту.">'+money(po.total)+' ₸</span><div class="muted" style="font-size:11px;text-decoration:line-through">'+money(o.total)+' ₸</div>';
      return money(o.total)+' ₸';
    }
    function ochip(o, field, label){
      var on=o[field];
      // ОПЛАТА ЗАКАЗА ВНУТРИ СЧЁТА (19.11.2026): не просто «оплачен / нет», а доля — предоплата по счёту видна у каждого заказа
      if(field==='paid' && !o.isRepair){
        var ps=CUR && PSUM[String(CUR.number)], po=ps && ps.orders && ps.orders.filter(function(x){ return x.cardId===o.cardId; })[0];
        if(po && po.total>0){
          var got=po.paid, pc=Math.min(100,Math.round(got/po.total*100)), full=po.rest<=0.5 && po.pending<=0.5;
          var tip='По счёту '+money(po.total)+' ₸ · оплачено '+money(got)+' ₸'+(po.pending>0?(' · ждёт подтверждения '+money(po.pending)+' ₸'):'')+(full?'':(' · остаток '+money(po.rest)+' ₸'))+'. Нажмите — оплаты этого заказа';
          if(full) return '<span class="chip on" data-card="'+esc(o.cardId)+'" data-f="paid" title="'+tip+'">✓ оплачен</span>';
          if(got>0||po.pending>0) return '<span class="chip part" data-card="'+esc(o.cardId)+'" data-f="paid" title="'+tip+'">оплата '+pc+'%'+(po.pending>0&&!(got>0)?' (ждёт)':'')+'</span>';
          return '<span class="chip" data-card="'+esc(o.cardId)+'" data-f="paid" title="'+tip+'">не оплачен</span>';
        }
      }
      return '<span class="chip'+(on?' on':'')+'" data-card="'+esc(o.cardId)+'" data-f="'+field+'">'+(on?'✓ ':'')+label+'</span>';
    }
    function renderOrders(r){
      var ids=invCardIds(r);
      if(!ids.length) return '';
      var h='<table class="otbl"><thead><tr><th>№</th><th>Заказ</th><th class="num">Сумма</th>'+
            '<th>Счёт</th><th>Оплата</th><th>Сдали</th><th>Акт</th></tr></thead><tbody>';
      var anyPaidNoMoney=false;
      var p=PAYINFO[r.number];
      ids.forEach(function(id){
        var o=ORD[id];
        if(!o){ h+='<tr><td colspan="7" class="muted">загружаю статусы…</td></tr>'; return; }
        if(o.missing){
          h+='<tr><td colspan="7" class="muted">заказ '+esc(id)+' не найден в расчётах (возможно, карточка удалена)</td></tr>'; return;
        }
        if(o.paid && p && (+p.received||0)<=0) anyPaidNoMoney=true;
        h+='<tr>'+
           '<td>'+(o.isRepair
              ? '<span class="onum" style="color:#c9a8ff" title="Ремонтная заявка">'+esc(o.number||'—')+'</span>'
              : '<a class="onum" href="https://trello.com/c/'+esc(o.cardId)+'" target="_blank" title="Открыть карточку заказа в новой вкладке">'+esc(o.number||'—')+' ↗</a>')+'</td>'+
           '<td>'+esc(String(o.name||'').slice(0,70))+(String(o.name||'').length>70?'…':'')+'</td>'+
           '<td class="num">'+billCell(o)+'</td>'+
           '<td>'+ochip(o,'invoiceSent','выслан')+'</td>'+
           '<td>'+ochip(o,'paid','оплачен')+'</td>'+
           '<td>'+(o.isRepair?('<span class="chip'+(o.delivered?' on':'')+'" style="cursor:default;opacity:.75" title="Ремонт: «сдали» = заявка выполнена">'+(o.delivered?'✓ ':'')+'сдали</span>'):ochip(o,'delivered','сдали'))+'</td>'+
           '<td>'+(o.isRepair?'<span class="muted">—</span>':ochip(o,'actSigned','акт'))+'</td>'+
           '</tr>';
      });
      h+='</tbody></table>';
      h+='<div class="muted" style="margin-bottom:4px">Статусы общие с разделом «Заказы» в бухгалтерии и карточками — правка здесь видна везде.</div>';
      if(anyPaidNoMoney) h+='<div class="warn12">⚠ Заказ помечен оплаченным, но по выписке на этот счёт денег не поступало. Галочка «оплачен» — ручная отметка; проверьте, тем ли счётом оплачено.</div>';
      return h;
    }
    function loadOrders(){
      var ids={};
      ROWS.forEach(function(r){ invCardIds(r).forEach(function(id){ ids[id]=1; }); });
      var list=Object.keys(ids);
      if(!list.length) return;
      fetch(WORKER+'/acct-status?cards='+encodeURIComponent(list.join(',')))
        .then(function(x){return x.json();})
        .then(function(j){
          if(!j||!j.ok) return;
          (j.rows||[]).forEach(function(o){ ORD[o.cardId]=o; });
          render();
        }).catch(function(){});
    }
    function bindOrderChips(){
      [].forEach.call(document.querySelectorAll('.chip[data-card]'), function(c){
        c.onclick=function(){
          var cardId=this.getAttribute('data-card'), field=this.getAttribute('data-f');
          var o=ORD[cardId]; if(!o||o.missing) return;
          var newVal=!o[field]; this.classList.add('busy');
          if(o.isRepair){
            var f2=(field==='paid')?'paid':(field==='invoiceSent'?'invoice_sent':null);
            if(!f2){ this.classList.remove('busy'); return; }
            fetch(WORKER+'/repair-flags',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:o.repairId,field:f2,value:newVal?1:0})})
              .then(function(x){return x.json();}).then(function(j){ if(!j||!j.ok) throw new Error((j&&j.error)||'?'); o[field]=newVal; render(); loadPayments&&loadPayments(); })
              .catch(function(e){ alert('Не удалось: '+(e&&e.message||e)); render(); });
            return;
          }
          if(field==='paid' && window.openPayDialog){
            this.classList.remove('busy');
            openPayDialog({ cardId:cardId, title:(o.number?'№'+o.number+' ':'')+String(o.name||'').slice(0,40), onDone:function(s){ o.paid=!!s.paidFlag; render(); if(CUR) loadPaySum(CUR.number); loadPayments&&loadPayments(); if(CUR) loadPaySum(CUR.number); } });
            return;
          }
          // те же вызовы, что во вкладке «Заказы»: «оплачен» идёт через /calc-paid
          // (авто-перемещение карточки, дата оплаты), остальное через /acct-set
          var p=(field==='paid')
            ? fetch(WORKER+'/calc-paid',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cardId:cardId,paid:newVal})})
            : fetch(WORKER+'/acct-set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cardId:cardId,field:field,value:newVal?1:0})});
          p.then(function(x){return x.json();}).then(function(j){
            if(!j||!j.ok) throw new Error((j&&j.error)||'сервер не подтвердил');
            o[field]=newVal;
            if(field==='paid') o.paidAt=newVal?new Date().toISOString():null;
            render();
          }).catch(function(e){
            render();
            alert('Не сохранилось: '+(e&&e.message||e));
          });
        };
      });
    }

    // HTML-копия макета PDF: предупреждение, банковская шапка, стороны, позиции,
    // итоги, сумма прописью, подпись директора
    function renderDocHtml(r){
      var sup=parse(r.supplier_json,{})||{}, buy=parse(r.buyer_json,{})||{}, items=parse(r.items_json,[])||[];
      var total=0; items.forEach(function(it){ total+=(+it.qty||0)*(+it.price||0); });
      if(!total) total=+r.total||0;
      var isPerson = buy.kind==='person';

    // Excel в формате счёта 1С: раскладка ячеек повторяет файл, который читает

    function build1C(r){ return window.INVOICE_XLS.build(r); }

      return fetch(WORKER+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})

      // копейки округления уходят в самую крупную строку, итог выходит ровно в заданную сумму
      ov.querySelector('#edFitGo').onclick=function(){
        var note=ov.querySelector('#edFitNote'), target=Math.round((+String(ov.querySelector('#edFit').value).replace(',','.')||0)*100)/100;
        var tot=0; items.forEach(function(it){ tot+=(+it.qty||0)*(+it.price||0); });
        if(!(target>0)){ note.style.color='var(--red,#d33a2c)'; note.textContent='Введите сумму больше нуля.'; return; }
        if(!(tot>0)){ note.style.color='var(--red,#d33a2c)'; note.textContent='В счёте нет суммы — подгонять нечего.'; return; }
        var k=target/tot, whole=(Math.abs(target-Math.round(target))<0.005);
        items.forEach(function(it){ if(!(+it.qty>0)) return; var np=(+it.price||0)*k; it.price=whole?Math.round(np):Math.round(np*100)/100; });
        // остаток округления — в самую крупную строку (лучше с количеством 1, чтобы цена осталась «круглой»)

      // ДОБАВИТЬ ЗАКАЗ ТОГО ЖЕ ЗАКАЗЧИКА (решение Асхата, 23.11.2026)

    var qs = Q.get('number') ? ('number='+encodeURIComponent(Q.get('number'))) : ('cardId='+encodeURIComponent(Q.get('cardId')||''));
    Promise.all([
      fetch(WORKER+'/invoice-list?'+qs).then(function(r){return r.json();}).catch(function(){return {};}),
      fetch(WORKER+'/invoice-payments-list').then(function(r){return r.json();}).catch(function(){return {};})
    ]).then(function(res){
      ROWS=(res[0]&&res[0].rows)||[];
      ((res[1]&&res[1].rows)||[]).forEach(function(p){ PAYINFO[p.number]=p; });
      CUR=ROWS[0]||null;
      render();
      loadOrders();
    });
  </script>

  <script>
  // ССЫЛКИ НА КАРТОЧКУ ОТКРЫВАЮТ КАРТОЧКУ НА СВОЕЙ ДОСКЕ, а не Trello (19.11.2026, после переезда).
  // Окно может быть вложено в другое окно — сообщение шлём самой доске (window.top).
  document.addEventListener('click', function(ev){
    var a = ev.target && ev.target.closest && ev.target.closest('a[href*="trello.com/c/"]'); if(!a) return;
    var m = String(a.getAttribute('href')||'').match(/trello[.]com[/]c[/]([A-Za-z0-9_-]+)/); if(!m) return;
    var inBoard = false; try { inBoard = window.top !== window && /(^|[.])ttms[.]kz$/.test(window.top.location.hostname); } catch(e) {}
    if(!inBoard) return;
    ev.preventDefault(); ev.stopPropagation();
    try { window.top.postMessage({ ms:'card', id:m[1] }, '*'); } catch(e) {}
  }, true);
  </script>
