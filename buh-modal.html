<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Бухгалтерия</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./config.js"></script>
  <style>
    :root{ --bg:#1d2125; --bg2:#22272b; --line:#3a414a; --txt:#c7d1db; --muted:#9fadbc; --blue:#4f7cff; --green:#4bce97; --red:#f28b82; --amber:#e8c07d; }
    html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
    #app{max-width:1100px;margin:0 auto;padding:16px 16px 70px}
    h2{margin:0 0 12px;font-size:18px}
    .muted{color:var(--muted);font-size:12.5px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
    .tab{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer}
    .tab.active{border-color:var(--blue);color:#cfe1ff;background:#274469}
    .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
    input[type=date],input[type=text]{background:var(--bg2);border:1px solid var(--line);border-radius:6px;color:var(--txt);padding:7px 9px;font-size:13px}
    input[type=text]{flex:1;min-width:180px}
    .btn{background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:7px 14px;font-size:13px;cursor:pointer}
    .btn:hover{border-color:var(--blue)}
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 14px}
    .kpi{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
    .kpi .k{font-size:11px;color:var(--muted);text-transform:uppercase}
    .kpi .v{font-size:16px;font-weight:800;margin-top:4px}
    .kpi.green .v{color:var(--green)} .kpi.red .v{color:var(--red)} .kpi.amber .v{color:var(--amber)}
    table{width:100%;border-collapse:collapse}
    th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}
    th{color:var(--muted);font-size:11px;text-transform:uppercase;white-space:nowrap}
    td.num, th.num{text-align:right;white-space:nowrap}
    tfoot td{border-top:2px solid var(--line);border-bottom:none;background:rgba(255,255,255,.03)}
    .chip{display:inline-block;border:1px solid var(--line);background:var(--bg2);color:var(--muted);border-radius:12px;padding:3px 10px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;user-select:none}
    .chip.on{background:#1c3329;color:var(--green);border-color:#2e5c44}
    .chip.busy{opacity:.5;pointer-events:none}
    .pdfmark{font-size:11px;color:var(--muted)}
    .rowclosed td{opacity:.55}
    .empty{color:var(--muted);padding:14px 4px}
    .bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:flex-end;z-index:50}
    label.f{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer}
  </style>
</head>
<body>

  <div id="app"><div class="empty" id="boot">Загрузка…</div></div>
  <div id="invOvlHost"></div>
  <div class="bar"><button class="btn" id="close" type="button">Закрыть</button></div>
  <script>
    var t = window.TrelloPowerUp.iframe();
    // Имена заказчиков: на карточке в CRM отмечены контакты (cardContacts);
    // их имена лежат в справочнике компаний доски. Грузим лениво, кэшируем,
    // вписываем в ячейку «Клиент» второй строкой — таблица не ждёт.
    var PERSONS = {};          // cardId -> имя (или '' если нет)
    var CONTACT_NAMES = null;  // contactId -> имя (по всем компаниям доски)
    function loadPersonNames(){
      var need = (ROWS||[]).filter(function(r){ return r.cardId && PERSONS[r.cardId]===undefined; });
      if(!need.length) return;
      // справочник контактов — из базы CRM (тот же источник, что у счетов),
      // а не из данных доски: там контактов нет
      var prep = CONTACT_NAMES!==null ? Promise.resolve() :
        fetch(WORKER+'/companies-list').then(function(r){return r.json();}).then(function(j){
          CONTACT_NAMES = {};
          (((j&&j.companies)||[])).forEach(function(co){
            ((co&&co.contacts)||[]).forEach(function(c){ if(c&&c.id) CONTACT_NAMES[c.id]=c.name||''; });
          });
        }).catch(function(){ CONTACT_NAMES = {}; });
      prep.then(function(){
        var i=0;
        function next(){
          var batch = need.slice(i, i+6); i+=6;
          if(!batch.length) return;
          Promise.all(batch.map(function(r){
            return fetch(WORKER+'/plugindata?cardId='+encodeURIComponent(r.cardId))
              .then(function(x){return x.json();})
              .then(function(j){
                var ids = (j && j.cardData && j.cardData.cardContacts) || [];
                var nm = ids.map(function(id){ return CONTACT_NAMES[id]; }).filter(Boolean)[0] || '';
                PERSONS[r.cardId]=nm;
                if(nm){ var el=document.querySelector('.prsn[data-cid="'+r.cardId+'"]'); if(el) el.textContent='('+nm+')'; }
              }).catch(function(){ PERSONS[r.cardId]=''; });
          })).then(next);
        }
        next();
      });
    }
    var WORKER = (window.CONFIG && window.CONFIG.WORKER_URL) || window.WORKER_URL || '';
    document.getElementById('close').onclick=function(){ t.closeModal(); };

    var now=new Date();
    function pad(n){ return n<10?'0'+n:''+n; }
    function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
    var RANGE={ from: fmtDate(new Date(now.getFullYear(), now.getMonth(), 1)), to: fmtDate(now), preset:'month' };
    var ROWS=[], TOTALS={}, FILTER='', ONLY_OPEN=false;
    var VIEW='orders'; // orders | invoices | payroll | repairs
    // просмотр счёта в поп-апе (iframe поверх бухгалтерии)
    function openInvView(qs){
      var h='<div style="position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:86;display:flex;flex-direction:column">'+
        '<div style="display:flex;align-items:center;padding:0 10px;height:46px;background:#1f6ce8;color:#fff;border:1pt solid #0a1733;box-sizing:border-box;box-shadow:0 3px 10px rgba(0,0,0,.55);flex:0 0 auto">'+
        '<button id="invBack" type="button" style="background:transparent;border:none;color:#fff;font-size:14px;cursor:pointer;padding:8px 10px;border-radius:8px">← Назад в бухгалтерию</button>'+
        '<div style="flex:1;text-align:center;font-weight:700;font-size:15px">Счёт на оплату</div>'+
        '<button id="invOvlClose" type="button" style="width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.18);color:#fff;font-size:15px">✕</button></div>'+
        '<iframe src="./invoice-view.html?'+qs+'&t='+Date.now()+'" style="flex:1;border:0;background:var(--bg,#1d2125)"></iframe></div>';
      document.getElementById('invOvlHost').innerHTML=h;
      document.getElementById('invOvlClose').onclick=closeInvView;
      document.getElementById('invBack').onclick=closeInvView;
    }
    // причина архивации: попадёт в журнал и будет видна в списке
    function post(path, body){
      return fetch(WORKER+path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) })
        .then(function(r){ return r.json(); })
        .then(function(j){ if(!j||!j.ok) throw new Error((j&&j.error)||'сервер не подтвердил'); return j; });
    }

    function askArchiveReason(num, done){
      var h='<div id="arcOvl" style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:97;display:flex;align-items:center;justify-content:center;padding:16px">'+
        '<div style="background:var(--bg2);border:1px solid var(--line);border-radius:12px;max-width:440px;width:100%;padding:16px">'+
        '<div style="font-weight:700;margin-bottom:6px">Архивировать счёт №'+esc(num)+'</div>'+
        '<div class="muted" style="font-size:12px;margin-bottom:10px">Счёт останется в базе, но будет отмечен как отменённый: приглушится в списке и в карточках заказов, перестанет учитываться в суммах. У заказов и заявок снимется отметка «счёт выслан», если других действующих счетов по ним нет.</div>'+
        '<input id="arcReason" type="text" placeholder="Причина: ошибка в позиции, клиент попросил переделать…" style="width:100%;box-sizing:border-box;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:12px">'+
        '<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="arcCancel" type="button">Отмена</button>'+
        '<button class="btn" id="arcOk" type="button" style="background:#1f6ce8;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer">В архив</button></div></div></div>';
      var host=document.createElement('div'); host.innerHTML=h; document.body.appendChild(host.firstChild);
      var close=function(){ var o=document.getElementById('arcOvl'); if(o) o.remove(); };
      document.getElementById('arcCancel').onclick=close;
      document.getElementById('arcOk').onclick=function(){ var r=document.getElementById('arcReason').value.trim(); close(); done(r); };
    }

    function closeInvView(){ document.getElementById('invOvlHost').innerHTML=''; }

    // окно ЗАЯВКИ РЕМОНТА: сверху — счета, в которые она включена, ниже — сама
    // карточка заявки (встроенная доска ремонта, открытая на этой заявке)
    function openRepairView(rid){
      var r = (REP_ROWS||[]).filter(function(x){ return String(x.id)===String(rid); })[0];
      if(!r) return;
      var h='<div style="position:fixed;inset:0;background:var(--bg,#1d2125);z-index:86;display:flex;flex-direction:column">'+
        '<div style="display:flex;align-items:center;padding:0 10px;height:46px;background:#1f6ce8;color:#fff;border:1pt solid #0a1733;box-sizing:border-box;box-shadow:0 3px 10px rgba(0,0,0,.55);flex:0 0 auto">'+
        '<button id="rvBack" type="button" style="background:transparent;border:none;color:#fff;font-size:14px;cursor:pointer;padding:8px 10px;border-radius:8px">← Назад в бухгалтерию</button>'+
        '<div style="flex:1;text-align:center;font-weight:700;font-size:15px">Заявка '+esc(r.number)+'</div>'+
        '<button id="rvX" type="button" style="width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.18);color:#fff;font-size:15px">✕</button></div>'+
        '<div style="padding:12px 18px;border-bottom:1px solid var(--line);background:var(--bg2)">'+
        '<div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Счета с этой заявкой</div>'+
        '<div id="rvInvs" class="muted">Загрузка…</div></div>'+
        '<iframe id="rvFrame" src="./repair-board-modal.html?embed=1&openRepair='+encodeURIComponent(r.id)+
          '&memberId='+encodeURIComponent(ME.id||'')+'&memberName='+encodeURIComponent(ME.name||'')+'&admin='+(IS_ADMIN?'1':'0')+
          '&t='+Date.now()+'" style="flex:1;border:0;width:100%;background:var(--bg,#1d2125)"></iframe></div>';
      document.getElementById('invOvlHost').innerHTML=h;
      var back=function(){ closeInvView(); load(); };
      document.getElementById('rvBack').onclick=back;
      document.getElementById('rvX').onclick=back;
      // карточка внутри iframe попросила закрыться — возвращаемся в бухгалтерию
      window.addEventListener('message', function onMsg(ev){
        if(ev && ev.data && ev.data.metalshopEmbedClose){ window.removeEventListener('message', onMsg); back(); }
      });
      fetch(WORKER+'/invoice-list?repairId='+encodeURIComponent(r.id)).then(function(x){return x.json();}).then(function(j){
        var el=document.getElementById('rvInvs'); if(!el) return;
        var rows=(j&&j.ok&&(j.rows||j.invoices))||[];
        if(!rows.length){ el.textContent='эта заявка ещё не включена ни в один счёт'; return; }
        el.innerHTML=rows.map(function(iv){
          var arch = (+iv.archived===1);
          return '<a href="#" class="rvInv" data-n="'+esc(iv.number)+'" style="display:inline-block;margin:0 8px 6px 0;padding:5px 11px;border:1px solid '+(arch?'#6b4a4a':'#579dff')+';border-radius:8px;color:'+(arch?'#a98a8a':'#579dff')+';text-decoration:'+(arch?'line-through':'none')+';opacity:'+(arch?'.6':'1')+'">№'+esc(iv.number)+' · '+money(iv.total)+' ₸'+(arch?' · в архиве':((iv.sent_at||iv.sentAt)?' · выслан':''))+'</a>';
        }).join('');
        [].forEach.call(el.querySelectorAll('.rvInv'), function(a2){
          a2.onclick=function(e){ e.preventDefault(); openInvView('number='+encodeURIComponent(this.getAttribute('data-n'))); };
        });
      }).catch(function(){ var el=document.getElementById('rvInvs'); if(el) el.textContent='не удалось загрузить счета'; });
    }

    // окно ЗАКАЗА: клик по номеру в «Заказах» открывает сам заказ, а не счёт.
    // Сверху — причастные счета (клик по чипу открывает существующий просмотр счёта).
    function openOrderView(cardId){
      var r = ROWS.filter(function(x){ return x.cardId===cardId; })[0];
      if(!r) return;
      var host=document.getElementById('invOvlHost');
      var stat=function(label,on){ return '<span class="chip'+(on?' on':'')+'" style="pointer-events:none">'+(on?'✓ ':'')+label+'</span>'; };
      var person = PERSONS[cardId] ? ' <span class="muted">('+esc(PERSONS[cardId])+')</span>' : '';
      var h='<div style="position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:86;display:flex;flex-direction:column">'+
        '<div style="display:flex;align-items:center;padding:0 10px;height:46px;background:#1f6ce8;color:#fff;border:1pt solid #0a1733;box-sizing:border-box;box-shadow:0 3px 10px rgba(0,0,0,.55);flex:0 0 auto">'+
        '<button id="ordBack" type="button" style="background:transparent;border:none;color:#fff;font-size:14px;cursor:pointer;padding:8px 10px;border-radius:8px">← Назад в бухгалтерию</button>'+
        '<div style="flex:1;text-align:center;font-weight:700;font-size:15px">Заказ №'+esc(r.number)+'</div>'+
        '<button id="ordX" type="button" style="width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.18);color:#fff;font-size:15px">✕</button></div>'+
        '<div style="flex:1;overflow:auto;background:var(--bg,#1d2125);padding:18px 22px">'+
        '<h3 style="margin:0 0 4px">'+esc(r.name)+'</h3>'+
        '<div class="muted" style="margin-bottom:12px">'+esc(r.client||'без компании')+person+' · '+esc(r.date||'')+' · <b style="color:var(--txt)">'+money(r.total)+' ₸</b></div>'+
        '<div style="margin-bottom:14px">'+stat('счёт выслан',r.invoiceSent)+' '+stat('оплачен',r.paid)+' '+stat('сдали',r.delivered)+' '+stat('акт',r.actSigned)+'</div>'+
        '<div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Счета по этому заказу</div>'+
        '<div id="ordInvs" class="muted" style="margin-bottom:16px">Загрузка…</div>'+
        '<div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Состав заказа</div>'+
        '<div id="ordItems" class="muted">Загрузка…</div>'+
        '</div></div>';
      host.innerHTML=h;
      document.getElementById('ordX').onclick=closeInvView;
      document.getElementById('ordBack').onclick=closeInvView; // закрыть попап = вернуться в бухгалтерию
      // причастные счета
      fetch(WORKER+'/invoice-list?cardId='+encodeURIComponent(cardId)).then(function(x){return x.json();}).then(function(j){
        var el=document.getElementById('ordInvs'); if(!el) return;
        var rows=(j&&j.ok&&(j.rows||j.invoices))||[];
        if(!rows.length){ el.textContent='счётов пока нет'; return; }
        el.innerHTML=rows.map(function(iv){
          var arch = (+iv.archived===1);
          return '<a href="#" class="ordInv" data-n="'+esc(iv.number)+'" title="'+(arch?('Счёт отменён'+(iv.archive_reason?(': '+esc(iv.archive_reason)):'')):'Открыть счёт')+'" style="display:inline-block;margin:0 8px 8px 0;padding:6px 12px;border:1px solid '+(arch?'#6b4a4a':'#579dff')+';border-radius:8px;color:'+(arch?'#a98a8a':'#579dff')+';text-decoration:'+(arch?'line-through':'none')+';opacity:'+(arch?'.6':'1')+'">№'+esc(iv.number)+' · '+money(iv.total)+' ₸'+(arch?' · в архиве':((iv.sent_at||iv.sentAt)?' · выслан':''))+'</a>';
        }).join('');
        [].forEach.call(el.querySelectorAll('.ordInv'), function(a2){
          a2.onclick=function(e){ e.preventDefault(); openInvView('number='+encodeURIComponent(this.getAttribute('data-n'))); };
        });
      }).catch(function(){ var el=document.getElementById('ordInvs'); if(el) el.textContent='не удалось загрузить счета'; });
      // состав из расчёта
      fetch(WORKER+'/calc-get?cardId='+encodeURIComponent(cardId)).then(function(x){return x.json();}).then(function(j){
        var el=document.getElementById('ordItems'); if(!el) return;
        var row=(j&&j.ok&&j.row)||null;
        var items=[]; try{ items=JSON.parse(row.line_items)||[]; }catch(e){}
        if(!items.length){ el.textContent='расчёт не заполнен'; return; }
        var rowsH=items.map(function(it){
          var nm=(it.name||'')+(it.thickness?(' '+it.thickness+'мм'):'');
          return '<tr><td>'+esc(nm)+'</td><td class="num">'+(it.qty!=null?esc(String(it.qty)):'')+'</td><td class="num">'+money(it.lineTotal||0)+' ₸</td></tr>';
        }).join('');
        el.innerHTML='<table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left">Позиция</th><th class="num">Кол-во</th><th class="num">Сумма</th></tr></thead><tbody>'+rowsH+
          '<tr><td style="font-weight:700;padding-top:8px">Итого</td><td></td><td class="num" style="font-weight:700;padding-top:8px">'+money(r.total)+' ₸</td></tr></tbody></table>';
      }).catch(function(){ var el=document.getElementById('ordItems'); if(el) el.textContent='не удалось загрузить состав'; });
    }
    window.addEventListener('message', function(e){
      if(e && e.data && e.data.metalshopEmbedClose) closeInvView();
    });
    var INV_ROWS=[], INV_TOTALS={}, INV_SHARE=0.5;
    var INV_KIND='all'; // all | prod | repair — раздел счетов: все / изготовление / по ремонту
    var REP_ROWS=[], REP_TOTALS={};
    var PAY=null, PAY_OPEN={};
    var INV_EDIT=null; // id счёта в режиме правки

    function money(v){ return Math.round(+v||0).toLocaleString('ru-RU'); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

    function isDirector(){
      return Promise.all([ t.member('id'), t.board('memberships'), t.organization('memberships').catch(function(){return null;}) ])
        .then(function(res){ var me=res[0]||{};
          function adminIn(o){ var ms=((o&&o.memberships)||[]).filter(function(x){return x.idMember===me.id;})[0]; return !!(ms&&ms.memberType==='admin'); }
          return adminIn(res[1])||adminIn(res[2]);
        }).catch(function(){ return false; });
    }
    var IS_ADMIN=false;
    var ME={id:'',name:''}; // нужна, чтобы передать личность во вложенное окно ремонта
    try { t.member('id','fullName','username').then(function(m){ ME.id=(m&&m.id)||''; ME.name=(m&&(m.fullName||m.username))||''; }).catch(function(){}); } catch(e){}
    function canUse(){
      return isDirector().then(function(admin){
        IS_ADMIN=admin;
        if(admin) return true;
        return t.member('id').then(function(me){
          return fetch(WORKER+'/worker-perms?memberId='+encodeURIComponent(me.id||''))
            .then(function(r){return r.json();}).then(function(j){ return !!(j&&j.canInvoice); })
            .catch(function(){ return false; });
        });
      });
    }

    function applyPreset(key){
      var n=new Date(), s;
      if(key==='month') s=new Date(n.getFullYear(), n.getMonth(), 1);
      else if(key==='quarter') s=new Date(n.getFullYear(), Math.floor(n.getMonth()/3)*3, 1);
      else if(key==='year') s=new Date(n.getFullYear(), 0, 1);
      else s=new Date(2020,0,1);
      RANGE.from=fmtDate(s); RANGE.to=fmtDate(n); RANGE.preset=key;
      load();
    }

    function load(){
      if(VIEW==='invoices') return loadInvoices();
      if(VIEW==='payroll') return loadPayroll();
      if(VIEW==='repairs') return loadRepairs();
      if(VIEW==='meals') return loadMeals();
      var b=document.getElementById('boot'); if(b) b.textContent='Загружаю заказы…';
      fetch(WORKER+'/acct-list?from='+RANGE.from+'&to='+RANGE.to)
        .then(function(r){return r.json();})
        .then(function(j){
          if(!j||!j.ok) throw new Error((j&&j.error)||'сервер не ответил');
          ROWS=j.rows||[]; TOTALS=j.totals||{};
          render();
          loadPersonNames(); // имена заказчиков (контакты CRM) — подтянутся по мере загрузки
        })
        .catch(function(e){ document.getElementById('app').innerHTML='<div class="empty">Ошибка: '+esc(e&&e.message||e)+'</div>'; });
    }

    function loadPayroll(){

    function bindMeals(){
      var p=document.getElementById('mPrev'), n=document.getElementById('mNext');
      var shift=function(k){ var d=new Date(MEALS_YM+'-01T00:00:00Z'); d.setUTCMonth(d.getUTCMonth()+k); MEALS_YM=d.toISOString().slice(0,7); loadMeals(); };
      if(p) p.onclick=function(){ shift(-1); }; if(n) n.onclick=function(){ shift(1); };
      var sp=document.getElementById('mSavePrices');
      if(sp) sp.onclick=function(){
        post('/meals-set',{ month:{ ym:MEALS_YM,
          priceMeal:+document.getElementById('mPriceMeal').value||0,
          priceDelivery:+document.getElementById('mPriceDel').value||0 }}).then(loadMeals)
          .catch(function(e){ alert('Не сохранилось: '+(e&&e.message||e)); });
      };
      var saveRow=function(date){
        var meals=document.querySelector('.mMeals[data-d="'+date+'"]').value;
        var del=document.querySelector('.mDel[data-d="'+date+'"]').value;
        var note=document.querySelector('.mNote[data-d="'+date+'"]').value;
        post('/meals-set',{ date:date, meals:meals===''?null:+meals, delivery:del===''?null:+del, note:note })
          .then(loadMeals).catch(function(e){ alert('Не сохранилось: '+(e&&e.message||e)); });
      };
      [].forEach.call(document.querySelectorAll('.mMeals,.mDel'), function(el){
        el.onchange=function(){ saveRow(this.getAttribute('data-d')); };
      });
      [].forEach.call(document.querySelectorAll('.mNote'), function(el){
        el.onblur=function(){ saveRow(this.getAttribute('data-d')); };

    function _bindChipsBody(){
      [].forEach.call(document.querySelectorAll('.oinfo'), function(el){
        el.addEventListener('click', function(e){ e.preventDefault(); openOrderView(this.getAttribute('data-card')); });
      });
      [].forEach.call(document.querySelectorAll('.chip'), function(c){
        c.onclick=function(){
          var cardId=this.getAttribute('data-card'), field=this.getAttribute('data-f');
          var r=ROWS.filter(function(x){return x.cardId===cardId;})[0]; if(!r) return;
          var newVal=!r[field]; var el=this; el.classList.add('busy');
          var p = (field==='paid')
            ? fetch(WORKER+'/calc-paid',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cardId:cardId,paid:newVal})})
            : fetch(WORKER+'/acct-set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cardId:cardId,field:field,value:newVal?1:0})});
          p.then(function(x){return x.json();}).then(function(j){
            if(!j||!j.ok) throw new Error((j&&j.error)||'сервер не подтвердил');
            r[field]=newVal;
            if(field==='paid'){
              r.paidAt=newVal?new Date().toISOString():null;
              // диагностика автоперемещения: показываем, что сделал сервер с карточкой
              if(newVal){
                var MRS={ ok:'↪ карточка перемещена в колонку очереди',
                  'no-target-list':'⚠ карточка НЕ перемещена: на доске нет колонки со словом «очеред» или «оплачен» в названии',
                  'not-in-waiting':'карточка не перемещена: она не в колонке «Ждём оплату» (из других колонок не трогаем)',
                  'already-there':'карточка уже в колонке очереди',
                  'already-paid':'заказ уже был оплачен ранее — карточку не трогаем (снимите и поставьте галочку, чтобы повторить)',
                  'put-failed':'⚠ Trello отказал в перемещении — похоже, у токена Power-Up нет права записи (write)',
                  'card-fetch':'⚠ не удалось прочитать карточку в Trello (проверьте ключ/токен)',
                  'lists-fetch':'⚠ не удалось прочитать колонки доски',
                  'no-auth':'⚠ на сервере не настроены TRELLO_KEY/TRELLO_TOKEN',
                  'error':'⚠ ошибка при обращении к Trello' };
                var mtxt = MRS[j.moveReason] || (j.moved?MRS.ok:'');
                if(mtxt){
                  var tEl=document.getElementById('mvToast');
                  if(!tEl){ tEl=document.createElement('div'); tEl.id='mvToast';
                    tEl.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#22272b;border:1px solid #3a414a;border-radius:10px;padding:10px 16px;font-size:13px;z-index:99;box-shadow:0 4px 16px rgba(0,0,0,.4)';
                    document.body.appendChild(tEl); }
                  tEl.textContent=mtxt;
                  tEl.style.color = mtxt.indexOf('⚠')>=0 ? '#e8c07d' : '#7ee2b8';
                  tEl.style.display='';
                  clearTimeout(tEl._t); tEl._t=setTimeout(function(){ tEl.style.display='none'; }, 9000);
                }
              }
            }
            // пересчитать итоги локально
            var T={orders:0,revenue:0,paidRev:0,unpaidRev:0,closed:0};
            ROWS.forEach(function(x){ T.orders++; T.revenue+=x.total; if(x.paid)T.paidRev+=x.total; else T.unpaidRev+=x.total;
              if(x.invoiceSent&&x.paid&&x.delivered&&x.actSigned)T.closed++; });
            TOTALS=T; render();
          }).catch(function(e){ alert('Не удалось сохранить: '+(e&&e.message||e)); el.classList.remove('busy'); });
        };
      });
    }

         '<label>О отпуск <input class="ap" data-k="o" value="'+AP.o+'" style="width:56px;text-align:right"> %</label>'+
         '<label>Н неявка <input class="ap" data-k="n" value="'+AP.n+'" style="width:56px;text-align:right"> %</label>'+
         '<label>В выходной <input class="ap" data-k="v" value="'+AP.v+'" style="width:56px;text-align:right"> %</label>'+
         '<button class="btn" id="apSave" type="button">Сохранить правила</button><span id="apMsg" class="muted"></span></div>';
      // --- окладники ---
      // ведомость на ВСЕХ: сдельщики, окладники и «оклад + сдельная».
      // paySlip приходит от нового worker.js; старый отдаёт только salaried — тогда работаем по нему
      var ss=(PAY.paySlip||PAY.salaried||[]).filter(function(p){ return !f || p.name.toLowerCase().indexOf(f)>=0; });
      h+='<h3 style="margin:14px 0 6px">Зарплата к выдаче</h3>';
      if(!ss.length) h+='<div class="empty">Нет начислений за период.</div>';
      else {
        h+='<div class="muted" style="margin-bottom:6px">Оклад начислен = оклад ÷ рабочие дни периода ('+(PAY.workdays||0)+') × оплачиваемые дни. Оплачиваемые дни = Σ(дни статуса × его %). Выход в выходной с отметкой «Я» оплачивается сверх нормы. Сдельная — доля по сданным заказам, та же сумма, что в разделе «Сдельная зарплата» выше (в ФОТ не задваивается). К выдаче = оклад начислен + сдельная.</div>';
        h+='<table><thead><tr><th>Работник</th><th class="num">Оклад/мес</th><th class="num">Явок</th>'+
           '<th class="num">Б/О/Н/В</th><th class="num">Оплач. дней</th>'+
           '<th class="num">Оклад начислен</th><th class="num">Сдельная</th><th class="num">К выдаче</th></tr></thead><tbody>';
        var TS={acc:0,pc:0,pay:0};
        var TYPE={piece:'сдельная', salary:'оклад', both:'оклад + сдельная'};
        ss.forEach(function(p){
          // старый worker.js полей piece/payTotal не отдаёт — тогда считаем как раньше
          var pc = +p.piece || 0;
          var pay = (p.payTotal != null) ? p.payTotal : (p.accrued + pc);
          var sal = (p.hasSalary !== undefined) ? p.hasSalary : (+p.salary > 0);
          TS.acc+=p.accrued; TS.pc+=pc; TS.pay+=pay;
          h+='<tr><td>'+esc(p.name)+
             ' <span class="muted" style="font-size:11px">· '+esc(TYPE[p.payType]||'')+'</span>'+
             (p.noTimesheet&&sal?' <span style="font-size:11px;color:#e8c07d" title="В табеле за период нет ни одной отметки — начисление нулевое">⚠ табель пуст</span>':'')+'</td>'+
             '<td class="num'+(sal?'':' muted')+'">'+(sal?(money(p.salary)+' ₸'):'—')+'</td>'+
             '<td class="num"><b>'+p.present+'</b> / '+p.workdays+'</td>'+
             '<td class="num muted">'+p.sick+' / '+p.vacation+' / '+p.absent+' / '+(p.dayoff||0)+'</td>'+
             '<td class="num'+(p.payDays!=null?'':' muted')+'">'+(p.payDays!=null?p.payDays:'—')+'</td>'+
             '<td class="num'+(sal?'':' muted')+'">'+(sal?(money(p.accrued)+' ₸'):'—')+'</td>'+
             '<td class="num'+(pc?'':' muted')+'">'+(pc?(money(pc)+' ₸'):'—')+'</td>'+
             '<td class="num"><b>'+money(pay)+' ₸</b></td></tr>';
        });
        h+='</tbody><tfoot><tr>'+
           '<td colspan="5" style="font-weight:700">Итого</td>'+
           '<td class="num">'+money(TS.acc)+' ₸</td>'+
           '<td class="num">'+money(TS.pc)+' ₸</td>'+
           '<td class="num"><b style="color:var(--green,#4bce97)">'+money(TS.pay)+' ₸</b></td>'+
           '</tr></tfoot></table>';
        // ведомость обязана сходиться с ФОТ сверху; расхождение — повод разбираться, а не гадать
        if(PAY.paySlip && T.all!=null && Math.abs(TS.pay-T.all)>1){
          h+='<div style="color:#f28b82;font-size:12px;margin-top:6px">⚠ Итого к выдаче ('+money(TS.pay)+' ₸) не сходится с ФОТ ('+money(T.all)+' ₸). Сообщите разработчику.</div>';
        }
      }
      return h;
    }

    function _bindRepairChips(){
      [].forEach.call(document.querySelectorAll('.rchip'), function(c){
        c.onclick=function(){
          var id=+this.getAttribute('data-id'), field=this.getAttribute('data-f');
          var r=REP_ROWS.filter(function(x){return x.id===id;})[0]; if(!r) return;
          var newVal=!r[field]; var el=this; el.classList.add('busy');
          if(field==='invoiceSent' && newVal && !r.priced){
            if(!confirm('У заявки '+r.number+' ещё не задана цена клиенту. Отметить счёт высланным всё равно?')){ el.classList.remove('busy'); return; }
          }
          fetch(WORKER+'/repair-flags',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,field:field,value:newVal?1:0})})
            .then(function(x){return x.json();}).then(function(j){
              if(!j||!j.ok) throw new Error((j&&j.error)||'сервер не подтвердил');
              r[field]=newVal;
              if(field==='paid'){ r.paidAt=newVal?new Date().toISOString():null; }
              var T={orders:0,revenue:0,paidRev:0,unpaidRev:0,closed:0};
              REP_ROWS.forEach(function(x){ T.orders++; T.revenue+=x.total; if(x.paid)T.paidRev+=x.total; else T.unpaidRev+=x.total;
                if(x.invoiceSent&&x.paid&&x.delivered&&x.actSigned)T.closed++; });
              REP_TOTALS=T; render();
            }).catch(function(e){ alert('Не удалось сохранить: '+(e&&e.message||e)); el.classList.remove('busy'); });
        };
      });
    }

        var coef={};
        [].forEach.call(document.querySelectorAll('.ap'), function(i){ coef[i.getAttribute('data-k')]=+String(i.value).replace(',','.')||0; });
        var btn=this, msg=document.getElementById('apMsg');
        btn.disabled=true; btn.textContent='Сохраняю…';
        fetch(WORKER+'/att-pay-save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({coef:coef})})
          .then(function(r){return r.json();})
          .then(function(j){ if(!j||!j.ok) throw new Error((j&&j.error)||'?');
            btn.textContent='✓ Сохранено'; btn.style.color='#4bce97'; btn.style.borderColor='#2e5c44';
            msg.textContent='Начисления пересчитываются…';
            setTimeout(function(){ loadPayroll(); }, 600);
          })
          .catch(function(e){ btn.disabled=false; btn.textContent='Сохранить правила'; alert('Не сохранилось: '+(e&&e.message||e)); });
      };
      [].forEach.call(document.querySelectorAll('.iedit'), function(b){
        b.onclick=function(){ INV_EDIT=+this.getAttribute('data-id'); render(); };
      });
      [].forEach.call(document.querySelectorAll('.iecancel'), function(b){
        b.onclick=function(){ INV_EDIT=null; render(); };
      });
      [].forEach.call(document.querySelectorAll('.iesave'), function(b){
        b.onclick=function(){
          var id=+this.getAttribute('data-id'); var btn=this;
          var num=document.querySelector('.ie-num').value.trim();
          var dateIso=document.querySelector('.ie-date').value;
          var buyer=document.querySelector('.ie-buyer').value.trim();
          var total=+String(document.querySelector('.ie-total').value).replace(/[^\d.]/g,'');
          if(!num){ alert('Номер счёта не может быть пустым.'); return; }
          if(!(total>=0)){ alert('Сумма должна быть числом.'); return; }
          btn.disabled=true; btn.textContent='Сохраняю…';
          fetch(WORKER+'/invoice-update',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({id:id,number:num,dateIso:dateIso,buyer:buyer,total:total})})
            .then(function(r){return r.json();})
            .then(function(j){ if(!j||!j.ok) throw new Error((j&&j.error)||'сервер не подтвердил'); INV_EDIT=null; loadInvoices(); })
            .catch(function(e){ btn.disabled=false; btn.textContent='Сохранить'; alert('Не сохранилось: '+(e&&e.message||e)); });
        };
      });
      [].forEach.call(document.querySelectorAll('.prow'), function(row){
        row.onclick=function(){ var w=this.getAttribute('data-w'); PAY_OPEN[w]=!PAY_OPEN[w]; render(); };
      });
      [].forEach.call(document.querySelectorAll('.ohide'), function(b){
        b.onclick=function(){ var cardId=this.getAttribute('data-card');
          if(!confirm('Скрыть этот заказ из бухгалтерии, панели руководителя и финансов? Расчёт останется в базе; вернуть можно будет через Claude.')) return;
          fetch(WORKER+'/calc-hide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cardId:cardId,hidden:1})})
            .then(function(r){return r.json();}).then(function(j){ if(!j.ok) throw new Error(j.error||'?'); load(); })
            .catch(function(e){ alert('Не удалось: '+(e&&e.message||e)); });
        };
      });
      [].forEach.call(document.querySelectorAll('.invnum'), function(el){
        el.addEventListener('click', function(e){ e.preventDefault(); openInvView('number='+encodeURIComponent(this.getAttribute('data-num'))); });
      });
      [].forEach.call(document.querySelectorAll('.idel'), function(b){
        b.onclick=function(){ var id=+this.getAttribute('data-id'); var num=this.getAttribute('data-num');
          if(!confirm('УДАЛИТЬ счёт №'+num+' из журнала безвозвратно? Автопривязка банковских платежей к этому номеру перестанет работать. Для тестовых счетов — то, что нужно.')) return;
          fetch(WORKER+'/invoice-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})})
            .then(function(r){return r.json();}).then(function(j){ if(!j.ok) throw new Error(j.error||'?'); load(); })
            .catch(function(e){ alert('Не удалось: '+(e&&e.message||e)); });
        };
      });
      bindChips();
    }

    function bindChips(){
      _bindChipsBody();
      _bindRepairChips();
    }

        canUse().then(function(allowed){
      if(!allowed){
        document.getElementById('boot').textContent='Раздел доступен руководителю и сотрудникам с правом «выставлять счета» (включается в «Зарплата / Работники»).';
        return;
      }
      load();
    }).catch(function(e){
      document.getElementById('boot').textContent='Ошибка: '+(e&&e.message||e);
    });
  </script>
</body>
</html>
