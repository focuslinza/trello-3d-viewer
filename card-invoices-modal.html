<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Счета по заказу</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.72/pdfmake.min.js"></script>
  <script src="./dejavu-vfs.js"></script>
  <script src="./invoice-doc.js?v=3"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
  <script src="./invoice-xls.js?v=1" defer></script>
  <script src="./pay-dialog.js?v=20"></script>
  <style>
    :root{ --bg:#1d2125; --bg2:#22272b; --line:#3c444c; --txt:#e6edf3; --muted:#9fadbc; --accent:#4f7cff; --green:#3aa657; --red:#d4574e; }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
    .wrap{padding:16px 16px 4px;max-width:932px;margin:0 auto}
    .sec{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
    h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
    .muted{color:var(--muted)} .small{font-size:12px}
    table{width:100%;border-collapse:collapse;margin-top:6px}
    th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:13px}
    th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
    td.num,th.num{text-align:right;white-space:nowrap}
    .btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
    .btn.green{background:var(--green)}
    .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
    .btn.red{background:transparent;border:1px solid #7a3a32;color:#e8a59d}
    .inv{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;background:#1f2428}
    .inv-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
    .inv-no{font-weight:700;font-size:15px}
    .inv-sum{font-weight:700;font-size:17px;white-space:nowrap}
    .inv-meta{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:6px;font-size:13px}
    .inv-sent{margin-top:6px;font-size:12px;color:#4bce97}
    .inv-unsent{margin-top:6px;font-size:12px;color:#f5cd47}
    .inv-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
    .inv-act .sp{flex:1}
    .bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:flex-end;gap:10px}
    .lockbox{background:#3a2320;border:1px solid #7a3a32;border-radius:10px;padding:16px;color:#e8a59d;text-align:center;margin-top:24px}
  </style>
</head>
<body>
  <div class="wrap" id="app"><div class="muted" id="boot">Проверка доступа…</div></div>

<script>
  var t = window.TrelloPowerUp.iframe();
  var WORKER = (window.CONFIG && window.CONFIG.WORKER_URL) || window.WORKER_URL || '';
  var cardId = t.arg('cardId') || null;
  var ROWS = [], SENDS = [];
  var IS_DIRECTOR = false, CAN_DEL = false, ME_ID = '';

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function money(v){ return (window.INVOICE&&window.INVOICE.money)?window.INVOICE.money(v):(Math.round(+v||0)).toLocaleString('ru-RU'); }
  function boot(m){ var b=document.getElementById('boot'); if(b) b.textContent=m; }

  function isDirector(){
    return Promise.all([ t.member('id'), t.board('memberships'), t.organization('memberships').catch(function(){return null;}) ])
      .then(function(res){ var me=res[0]||{};
        function adminIn(o){ var ms=((o&&o.memberships)||[]).filter(function(x){return x.idMember===me.id;})[0]; return !!(ms&&ms.memberType==='admin'); }
        return adminIn(res[1])||adminIn(res[2]);
      }).catch(function(){ return false; });
  }
  // доступ: директор ИЛИ работник с правом «может выставлять счёт» (тот же лёгкий endpoint, без зарплатных данных)
  function checkAccess(){
    return isDirector().then(function(admin){
      IS_DIRECTOR = admin; CAN_DEL = admin;
      return t.member('id').then(function(me){
        ME_ID = (me&&me.id)||''; window.__msMemberId = ME_ID;
        return fetch(WORKER+'/worker-perms?memberId='+encodeURIComponent(ME_ID))
          .then(function(r){return r.json();})
          .then(function(j){
            // удалять лишние счета: руководство, бухгалтер, менеджер по продажам (решение 11.11.2026)
            if (j && (j.canDashboard || j.canInvoice || j.isSalesManager)) CAN_DEL = true;
            return admin || !!(j&&(j.canIssueInvoice||j.canInvoice||j.isSalesManager)); })
          .catch(function(){ return false; });
      });
    });
  }

  function parse(s, d){ try{ var v=JSON.parse(s); return v==null?d:v; }catch(e){ return d; } }
  function ruDateFromIso(s){
    var M=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    var p=String(s||'').split('-'); if(p.length!==3) return s||'';
    return (+p[2])+' '+M[(+p[1]||1)-1]+' '+p[0]+' г.';
  }

  function load(){
    boot('Загружаю счета…');
    return fetch(WORKER+'/invoice-list?cardId='+encodeURIComponent(cardId||''))
      .then(function(r){ if(r.status===404) throw {code:404}; return r.json(); })
      .then(function(j){
        if(!j||!j.ok) throw new Error((j&&j.error)||'неизвестная ошибка');
        ROWS=(j.rows||[]).map(function(r){
          return { id:r.id, number:r.number, dateIso:r.date_iso||'', dateText:r.date_text||'', contract:r.contract||'Без договора',
                   supplier:parse(r.supplier_json,null), buyer:parse(r.buyer_json,null), items:parse(r.items_json,[]),
                   total:+r.total||0, createdAt:r.created_at||'', sentTo:r.sent_to||'', sentAt:r.sent_at||'', archived:+r.archived===1,
                   archReason:r.archive_reason||'', archAt:r.archived_at||'', archBy:r.archived_by||'', raw:r };
        });
        // удалённые/аннулированные — отдельно, в «Историю счетов» (решение Асхата, 11.11.2026)
        HIST=ROWS.filter(function(r){ return r.archived; });
        ROWS=ROWS.filter(function(r){ return !r.archived; });
        return fetch(WORKER+'/order-status?cardId='+encodeURIComponent(cardId||'')).then(function(r){return r.json();}).then(function(st){
          SENDS=((st&&st.history)||[]).filter(function(x){ return x.field==='invoiceSent' && x.value && /^выслан:/.test(String(x.why||'')); });
        }).catch(function(){}).then(render).then(loadPay);
      })
      .catch(function(e){
        if(e&&e.code===404){ boot(''); document.getElementById('app').innerHTML=
          '<div class="sec"><div class="muted">Журнал счетов ещё не подключён на сервере (Worker не обновлён). Обновите Worker — и здесь появятся все счета, в которые входит этот заказ.</div></div>'; return; }
        boot('Ошибка загрузки: '+(e&&e.message||e));
      });
  }

  function setupFonts(){
    if(!window.pdfMake) return false;
    pdfMake.vfs = window.DEJAVU_VFS;
    pdfMake.fonts = { DejaVu: { normal:'DejaVuSans.ttf', bold:'DejaVuSans-Bold.ttf', italics:'DejaVuSans.ttf', bolditalics:'DejaVuSans-Bold.ttf' } };
    return true;
  }
  function buildDoc(row){
    if(!setupFonts()){ alert('Не удалось загрузить генератор PDF (pdfMake). Проверьте интернет.'); return null; }
    if(!row.supplier || !row.buyer){ alert('В этом счёте не сохранены реквизиты (старый формат) — открыть нельзя.'); return null; }
    var data={ supplier:row.supplier, buyer:row.buyer, number:String(row.number||''),
               date:row.dateText||ruDateFromIso(row.dateIso), contract:row.contract||'Без договора',
               items:row.items||[], nds:null, cashInfo:{ kind:row.cashKind||row.cash_kind||'', note:row.cashNote||row.cash_note||'' } };
    return { dd:window.INVOICE.buildInvoiceDoc(data),
             fname:'Счет_'+data.number+'_'+(row.buyer&&row.buyer.name?String(row.buyer.name).replace(/[^0-9A-Za-zА-Яа-яЁё]+/g,'_').slice(0,30):'клиент')+'.pdf' };
  }
  function downloadPdf(row){
    var b=buildDoc(row); if(!b) return;
    pdfMake.createPdf(b.dd).download(b.fname);
  }
  // просмотр без скачивания: собираем PDF в память и открываем во всплывающем окне
  function previewPdf(row){
    var b=buildDoc(row); if(!b) return;
    // окно открываем СРАЗУ по клику (иначе браузер заблокирует), PDF подставляем когда готов
    var w=window.open('','_blank','width=920,height=1000');
    if(!w){ alert('Браузер заблокировал всплывающее окно. Разрешите всплывающие окна для trello.com и нажмите «Просмотр» ещё раз.'); return; }
    try { w.document.write('<title>Счёт № '+String(row.number||'').replace(/[<>&"]/g,'')+'</title><body style="margin:0;background:#333;color:#ccc;font-family:Arial"><div style="padding:20px">Готовлю счёт…</div></body>'); } catch(e){}
    pdfMake.createPdf(b.dd).getBlob(function(blob){
      var url=URL.createObjectURL(blob);
      // просмотр и скачивание в одном окне (решение Асхата, 24.11.2026): сверху кнопка «Скачать» с нормальным именем файла
      try {
        var nm=String(b.fname||('Счет_'+row.number+'.pdf')).replace(/[<>&"]/g,'');
        w.document.open();
        w.document.write('<!doctype html><meta charset="utf-8"><title>Счёт № '+String(row.number||'').replace(/[<>&"]/g,'')+'</title>'+
          '<body style="margin:0;background:#333;font-family:Arial,sans-serif;display:flex;flex-direction:column;height:100vh">'+
          '<div style="flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 12px;background:#22272b;color:#dfe5ec;font-size:14px">'+
          '<b style="flex:1">Счёт № '+String(row.number||'').replace(/[<>&"]/g,'')+'</b>'+
          '<a href="'+url+'" download="'+nm+'" style="background:#3b6cf6;color:#fff;text-decoration:none;font-weight:700;padding:7px 14px;border-radius:7px">⬇ Скачать</a></div>'+
          '<iframe src="'+url+'" style="flex:1;border:0;width:100%;background:#fff"></iframe></body>');
        w.document.close();
      }
      catch(e){ try{ w.close(); }catch(_){} alert('Не удалось открыть просмотр: '+(e&&e.message||e)); }
    });
  }
  var HIST=[];
  function localAt(u){ try{ var d=new Date(String(u).replace(' ','T')+(/Z|[+-]\d\d:?\d\d$/.test(u)?'':'Z')); if(isNaN(d)) return String(u).slice(0,16); var p=function(n){return (n<10?'0':'')+n;}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }catch(e){ return String(u).slice(0,16); } }
  // СЧЁТ НА ОСТАТОК — перенесён сюда из окна счёта (решение Асхата, 24.11.2026)
  function residInvoice(row){
    var sum=prompt('Счёт на остаток по счёту №'+row.number+'.\nСумма остатка (оставьте как есть — посчитаем «сумма счёта минус поступления»):','');
    if(sum===null) return;
    fetch(WORKER+'/invoice-residual',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ id:row.id, amount:(sum?+sum:0)||0, byName:ME_NAME }) })
      .then(function(r){return r.json();}).then(function(j){
        if(!j||!j.ok) throw new Error((j&&j.error)||'сервер не подтвердил');
        alert('Создан счёт №'+j.number+' на остаток '+money(j.amount)+' ₸ по счёту №'+j.parent+'.\nВ 1С вносите этот же номер.'); load();
      }).catch(function(e){ alert('Не удалось: '+(e&&e.message||e)); });
  }
  function delInvoice(row){
    if(!CAN_DEL) return;
    if(!confirm('Удалить счёт № '+row.number+' на '+money(row.total)+' ₸?\n\nСчёт перестанет действовать (уйдёт из журнала и бухгалтерии), но запись о нём — номер, дата, сумма, кто удалил — останется ниже в «Истории счетов», PDF можно будет открыть. Оплаты по заказу не трогаются.')) return;
    fetch(WORKER+'/invoice-delete',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ id:row.id, memberId:ME_ID, boardAdmin:IS_DIRECTOR?1:0 }) })
      .then(function(r){return r.json();}).then(function(j){
        if(j&&j.ok){ load(); }
        else alert('Не удалось удалить: '+((j&&j.error)||'?'));
      }).catch(function(e){ alert('Сеть: '+(e&&e.message||e)); });
  }

  // ИНДИКАТОР ОПЛАТЫ ПОД СУММОЙ СЧЁТА (решение Асхата, 20.11.2026) — одно из трёх: зелёный «✓✓ оплачено»,
  // янтарный «оплачено сумма · процент», красный «не оплачено»
  function payChip(p){
    if(!p) return '<span class="muted" style="font-size:12px">оплата: …</span>';
    if(p.err) return '';
    var st='display:inline-block;margin-top:4px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:700;border:1px solid;';
    var got=+p.paidSum||0, tot=+p.total||0, pend=+p.pendingSum||0;
    var wait=pend>0?'<div class="muted" style="font-size:11.5px;margin-top:2px">ждёт подтверждения '+money(pend)+' ₸</div>':'';
    if(tot>0 && tot-got<=1) return '<span style="'+st+'color:#0f7a43;background:#e3f6ea;border-color:#9ad8b3" title="Оплачено '+money(got)+' ₸ из '+money(tot)+' ₸">✓✓ оплачено</span>'+wait;
    if(got>0) return '<span style="'+st+'color:#8a5a00;background:#fff3d6;border-color:#f0c869" title="Оплачено '+money(got)+' ₸ из '+money(tot)+' ₸, остаток '+money(Math.max(0,tot-got))+' ₸">'+money(got)+' ₸ · '+Math.min(99,Math.floor(got/tot*100))+'%</span>'+wait;
    return '<span style="'+st+'color:#c22d1f;background:#fdeceb;border-color:#f2b0a9" title="По счёту не поступило ни одной подтверждённой оплаты">не оплачено</span>'+wait;
  }
  function loadPay(){
    ROWS.forEach(function(r,i){
      fetch(WORKER+'/invoice-payment?number='+encodeURIComponent(r.number)+(cardId?'&cardId='+encodeURIComponent(cardId):''))
        .then(function(x){ return x.json(); })
        .then(function(j){ r.pay=(j&&j.ok)?{ total:j.total, paidSum:j.paidSum, pendingSum:j.pendingSum, rest:j.rest }:{ err:1 }; })
        .catch(function(){ r.pay={ err:1 }; })
        .then(function(){ var el=document.getElementById('invPay'+i); if(el && ROWS[i]===r) el.innerHTML=payChip(r.pay);
          // по счёту внесена оплата — удалять его нельзя (решение Асхата, 24.11.2026)
          if(r.pay && (+r.pay.paidSum>0 || +r.pay.pendingSum>0)){ var d=document.querySelector('.del[data-i="'+i+'"]'); if(d){ var sp=d.previousElementSibling; d.remove(); if(sp && sp.className==='sp') sp.remove(); } } });
    });
  }
  function render(){
    window.__rendered=true;   // размер окна сообщаем доске только когда список уже нарисован
    var h='<div class="sec"><h3>Счета, в которые входит этот заказ</h3>';
    if(!ROWS.length){
      h+='<div class="muted">По этому заказу счета ещё не выставлялись. Нажмите «Счёт на оплату» в карточке, скачайте PDF — и счёт появится здесь автоматически.</div>';
    } else {
      // карточки счетов вместо широкой таблицы: всё внутри рамки, кнопки переносятся (12.11.2026)
      ROWS.forEach(function(r,i){
        var supLbl=(r.supplier&&(r.supplier.label||r.supplier.name))||'—';
        var dt=r.dateIso?String(r.dateIso).slice(0,10).split('-').reverse().join('.'):String(r.createdAt||'').slice(0,10);
        h+='<div class="inv">'+
          '<div class="inv-top"><div><span class="inv-no">Счёт № '+esc(r.number)+'</span><span class="muted"> от '+esc(dt)+'</span></div>'+
            '<div style="text-align:right"><div class="inv-sum">'+money(r.total)+' ₸</div><div class="inv-pay" id="invPay'+i+'">'+payChip(r.pay)+'</div></div></div>'+
          '<div class="inv-meta"><span><span class="muted">Покупатель:</span> '+esc((r.buyer&&r.buyer.name)||'—')+'</span><span><span class="muted">Поставщик:</span> '+esc(supLbl)+'</span></div>'+
          (r.sentTo?'<div class="inv-sent">✓ выслан: '+esc(r.sentTo)+(r.sentAt?' · '+esc(String(r.sentAt).slice(0,16).replace("T"," ")):'')+'</div>':'<div class="inv-unsent">не отмечен как высланный</div>')+
          '<div class="inv-act">'+
            '<button class="btn green pay" data-i="'+i+'" type="button" title="Отметить оплату заказа: сумма, дата, способ и куда">₸ Оплата</button>'+
            '<button class="btn vw" data-i="'+i+'" type="button" title="Открыть счёт в PDF — там же его можно скачать или распечатать">Просмотр</button>'+
            '<button class="btn ghost ed" data-i="'+i+'" type="button" title="Исправить строки, разделить, выставить остаток или аннулировать — номер счёта не меняется">✎ Изменить</button>'+
            '<button class="btn ghost rs" data-i="'+i+'" type="button" title="Выставить счёт на неоплаченный остаток по этому счёту — номер возьмётся из системы">🔹 Счёт на остаток</button>'+
            '<button class="btn ghost x1" data-i="'+i+'" type="button" title="Файл в формате счёта 1С — бухгалтер импортирует его в 1С:Бухгалтерию">📗 Excel для 1С</button>'+
            ((CAN_DEL && !(r.pay && (+r.pay.paidSum>0 || +r.pay.pendingSum>0)))?'<span class="sp"></span><button class="btn red del" data-i="'+i+'" type="button" title="Удалить (запись останется в истории счетов)">✕ Удалить</button>':'')+
          '</div>'+
        '</div>';
      });
      h+='<div class="small muted" style="margin-top:10px">PDF собирается заново из сохранённых данных счёта — он идентичен тому, что скачивался при выставлении.</div>';
    }
    h+='</div>';
    if (HIST.length) {
      h+='<div class="sec"><h3>История счетов — удалённые и аннулированные</h3><table><thead><tr><th>№ счёта</th><th>Дата счёта</th><th class="num">Сумма</th><th>Что случилось</th><th></th></tr></thead><tbody>'+
        HIST.map(function(r,i){
          return '<tr style="opacity:.8"><td><s>'+esc(r.number)+'</s></td>'+
            '<td class="small">'+esc(r.dateIso?String(r.dateIso).slice(0,10):String(r.createdAt||'').slice(0,10))+'</td>'+
            '<td class="num">'+money(r.total)+' ₸</td>'+
            '<td class="small" style="color:#e8a59d">'+esc(r.archReason||'аннулирован')+(r.archBy?' · '+esc(r.archBy):'')+(r.archAt?' · '+esc(localAt(r.archAt)):'')+'</td>'+
            '<td style="text-align:right"><button class="btn hv" data-h="'+i+'" type="button" title="Открыть PDF удалённого счёта">Просмотр</button></td></tr>';
        }).join('')+'</tbody></table></div>';
    }
    // КОМУ ОТПРАВЛЯЛИ (решение Асхата, 05.11.2026): отметки «выслан» по этому заказу из журнала
    if (SENDS.length) {
      h+='<div class="sec"><h3>Кому отправляли счёт по этому заказу</h3><table><tbody>'+SENDS.map(function(x){
        return '<tr><td class="small muted" style="white-space:nowrap">'+esc(String(x.at||'').slice(0,16))+'</td><td>'+esc(String(x.why||'').replace(/^выслан:\s*/,''))+'</td><td class="small muted">'+esc(x.by||'')+'</td></tr>';
      }).join('')+'</tbody></table></div>';
    }
    document.getElementById('app').innerHTML=h;
    [].forEach.call(document.querySelectorAll('.x1'), function(b){ b.onclick=function(){ var r=ROWS[+this.getAttribute('data-i')];
      if(!window.INVOICE_XLS){ alert('Генератор Excel не загрузился — проверьте интернет.'); return; } window.INVOICE_XLS.download(r.raw); }; });
    [].forEach.call(document.querySelectorAll('.rs'), function(b){ b.onclick=function(){ residInvoice(ROWS[+this.getAttribute('data-i')]); }; });
    [].forEach.call(document.querySelectorAll('.dl'), function(b){ b.onclick=function(){ downloadPdf(ROWS[+this.getAttribute('data-i')]); }; });
    [].forEach.call(document.querySelectorAll('.hv'), function(b){ b.onclick=function(){ previewPdf(HIST[+this.getAttribute('data-h')]); }; });
    [].forEach.call(document.querySelectorAll('.vw'), function(b){ b.onclick=function(){ previewPdf(ROWS[+this.getAttribute('data-i')]); }; });
    [].forEach.call(document.querySelectorAll('.del'), function(b){ b.onclick=function(){ delInvoice(ROWS[+this.getAttribute('data-i')]); }; });
    [].forEach.call(document.querySelectorAll('.ml'), function(b){ b.onclick=function(){ mailInvoice(ROWS[+this.getAttribute('data-i')]); }; });
    [].forEach.call(document.querySelectorAll('.ed'), function(b){ b.onclick=function(){ openEdit(ROWS[+this.getAttribute('data-i')]); }; });
    // ОПЛАТА ПРЯМО ИЗ «СЧЕТОВ ПО ЗАКАЗУ» (решение Асхата, 10.11.2026): то же окно оплаты, что в
    // бухгалтерии и счёте — сумма, дата, способ и куда; подтверждает учредитель
    [].forEach.call(document.querySelectorAll('.pay'), function(b){ b.onclick=function(){
      var row=ROWS[+this.getAttribute('data-i')];
      if(!window.openPayDialog){ alert('Окно оплаты не загрузилось — закройте и откройте снова.'); return; }
      // счёт на несколько заказов — оплата вносится по счёту целиком и сама делится между заказами (19.11.2026)
      var ttl=(row.buyer&&row.buyer.name)?row.buyer.name:'';
      if(window.openInvoicePay) window.openInvoicePay({ number: row.number, cardId: cardId, title: ttl, onDone: function(){ load(); } });
      else window.openPayDialog({ cardId: cardId, title: 'по счёту № '+row.number+(ttl?(' · '+ttl):''), onDone: function(){ load(); } });
    }; });
  }
  // ПРАВКА СЧЁТА ПРЯМО ИЗ КАРТОЧКИ (решение Асхата, 05.11.2026): то же окно счёта, что
  // в бухгалтерии (исправить строки без смены номера, разделить, остаток, аннулировать),
  // поверх списка. Доступ уже проверен выше: руководитель или право «выставлять счёт».
  // ПИСЬМО СО СЧЁТОМ ЧЕРЕЗ ZOHO (решение Асхата, 05.11.2026): адресаты — сотрудники компании-
  // покупателя с галочкой «Получает счета на почту»; PDF прикладывают сами
  var COMPANIES = null;
  function companiesP(){ return COMPANIES ? Promise.resolve(COMPANIES) : fetch(WORKER+'/companies-list').then(function(r){return r.json();}).then(function(j){ COMPANIES=(j&&j.companies)||[]; return COMPANIES; }).catch(function(){ return []; }); }
  function mailInvoice(row){
    companiesP().then(function(list){
      var bn=String((row.buyer&&row.buyer.name)||'').trim().toLowerCase(), bb=String((row.buyer&&row.buyer.bin)||'').replace(/\D/g,'');
      var co=list.filter(function(c){ return (bb && String(c.bin||'').replace(/\D/g,'')===bb) || String(c.name||'').trim().toLowerCase()===bn; })[0];
      var to=((co&&co.contacts)||[]).filter(function(c){ return c && c.invoiceMail && /@/.test(c.email||''); });
      if(!to.length){ alert('У компании «'+((row.buyer&&row.buyer.name)||'?')+'» никто не отмечен «Получает счета на почту».\nКарточка → «Компания и контакты» → «Управление» → «Редактировать контакты» → укажите почту и отметьте галочку.'); return; }
      var sup=(row.supplier&&(row.supplier.label||row.supplier.name))||'';
      var subj='Счёт на оплату № '+row.number+(sup?(' — '+sup):'');
      var body='Здравствуйте!\n\nНаправляем счёт на оплату № '+row.number+' на сумму '+money(row.total)+' ₸. Счёт во вложении.\n\nС уважением,\n'+sup;
      var url='mailto:'+to.map(function(c){ return c.email.trim().replace(/[\s,;?&]/g,''); }).join(',')+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
      var w=window.open(url,'_blank'); if(!w) location.href=url;
    });
  }
  var ME_NAME = '';
  t.member('fullName').then(function(m){ ME_NAME=(m&&m.fullName)||''; }).catch(function(){});
  function openEdit(row){
    var host=document.getElementById('edHost');
    if(!host){ host=document.createElement('div'); host.id='edHost'; document.body.appendChild(host); }
    host.innerHTML='<div style="position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:90;display:flex;flex-direction:column">'+
      '<div style="display:flex;align-items:center;padding:0 10px;height:46px;background:#1f6ce8;color:#fff;flex:0 0 auto">'+
      '<button id="edBack" type="button" style="background:transparent;border:none;color:#fff;font-size:14px;cursor:pointer;padding:8px 10px">← Назад к счетам заказа</button>'+
      '<div style="flex:1;text-align:center;font-weight:700;font-size:15px">Счёт № '+esc(row.number)+'</div><span style="width:160px"></span></div>'+
      '<iframe src="./invoice-view.html?number='+encodeURIComponent(row.number)+'&from=card&edit=1&by='+encodeURIComponent(ME_NAME)+'&t='+Date.now()+'" style="flex:1;border:0;background:#1d2125"></iframe></div>';
    if(!window.__invBackOn){ window.__invBackOn=true; window.addEventListener('message',function(ev){ if(ev.data&&ev.data.ms==='invBack'){ var bk=document.getElementById('edBack'); if(bk) bk.click(); } }); }
    // после правки счёта суммы и индикатор оплаты перечитываются сразу и ещё раз через несколько секунд (24.11.2026)
    document.getElementById('edBack').onclick=function(){ host.innerHTML=''; load(); setTimeout(function(){ if(!(host&&host.firstChild)) loadPay(); },9000); };
  }

  // ОКНО ПО РАЗМЕРУ СОДЕРЖИМОГО (решение Асхата, 24.11.2026): кнопки «Закрыть» нет — окно закрывается щелчком вне его.
  // Когда внутри открыт счёт или окно оплаты — окно снова большое.
  (function(){
    var last='';
    function fit(){
      var w=document.querySelector('.wrap'); if(!w) return;
      if(!window.__rendered) return;
      var eh=document.getElementById('edHost');
      var big=!!((eh&&eh.firstChild)||document.querySelector('.pdl-ov'));
      var msg=big?{ms:'fit',reset:1}:{ms:'fit',w:932,h:Math.ceil(w.getBoundingClientRect().height)+2};
      var k=JSON.stringify(msg); if(k===last) return; last=k;
      try{ window.parent.postMessage(msg,'*'); }catch(e){}
    }
    try{ new MutationObserver(function(){ setTimeout(fit,30); }).observe(document.body,{childList:true,subtree:true}); }catch(e){}
    try{ new ResizeObserver(function(){ fit(); }).observe(document.querySelector('.wrap')); }catch(e){}
    window.addEventListener('load',function(){ setTimeout(fit,50); }); setTimeout(fit,400);
  })();

  if(!cardId){ boot('Не удалось определить карточку.'); }
  else checkAccess().then(function(ok){
    if(!ok){
      boot('');
      document.getElementById('app').innerHTML='<div class="lockbox">Доступ к счетам ограничен.<br><span class="small">Счета видят только руководитель и работники с правом «может выставлять счёт».</span></div>';
      return;
    }
    return load();
  });
</script>
</body>
</html>
