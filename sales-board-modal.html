<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Продажи</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./trello-shim.js"></script>
  <script src="./config.js"></script>
  <style>
    :root{ --bg:#1d2125; --bg2:#22272b; --bg3:#282e33; --line:#3a414a; --txt:#c7d1db; --muted:#9fadbc; --blue:#4f7cff; --green:#4bce97; --red:#f28b82; --amber:#e8c07d; --purple:#c9a8ff; }
    html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
    #wrap{padding:14px 14px 64px;max-width:1760px;margin:0 auto}
    h2{margin:0;font-size:18px}
    .muted{color:var(--muted);font-size:12.5px}
    .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
    input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px 10px;font-size:13.5px}
    .btn{background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px 13px;font-size:13px;cursor:pointer}
    .btn:hover{border-color:var(--blue)}
    .btn.primary{background:#274469;border-color:var(--blue);color:#cfe1ff;font-weight:600}
    .btn.green{background:#1c3329;border-color:#2e5c44;color:var(--green)}
    .btn.danger{border-color:#7a3a32;color:#e8a59d}
    /* КОЛОНКИ КАК НА ДОСКЕ TTMS (решение Асхата, 20.11.2026): ширина 272 px, доска листается по горизонтали */
    .board{display:grid;grid-template-columns:repeat(8,272px);gap:10px;align-items:start;overflow-x:auto;overflow-y:hidden;padding-bottom:10px;scrollbar-width:thin}
    .zone{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:2px solid var(--line);padding:0 4px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .zone.z1{grid-column:1 / span 2;border-color:var(--blue)}
    .zone.z2{grid-column:3 / span 5;border-color:var(--green)}
    .zone.z3{grid-column:8;border-color:var(--red)}
    @media (max-width:640px){ .board{grid-template-columns:1fr;overflow:visible} .zone{display:none} }
    .col.auto{border-style:dashed}
    /* главная кнопка системы — сплошная синяя с белым текстом, как «+ Заявка» в ремонтах (19.11.2026) */
    .btn.solid,html.ms-light .btn.solid,html.day .btn.solid{background:#2463eb!important;background-image:none!important;border-color:#1d4fd7!important;color:#fff!important;font-weight:700!important;box-shadow:0 1px 2px rgba(16,30,54,.18)!important}
    .btn.solid:hover{background:#1d4fd7!important;filter:none!important}
    /* КОЛОНКА ДО НИЗА ЭКРАНА, карточки листаются внутри (решение Асхата, 19.11.2026 — как на доске производства) */
    .col{display:flex;flex-direction:column;min-height:0}
    .colbody{overflow-y:auto;overflow-x:hidden;min-height:0;flex:1 1 auto;margin:0 -6px;padding:4px 6px 2px;overscroll-behavior:contain;scrollbar-width:thin}
    .colbody::-webkit-scrollbar{width:8px}.colbody::-webkit-scrollbar-thumb{background:rgba(128,140,160,.45);border-radius:8px}
    /* полоса «Статус заказа» — та же, что в карточке на доске */
    .cp-steps{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid rgba(255,255,255,.12);border-radius:12px;overflow:hidden}
    .cp-steps .st{position:relative;padding:10px 10px;border-left:1px solid rgba(255,255,255,.08);cursor:pointer;min-height:64px;background:#22272b}
    .cp-steps .st:first-child{border-left:0}
    .cp-steps.with-rej{grid-template-columns:repeat(4,1fr) 92px}
    .cp-steps .st-rej .st-d{display:none}.cp-steps .st-rej{display:flex;align-items:center}
    .st.st-rej .st-t{color:#fd9891}.st.st-rej .st-dot{border-color:#fd9891;color:#fd9891;font-size:11px}
    .st.st-rej:hover{background:#42221f}
    .st.st-back .st-t{color:#9dc1ff}.st.st-back .st-dot{border-color:#9dc1ff;color:#9dc1ff}
    .cp-steps .st:hover{filter:brightness(1.08)}
    .cp-steps .st.busy{opacity:.5;pointer-events:none}
    .st-t{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;color:#dfe5ec}
    .st-d{font-size:11.5px;color:#9fadbc;margin-top:3px;line-height:1.35}
    .st-dot{width:19px;height:19px;border-radius:50%;border:2px solid #5c6b7a;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;color:#fff;flex:0 0 auto}
    .st.done{background:#1c3329}.st.done .st-dot{background:#22a06b;border-color:#22a06b}.st.done .st-t{color:#7ee2b8}
    .st.part{background:#3a2f14}.st.part .st-dot{background:#c98a08;border-color:#c98a08}.st.part .st-t{color:#f5cd47}
    .st.next{box-shadow:inset 0 0 0 2px #579dff;z-index:1}.st.next .st-dot{border-color:#579dff}
    .st.lock{cursor:not-allowed}.st.lock:not(.done):not(.part) .st-t{color:#8c9bab}
    .st.cross .st-t{text-decoration:line-through;color:#8c9bab}
    .st-bar{height:6px;border-radius:9px;background:rgba(255,255,255,.12);margin-top:7px;overflow:hidden}.st-bar i{display:block;height:100%;background:#c98a08;border-radius:9px}
    .st-b{height:24px;padding:0 8px;border-radius:7px;border:1px solid #3d5a8a;background:#274469;color:#cfe1ff;font-weight:600;font-size:11.5px;font-family:inherit;margin-top:6px;cursor:pointer;white-space:nowrap}
    @media (max-width:560px){.cp-steps,.cp-steps.with-rej{grid-template-columns:1fr 1fr}.cp-steps .st:nth-child(n+3){border-top:1px solid rgba(255,255,255,.08)}.cp-steps .st:nth-child(odd){border-left:0}.cp-steps .st-rej{grid-column:1 / -1;min-height:0}}
    /* сияние — те же правила и цвета, что на доске заказов */
    @keyframes glowG{0%,100%{box-shadow:0 0 0 1px rgba(34,160,90,.35),0 0 0 rgba(34,160,90,0)}50%{box-shadow:0 0 0 2px #1f9d55,0 0 22px 6px rgba(31,157,85,.75)}}
    @keyframes glowY{0%,100%{box-shadow:0 0 0 1px rgba(230,180,0,.35),0 0 0 rgba(230,180,0,0)}50%{box-shadow:0 0 0 2px #e2b203,0 0 22px 6px rgba(226,178,3,.8)}}
    @keyframes glowR{0%,100%{box-shadow:0 0 0 1px rgba(220,40,40,.35),0 0 0 rgba(220,40,40,0)}50%{box-shadow:0 0 0 2px #e5372b,0 0 22px 6px rgba(229,55,43,.8)}}
    .kcard.glow-green{animation:glowG 2s ease-in-out infinite}
    .kcard.glow-yellow{animation:glowY 2s ease-in-out infinite}
    .kcard.glow-red{animation:glowR 2s ease-in-out infinite}
    .kcard.auto{cursor:pointer}
    .pill.ord{background:#243447;color:#9dc1ff}
    .pill.paid{background:#1c3329;color:var(--green)}
    .ordbox{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:10px;font-size:13px;line-height:1.5}
    #hint{display:block;min-height:18px;margin:0 0 8px;color:var(--amber);font-size:12.5px}
    .col{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
    .col.dragover{border-color:var(--blue);background:#232c3a}
    .colhd{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 10px}
    .colhd .t{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
    .colhd .n{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:1px 9px;font-size:11.5px;color:var(--muted)}
    .kcard{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;cursor:pointer;user-select:none}
    .kcard:hover{border-color:#4f5b68}
    .kcard.dragging{opacity:.45}
    .kcard .nm{font-weight:600;line-height:1.35}
    .kcard .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
    .kcard .row2{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px}
    .pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700;white-space:nowrap}
    .pill.due{background:#42221f;color:var(--red)}
    .pill.next{background:#243447;color:#9dc1ff}
    .pill.won{background:#1c3329;color:var(--green)}
    .pill.calc{background:#3a3322;color:var(--amber)}
    .pill.calcok{background:#1c3329;color:var(--green)}
    .price{font-size:12.5px;font-weight:700;color:var(--green)}
    .mv{background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--muted);font-size:12px;padding:1px 7px;cursor:pointer}
    .mv:hover{border-color:var(--blue);color:#cfe1ff}
    .ovl{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;z-index:85;overflow:auto}
    .pop{background:var(--bg2);border:1px solid var(--line);border-radius:14px;max-width:720px;width:100%;padding:18px 20px 20px}
    .pop h3{margin:0 0 2px;font-size:16px}
    .pop .popbar{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
    .fld{display:flex;flex-direction:column;gap:4px;margin-top:10px}
    .fld label{font-size:11.5px;color:var(--muted);text-transform:uppercase}
    .fld input,.fld select,.fld textarea{width:100%;box-sizing:border-box}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
    @media (max-width:560px){ .grid2{grid-template-columns:1fr} }
    .bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:50}
    /* вкладки разделов — внизу рядом с «Закрыть» (как в Бухгалтерии и Снабжении) */
    .bar .tabs{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
    .bar .tab{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer}
    .bar .tab.active{border-color:var(--blue,#579dff);color:#cfe1ff;background:#274469;margin-top:-12px;padding-top:18px;border-top-color:transparent;border-radius:0 0 8px 8px}
    #crmView iframe{width:100%;height:100%;border:0;display:block}
    /* окно одного обращения: ни вкладок, ни доски — только само окно лида на всю страницу */
    html.lo #wrap,html.lo #anView,html.lo #crmView,html.lo .bar{display:none!important}
    html.lo .ovl{background:transparent;padding:0;align-items:stretch}
    html.lo .ovl .pop{max-width:none;width:100%;max-height:none;min-height:100vh;border-radius:0;border:none;box-shadow:none}
    .empty{color:var(--muted);padding:8px 4px;font-size:12.5px}
    .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .thumbs .ph{position:relative}
    .thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
    .thumbs .doc{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer;max-width:190px}
    .thumbs .doc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .thumbs .rmf{position:absolute;top:-6px;right:-6px;background:#42221f;color:var(--red);border:1px solid #7a3a32;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:18px;text-align:center;cursor:pointer}
    .thumbs .doc .rmf{position:static;margin-left:4px;flex:none}
    .msg{font-size:12.5px;margin-left:8px}
  </style>
</head>
<body>

  <div id="wrap">
    <div class="top">
      <h2>Продажи</h2>
      <input type="text" id="q" placeholder="Поиск: клиент, тема, контакт, телефон…" style="flex:1;min-width:180px">
      <button class="btn solid" id="newBtn" type="button">+ Новый лид</button>
    </div>
    <span id="hint"></span>
    <div id="board"><div class="empty">Загрузка…</div></div>
  </div>
  <div id="anView" style="display:none;padding:14px 14px 70px;max-width:1100px;margin:0 auto"></div>
  <div id="crmView" style="display:none;position:fixed;left:0;right:0;top:0;bottom:58px"></div>
  <div class="bar">
    <div class="tabs" id="barTabs">
      <!-- вкладки «Воронка» больше нет (решение Асхата, 25.11.2026): колонки продаж стоят на главной доске -->
      <div class="tab active" data-sv="an" title="Лиды, источники, конверсия, клики по ссылкам роликов">📊 Аналитика</div>
      <div class="tab" data-sv="crm" title="База клиентов (CRM)">👥 Клиенты</div>
    </div>
    <button class="btn" id="close" type="button">Закрыть</button>
  </div>
  <div id="ovlHost"></div>

  <script>
    var t = window.TrelloPowerUp.iframe();
    var WORKER = (window.CONFIG && window.CONFIG.WORKER_URL) || window.WORKER_URL || '';
    document.getElementById('close').onclick=function(){ t.closeModal(); };
    // кнопка сверху справа: существующий CRM-раздел (позже — коммерческие CRM)
    // ---------- аналитика продаж ----------
    window.__MS_T = t;   // для встроенного окна «Клиенты»
    var SV='an';
    // ОКНО ОДНОГО ОБРАЩЕНИЯ (25.11.2026): доска открывает эту страницу с args.lead — показываем только окно лида
    var LEAD_ONLY=(function(){ try{ return String(t.arg('lead')||''); }catch(e){ return ''; } })();
    if(LEAD_ONLY) document.documentElement.classList.add('lo');
    function leadDone(){ try{ (window.top||parent).postMessage({ms:'changed'},'*'); }catch(e){} try{ t.closeModal(); }catch(e){} }
    function showView(v){
      SV=v;
      [].forEach.call(document.querySelectorAll('[data-sv]'), function(x){ x.classList.toggle('active', x.getAttribute('data-sv')===v); });
      document.getElementById('wrap').style.display = v==='board' ? '' : 'none';
      document.getElementById('anView').style.display = v==='an' ? '' : 'none';
      var cv=document.getElementById('crmView'); cv.style.display = v==='crm' ? '' : 'none';
      if(v==='an' && !document.getElementById('anBody')) openAnalytics();
      if(v==='crm' && !cv.firstChild){ cv.innerHTML='<iframe src="./crm-modal.html?embed=1&t='+Date.now()+'"></iframe>'; }
    }
    [].forEach.call(document.querySelectorAll('[data-sv]'), function(x){ x.onclick=function(){ showView(this.getAttribute('data-sv')); }; });
    function monthRange(){ var d=new Date(); var f=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'; return [f, today()]; }
    function openAnalytics(){
      var mr=monthRange();
      var host=document.getElementById('anView');
      host.innerHTML='<div>'+
        '<h3>📊 Аналитика продаж</h3>'+
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">'+
        '<input type="date" id="anFrom" value="'+mr[0]+'"> — <input type="date" id="anTo" value="'+mr[1]+'">'+
        '<button class="btn primary" id="anGo" type="button">Показать</button>'+
        '<span class="msg" id="anMsg"></span></div>'+
        '<div id="anBody" class="muted" style="margin-top:12px">Выберите период и нажмите «Показать».</div>'+
        '</div>';
      document.getElementById('anGo').onclick=loadAnalytics;
      loadAnalytics();
    }
    function kpi(v,l){ return '<div style="background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:110px">'+
      '<div style="font-size:19px;font-weight:700">'+v+'</div><div class="muted">'+l+'</div></div>'; }
    function tbl(rows){ return '<table style="width:100%;border-collapse:collapse;font-size:12.5px">'+rows.map(function(r){
      return '<tr><td style="padding:4px 6px;border-bottom:1px solid var(--line)">'+r[0]+'</td>'+
             '<td style="padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap">'+r[1]+'</td></tr>'; }).join('')+'</table>'; }
    function sect(t,inner){ return '<div style="margin-top:14px"><div style="font-weight:700;margin-bottom:6px">'+t+'</div>'+inner+'</div>'; }
    // ---------- по клиентам: сколько заказов, когда, на какую сумму, сколько оплачено и что не дошло до сделки ----------
    var CL=[];
    function dmy(d){ return d&&d.length>=10 ? (d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(2,4)) : '—'; }
    function loadClients(f,tt){
      var box=document.getElementById('anClients'); if(!box) return;
      box.innerHTML=sect('По клиентам','<span class="muted">Загрузка…</span>');
      fetch(WORKER+'/sales-clients?from='+encodeURIComponent(f)+'&to='+encodeURIComponent(tt)).then(function(r){return r.json();}).then(function(j){
        if(j.error){ box.innerHTML=sect('По клиентам',esc(j.error)); return; }
        CL=j.clients||[];
        if(!CL.length){ box.innerHTML=sect('По клиентам','<span class="muted">За период заказов нет.</span>'); return; }
        var td='padding:6px 8px;border-bottom:1px solid var(--line);', r='text-align:right;white-space:nowrap;';
        var h='<div class="muted" style="margin-bottom:6px">Заказы, заведённые за период. Сделка — по заказу есть оплата. Нажмите на клиента, чтобы увидеть его заказы.</div>'+
          '<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px;min-width:820px"><tr class="muted">'+
          '<td style="'+td+'">Клиент</td><td style="'+td+r+'">Заказов</td><td style="'+td+r+'">Заказано на сумму</td><td style="'+td+r+'">Сделок</td><td style="'+td+r+'">Оплачено</td><td style="'+td+r+'" title="Расход на материал по расчётам сделок">Материал</td><td style="'+td+r+'" title="Цена сделок клиенту минус материал. Работа, расходники, аренда, коммунальные услуги и НДС не вычтены">Доход (цена − материал)</td><td style="'+td+r+'">В работе</td><td style="'+td+r+'">Отказались</td><td style="'+td+r+'">Последний</td></tr>';
        CL.forEach(function(c,i){
          h+='<tr data-cl="'+i+'" style="cursor:pointer"><td style="'+td+'font-weight:600">'+esc(c.name)+'</td><td style="'+td+r+'">'+c.orders+'</td><td style="'+td+r+'">'+money(c.sum)+' ₸</td>'+
            '<td style="'+td+r+'">'+c.deals+'</td><td style="'+td+r+'color:var(--green);font-weight:700">'+money(c.paid)+' ₸</td>'+
            '<td style="'+td+r+'">'+(c.deals?money(c.dealsMat||0)+' ₸':'—')+'</td><td style="'+td+r+'font-weight:600">'+(c.deals?(money(c.dealsSum-(c.dealsMat||0))+' ₸'+(c.dealsSum>0?' · '+Math.round((c.dealsSum-(c.dealsMat||0))*100/c.dealsSum)+'%':'')):'—')+'</td>'+
            '<td style="'+td+r+'">'+(c.open?(c.open+' / '+money(c.openSum)+' ₸'):'—')+'</td>'+
            '<td style="'+td+r+(c.lost?'color:var(--red)':'')+'">'+(c.lost?(c.lost+' / '+money(c.lostSum)+' ₸'):'—')+'</td><td style="'+td+r+'">'+dmy(c.last)+'</td></tr>'+
             '<tr id="clx'+i+'" style="display:none"><td colspan="10" style="padding:4px 8px 12px 20px;border-bottom:1px solid var(--line)"></td></tr>';
        });
        h+='</table></div>';
        box.innerHTML=sect('По клиентам',h);
        [].forEach.call(box.querySelectorAll('[data-cl]'), function(tr){ tr.onclick=function(){
          var i=+this.getAttribute('data-cl'), x=document.getElementById('clx'+i), c=CL[i];
          if(x.style.display!=='none'){ x.style.display='none'; return; }
          x.firstChild.innerHTML=c.list.map(function(o){
            var st = o.st==='deal' ? '<span style="color:var(--green)">сделка'+(o.payDate?(' · первая оплата '+dmy(o.payDate)):'')+' · оплачено '+money(o.paid)+' ₸</span>'
              : o.st==='lost' ? '<span style="color:var(--red)">отказ'+(o.lostAt?(' '+dmy(o.lostAt)):'')+(o.reason?(' · '+esc(o.reason)):'')+'</span>'
              : '<span class="muted">в работе, оплаты нет</span>';
            return '<div style="padding:3px 0">'+dmy(o.date)+' · '+(o.number?('<b>#'+esc(o.number)+'</b> '):'')+esc(String(o.name||'').slice(0,70))+' · <b>'+money(o.total)+' ₸</b>'+(o.mat>0?' · материал '+money(o.mat)+' ₸ · цена − материал <b>'+money(o.total-o.mat)+' ₸</b>':'')+' · '+st+'</div>';
          }).join('');
          x.style.display='';
        }; });
      }).catch(function(e){ box.innerHTML=sect('По клиентам','Ошибка: '+esc(e.message)); });
    }
    function loadAnalytics(){

          };
        });
      }
      var stLast='';
      function loadSt(body){
        if(!r) return Promise.resolve();
        if(!r.trello_card_id){ paintSt(null); return Promise.resolve(); }
        var o=body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{};
        return fetch(WORKER+'/card-status'+(body?'':'?cardId='+encodeURIComponent(r.trello_card_id)),o).then(function(x){return x.json();}).then(function(j){
          if(j&&j.error){ if(body){ alert(j.error); return loadSt(); } paintSt(null); return; }
          var sig=JSON.stringify(j); if(!body && sig===stLast) return; stLast=sig;
          if(j && j.ok && !j.hidden && r.order){ if(Math.round(j.paidSum)!==r.order.paid) changed=true; r.order.paid=Math.round(j.paidSum||0); if(j.total>0) r.order.total=Math.round(j.total); paintHead(); }
          paintSt(j);
        }).catch(function(){ if(!stLast) paintSt(null); });
      }
      // ---------- файлы лида ----------
      function initLead(){
        paintHead(); loadSt();
        clearInterval(stTimer); stTimer=setInterval(function(){ if(!closed && r && r.trello_card_id && !document.hidden) loadSt(); },5000);   // оплата вносится в соседнем окне — полоса подхватит сама
        var IMG_RE=/^image\//;
        function fmsg(s){ var e=document.getElementById('fMsg'); if(e) e.textContent=s||''; }
        // ФАЙЛЫ В КАРТОЧКУ ИЗ «ПРОДАЖ» (решение Асхата, 20.11.2026): когда у лида уже есть заказ на доске, файл уходит прямо
        // в карточку — через тот же вход, что и с доски, поэтому действуют те же правила: в производстве — только с
        // подтверждением руководителя, после «Порезано» DXF/ZZX нельзя, новый чертёж после КП/счёта меняет расчёт.
        function bTok(){ try{ return localStorage.getItem('ms_board_token')||''; }catch(e){ return ''; } }
        function loadCardFiles(){
          var bx=document.getElementById('fCardBox'), th=document.getElementById('fCardThumbs'), rl=document.getElementById('fRule');
          if(!bx||!th) return;
          if(!(r && r.trello_card_id)){ bx.style.display='none'; if(rl) rl.style.display='none'; return; }
          if(rl){ rl.style.display=''; rl.textContent='Новые файлы попадают в карточку заказа. Если заказ уже в производстве — файл уйдёт на подтверждение руководителю. После метки «Порезано» чертежи DXF и ZZX добавлять нельзя.'; }
          fetch(WORKER+'/card-details?db=1&cardId='+encodeURIComponent(r.trello_card_id)).then(function(x){return x.json();}).then(function(j){
            var at=(j&&j.attachments)||[]; bx.style.display='';
            if(!at.length){ th.innerHTML='<span class="muted">В карточке файлов пока нет</span>'; }
            else th.innerHTML=at.map(function(f){ var u=WORKER+f.url+'&inline=1';
              if(IMG_RE.test(f.mime||'') && !/\.(dxf|dwg|zzx|svg)$/i.test(f.name||'')) return '<span class="ph"><img src="'+u+'" loading="lazy" data-open="'+u+'" alt=""></span>';
              return '<span class="doc" data-open="'+WORKER+f.url+'">📄 <span>'+esc(f.name||'файл')+'</span></span>'; }).join('');
            [].forEach.call(th.querySelectorAll('[data-open]'), function(el){ el.onclick=function(){ window.open(this.getAttribute('data-open'),'_blank'); }; });
          }).catch(function(){ bx.style.display='none'; });
          // запросы, ждущие подтверждения руководителя
          fetch(WORKER+'/file-requests?cardId='+encodeURIComponent(r.trello_card_id)).then(function(x){return x.json();}).then(function(j){
            var rq=(j&&(j.items||j.rows))||[]; var old=document.getElementById('fPend'); if(old) old.remove();
            if(!rq.length) return;
            var d=document.createElement('div'); d.id='fPend'; d.style.cssText='margin-top:6px;font-size:12.5px;color:var(--amber,#b07a00)';
            d.textContent='⏳ Ждут подтверждения руководителя: '+rq.map(function(x){ return x.name; }).join(', ');
            bx.appendChild(d);
          }).catch(function(){});
        }
        function loadFiles(){
          loadCardFiles();
          fetch(WORKER+'/receipts-list?kind=sales&refId='+encodeURIComponent(r.id)).then(function(x){return x.json();}).then(function(j){
            var box=document.getElementById('fThumbs'); if(!box) return;
            var files=(j&&(j.receipts||j.rows))||[];
            FILE_COUNTS[String(r.id)]=files.length; 
            if(!files.length){ box.innerHTML=(r&&r.trello_card_id)?'':'<span class="muted">Файлов нет</span>'; return; }
            box.innerHTML=files.map(function(f){
              var u=WORKER+'/receipt-get?id='+f.id;
              if(IMG_RE.test(f.mime||'')) return '<span class="ph"><img src="'+u+'" loading="lazy" data-open="'+u+'" alt=""><span class="rmf" data-rm="'+f.id+'" title="Удалить">×</span></span>';
              return '<span class="doc" data-open="'+u+'">📄 <span>'+esc(f.filename||'файл')+'</span><span class="rmf" data-rm="'+f.id+'" title="Удалить">×</span></span>';
            }).join('');
            [].forEach.call(box.querySelectorAll('[data-open]'), function(el){
              el.onclick=function(e){ if(e.target.classList.contains('rmf'))return; window.open(this.getAttribute('data-open'),'_blank'); };
            });
            [].forEach.call(box.querySelectorAll('[data-rm]'), function(el){
              el.onclick=function(e){ e.stopPropagation();
                if(!confirm('Удалить файл? Это безвозвратно.')) return;
                post('/receipt-delete',{id:+this.getAttribute('data-rm')}).then(function(){ loadFiles(); renderBoard(); });
              };
            });
          }).catch(function(){});
        }
        // фото сжимаются на телефоне до отправки — как в заявках на ремонт
        function shrinkImage(file){
          return new Promise(function(res,rej){
            var img=new Image(), url=URL.createObjectURL(file);
            img.onload=function(){
              var MAX=1600, w=img.width, h=img.height;
              if(w>MAX||h>MAX){ var k=MAX/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
              var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
              cv.getContext('2d').drawImage(img,0,0,w,h);
              URL.revokeObjectURL(url);
              res({ b64: cv.toDataURL('image/jpeg',0.85).split(',')[1], mime:'image/jpeg',
                    name: (file.name||'фото').replace(/\.[^.]+$/,'')+'.jpg' });
            };
            img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('не удалось прочитать фото')); };
            img.src=url;
          });
        }
        function rawFile(file){
          return new Promise(function(res,rej){
            var fr=new FileReader();
            fr.onload=function(){ res({ b64:String(fr.result).split(',')[1], mime:file.type||'application/octet-stream', name:file.name||'файл' }); };
            fr.onerror=function(){ rej(new Error('не удалось прочитать файл')); };
            fr.readAsDataURL(file);
          });
        }
        function uploadFiles(list){
          var files=[].slice.call(list||[]); if(!files.length) return;
          var toCard=!!(r && r.trello_card_id), pend=[];
          // после КП или счёта новый чертёж меняет расчёт — предупреждаем заранее
          if(toCard && files.some(function(f){ return /\.(dxf|zzx)$/i.test(f.name||''); })){
            var sg=stageOf(r);
            if((sg==='kp'||sg==='pay'||sg==='deal') && !confirm('По этому заказу уже есть КП или счёт.\n\nНовый чертёж изменит расчёт: неоплаченные КП и счёт станут недействительными и их нужно будет выставить заново, а по оплаченному счёту понадобится доп. счёт.\n\nДобавить файл?')) return;
          }
          var chain=Promise.resolve(), done=0;
          files.forEach(function(f){
            chain=chain.then(function(){
              fmsg('Отправка '+(done+1)+' из '+files.length+'…');
              // чертежи (DXF/DWG) браузер иногда называет «image/vnd.dxf» — их не сжимаем как фото
              var prep = (IMG_RE.test(f.type||'') && !/\.(dxf|dwg|zzx|svg|step|stp|igs|iges)$/i.test(f.name||'')) ? shrinkImage(f) : rawFile(f);
              return prep.then(function(p){
                if(toCard){
                  if(p.b64.length>8500000) throw new Error('«'+p.name+'» слишком большой (макс ~6 МБ)');
                  return post('/board-upload',{token:bTok(),cardId:r.trello_card_id,filename:p.name,mime:p.mime,dataB64:p.b64}).then(function(j){
                    if(j&&j.pending){ pend.push(p.name); return {}; }   // заказ в производстве: файл ушёл на подтверждение
                    return j; });
                }
                if(p.b64.length>2800000) throw new Error('«'+p.name+'» слишком большой (макс ~2 МБ)');
                return post('/receipt-save',{kind:'sales',refId:r.id,filename:p.name,mime:p.mime,dataB64:p.b64,byName:MYNAME});
              }).then(function(j){ if(j.error) throw new Error(j.error); done++; });
            });
          });
          chain.then(function(){ fmsg(pend.length?('⏳ На подтверждение руководителю: '+pend.join(', ')):'Готово ✓'); loadFiles(); renderBoard(); setTimeout(function(){fmsg('');},pend.length?7000:1500); })
               .catch(function(e){ fmsg('Ошибка: '+e.message); loadFiles(); });
        }
        $('fCam').onclick=function(){ $('fCamIn').click(); };
        $('fPick').onclick=function(){ $('fPickIn').click(); };
        $('fCamIn').onchange=function(){ uploadFiles(this.files); this.value=''; };
        $('fPickIn').onchange=function(){ uploadFiles(this.files); this.value=''; };
        loadFiles();
      }
      // КП и СЧЁТ ПРЯМО ИЗ ПРОДАЖ (решение Асхата, 19.11.2026): менеджеру не нужно идти на доску производства.
      // Открывается то же окно, что и в карточке заказа; права («Создаёт КП», «Выставляет счета») проверяет оно само.
      $('pDocs').onclick=function(){
        t.modal({ url:'./invoice-modal.html?t='+Date.now(), title:'Счёт на оплату', accentColor:'#1f6ce8', fullscreen:true, args:{ cardId:r.trello_card_id, boardId:'' } });
      };
      // ---------- на расчёт ----------
      $('calcSend').onclick=function(){
        var sb=this, cm=$('calcMsg');
        // без компании и контактного лица с телефоном — не отправляем (решение Асхата, 12.11.2026)
        var _cs=$('fComp'), cn=$('fCompName').value.trim()||((_cs&&_cs.value&&_cs.selectedIndex>=0)?_cs.options[_cs.selectedIndex].text.trim():''), ct=$('fContact').value.trim(), ph=$('fPhone').value.trim();
        var miss=[]; if(!cn) miss.push('компания'); if(!ct) miss.push('контактное лицо'); if(ph.replace(/\D/g,'').length<10) miss.push('телефон');
        [['fCompName',!cn],['fContact',!ct],['fPhone',miss.indexOf('телефон')>=0]].forEach(function(x){ var el=$(x[0]); if(el) el.style.outline=x[1]?'2px solid #e2483d':''; });
        if(miss.length){ cm.textContent='Сначала заполните: '+miss.join(', '); return; }
        if(!confirm('Отправить лид «'+(r.title||'')+'» на расчёт производству?\nВ колонке «Заявки» на доске появится карточка с файлами лида.')) return;
        sb.disabled=true; cm.textContent='Отправка…';
        if(!$('fCompName').value.trim()) $('fCompName').value=cn;
        isDirty=true;
        Promise.resolve(flush()).then(function(){ if(isDirty) throw new Error('лид не сохранился'); return post('/sales-to-calc',{id:r.id, byName:MYNAME}); }).then(function(j){
          if(j.error){ sb.disabled=false; cm.textContent=j.error; return; }
          cm.textContent=''; changed=true;
          r.trello_card_id=j.cardId; r.trello_card_url=j.cardUrl||''; r.calc_status='sent'; r.stage='calc'; r.status='calc';
          if(j.attachErrors && j.attachErrors.length) alert('Карточка создана, но часть файлов не прикрепилась:\n'+j.attachErrors.join('\n'));
          paintHead(); loadSt(); renderBoard();
          loadAll().then(function(){ var x=findRow(r.id); if(x && !closed){ r=x; paintHead(); loadSt(); } });
        }).catch(function(e){ sb.disabled=false; cm.textContent='Ошибка: '+e.message; });
      };
      if(r) initLead(); else { paintHead(); $('fTitle').focus(); }
    }

    document.getElementById('newBtn').onclick=function(){ openEdit(null); };
    document.getElementById('q').addEventListener('input',function(){ FILTER=this.value; renderBoard(); });
    if(LEAD_ONLY){
      loadAll().then(function(){
        if(LEAD_ONLY==='new'){ openEdit(null); return; }
        if(findRow(LEAD_ONLY)){ openEdit(LEAD_ONLY); return; }
        // обращения нет в списке (давний отказ из архива) — показываем, что нашли
        document.getElementById('ovlHost').innerHTML='<div class="ovl"><div class="pop"><h3>Обращение не найдено</h3><div class="muted" style="margin-top:8px">Возможно, его удалили или оно ушло в архив давно.</div></div></div>';
      });
      // окно закрыли щелчком мимо (страница исчезает) — дописываем несохранённое
      window.addEventListener('pagehide',function(){ try{ var e=new KeyboardEvent('keydown',{key:'Escape'}); document.dispatchEvent(e); }catch(e2){} });
    } else {
      showView('an');
    }
  </script>
</body>
