<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Снабжение</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./trello-shim.js"></script>
  <script src="./config.js"></script>
  <script src="./calc-engine.js?v=23"></script>
  <style>
    :root{ --bg:#1d2125; --bg2:#22272b; --line:#3a414a; --txt:#c7d1db; --muted:#9fadbc; --blue:#4f7cff; --green:#4bce97; --red:#f28b82; --amber:#e8c07d; }
    html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
    #app{max-width:1000px;margin:0 auto;padding:16px 16px 70px}
    h2{margin:0 0 12px;font-size:18px}
    h3{margin:14px 0 8px;font-size:14px;color:#e6edf3}
    .muted{color:var(--muted);font-size:12.5px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .tab{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer}
    .tab.active{border-color:var(--blue);color:#cfe1ff;background:#274469}
    .tab .cnt{display:inline-block;background:#42221f;color:var(--red);border-radius:9px;padding:0 7px;font-size:11px;font-weight:700;margin-left:5px}
    .btn{background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:7px 13px;font-size:13px;cursor:pointer}
    .btn:hover{border-color:var(--blue)}
    .btn.primary{background:#274469;border-color:var(--blue);color:#cfe1ff}
    .btn.danger{border-color:#7a3a32;color:#e8a59d}
    input,select{background:var(--bg2);border:1px solid var(--line);border-radius:6px;color:var(--txt);padding:7px 9px;font-size:13px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}
    th{color:var(--muted);font-size:11px;text-transform:uppercase;white-space:nowrap}
    td.num{text-align:right;white-space:nowrap}
    table.cash{table-layout:fixed}table.cash td.num,table.cash th.num{text-align:center;white-space:nowrap}table.cash td{overflow-wrap:anywhere}
    .pill{display:inline-block;border-radius:10px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
    .pill.new{background:#2b3a55;color:#a9c2ff}
    .pill.bought{background:#1c3329;color:var(--green)}
    .pill.given{background:#223;color:var(--muted)}
    .pill.rejected{background:#42221f;color:var(--red)}
    .pill.urgent{background:#42221f;color:var(--red)}
    .pill.overdue{background:#42221f;color:var(--red)}
    .pill.soon{background:#3d321c;color:var(--amber)}
    .pill.ok{background:#1c3329;color:var(--green)}
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:6px 0 12px}
    .kpi{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
    .kpi .k{font-size:11px;color:var(--muted);text-transform:uppercase}
    .kpi .v{font-size:16px;font-weight:800;margin-top:4px}
    .kpi.red .v{color:var(--red)} .kpi.amber .v{color:var(--amber)}
    .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 14px;margin:8px 0}
    .grid2 .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;margin-bottom:3px}
    .grid2 input{width:100%;box-sizing:border-box}
    .empty{color:var(--muted);padding:12px 4px}
    .daterow td{background:var(--bg2);font-weight:700;color:#e6edf3}
    .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
    a{color:#8ab4ff;text-decoration:none} a:hover{text-decoration:underline}
    .bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:50}
    /* вкладки разделов — внизу рядом с «Закрыть»; активная «свисает» из окна над ней */
    .bar .tabs{margin:0;flex:1;min-width:0}
    .bar .tab.active{margin-top:-13px;padding-top:19px;border-top-color:transparent;border-radius:0 0 8px 8px}
    .iplus{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--blue);background:#274469;color:#cfe1ff;font-size:17px;line-height:1;cursor:pointer;margin-left:8px;vertical-align:middle;padding:0}
    .iplus:hover{background:#30528a}
    .iplus.minus{border-color:#7a3a32;background:#3a2220;color:#f2b8b0}.iplus.minus:hover{background:#4a2a27}
    .hrow{display:flex;align-items:center;margin:16px 0 8px}.hrow h3{margin:0}
    .pop.sm{max-width:460px;margin-top:40px}
    .pop .grid2{grid-template-columns:1fr}
    /* канбан заявок */
    .board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
    @media (max-width:820px){ .board{grid-template-columns:1fr} }
    .col{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
    .col.dragover{border-color:var(--blue);background:#232c3a}
    .colhd{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 10px}
    .colhd .t{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
    .colhd .n{background:var(--bg,#1d2125);border:1px solid var(--line);border-radius:10px;padding:1px 9px;font-size:11.5px;color:var(--muted)}
    .kcard{background:var(--bg,#1d2125);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;cursor:pointer;user-select:none}
    .kcard:hover{border-color:#4f5b68}
    .kcard.dragging{opacity:.45}
    .kcard .nm{font-weight:600;line-height:1.35}
    .kcard .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
    .kcard .row2{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px}
    .mv{background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--muted);font-size:12px;padding:1px 7px;cursor:pointer}
    .mv:hover{border-color:var(--blue);color:#cfe1ff}
    .ovl{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;z-index:60;overflow:auto}
    .pop{background:var(--bg2);border:1px solid var(--line);border-radius:14px;max-width:680px;width:100%;padding:18px 20px 20px}
    .pop h3{margin:0 0 2px;font-size:16px}
    .pop .popbar{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
    .fld{display:flex;flex-direction:column;gap:4px;margin-top:10px}
    .fld label{font-size:11.5px;color:var(--muted);text-transform:uppercase}
    .fld input{width:100%;box-sizing:border-box}
    label.fchk{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:12px;cursor:pointer}
    .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
    .thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  </style>
</head>
<body>

  <div id="app"><div class="empty" id="boot">Загрузка…</div></div>
  <div class="bar"><div class="tabs" id="barTabs"></div><button class="btn" id="close" type="button">Закрыть</button></div>
  <div id="supOvlHost"></div>
  <script>
    var t = window.TrelloPowerUp.iframe();
    var WORKER = (window.CONFIG && window.CONFIG.WORKER_URL) || window.WORKER_URL || '';
    document.getElementById('close').onclick=function(){ t.closeModal(); };

    var TAB='req', REQS=[], OPEN=0, TOOLS=[], DUE=0, CASH=null, TOOL_EDIT=null;
    var ME={id:'',name:''}, CAN_SUPPLY=false, THUMBS={};
    var now=new Date();
    function pad(n){ return n<10?'0'+n:''+n; }
    function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
    var CASH_RANGE={ from: fmtDate(new Date(now.getFullYear(), now.getMonth(), 1)), to: fmtDate(now) };
    function money(v){ return Math.round(+v||0).toLocaleString('ru-RU'); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    var STATUS_LBL = { new:'новая', work:'в работе', bought:'куплено', given:'выдано', rejected:'отклонена' };

    function isDirector(){
      return Promise.all([ t.member('id'), t.board('memberships'), t.organization('memberships').catch(function(){return null;}) ])
        .then(function(res){ var me=res[0]||{};
          function adminIn(o){ var ms=((o&&o.memberships)||[]).filter(function(x){return x.idMember===me.id;})[0]; return !!(ms&&ms.memberType==='admin'); }
          return adminIn(res[1])||adminIn(res[2]);
        }).catch(function(){ return false; });
    }
    var IS_ADMIN=false;
    function canUse(){
      return isDirector().then(function(admin){
        IS_ADMIN=admin;
        if(admin) return true;
        return t.member('id').then(function(me){
          return fetch(WORKER+'/worker-perms?memberId='+encodeURIComponent(me.id||''))
            .then(function(r){return r.json();}).then(function(j){ return !!(j&&j.canSupply); })
            .catch(function(){ return false; });
        });
      });
    }

    function loadAll(){
      var priv = (CAN_SUPPLY||IS_ADMIN);
      return Promise.all([
        fetch(WORKER+'/supply-list').then(function(r){return r.json();}).catch(function(){return {};}),
        priv ? fetch(WORKER+'/tools-list').then(function(r){return r.json();}).catch(function(){return {};}) : Promise.resolve({}),
        priv ? fetch(WORKER+'/cash-list?from='+CASH_RANGE.from+'&to='+CASH_RANGE.to).then(function(r){return r.json();}).catch(function(){return {};}) : Promise.resolve({})
      ]).then(function(res){
        if(res[0]&&res[0].ok){ REQS=res[0].requests||[]; OPEN=res[0].openCount||0; }
        if(res[1]&&res[1].ok){ TOOLS=res[1].tools||[]; DUE=res[1].dueCount||0; }
        if(res[2]&&res[2].ok){ CASH=res[2]; }
        render();
        var ids=REQS.map(function(r){return r.id;});
        if(ids.length){
          fetch(WORKER+'/receipt-thumbs?kind=req&ids='+ids.join(',')).then(function(r){return r.json();}).then(function(t2){
            if(t2&&t2.ok){ THUMBS=t2.thumbs||{}; if(TAB==='req') render(); }
          }).catch(function(){});
        }
      });
    }

    // ---------- ЗАЯВКИ ----------
    // ---------- ЗАЯВКИ: канбан ----------
    var SUP_COLS=[ {key:'new',title:'Новая заявка'}, {key:'work',title:'В работе'}, {key:'bought',title:'Куплено'} ];
    function reqCol(r){ return r.status==='given' ? 'bought' : r.status; } // «выдано» живёт в колонке «Куплено»

    function renderReq(){
      var canMove = CAN_SUPPLY||IS_ADMIN;
      var h='<div class="board">';
      SUP_COLS.forEach(function(c,ci){
        var cards=REQS.filter(function(r){ return reqCol(r)===c.key && r.status!=='rejected'; });
        h+='<div class="col" data-col="'+c.key+'"><div class="colhd"><span class="t">'+c.title+'</span><span class="n">'+cards.length+'</span></div>';
        if(c.key==='new') h+='<button class="btn" id="supNewBtn" type="button" style="width:100%;margin-bottom:8px">+ Заявка</button>';
        if(!cards.length) h+='<div class="empty">Пусто</div>';
        cards.forEach(function(r){
          h+='<div class="kcard" '+(canMove?'draggable="true"':'')+' data-id="'+r.id+'">';
          if(THUMBS[String(r.id)]){
            h+='<div style="margin:-9px -11px 8px;overflow:hidden;border-radius:9px 9px 0 0;background:#151a1e">'+
               '<img src="'+WORKER+'/receipt-get?id='+THUMBS[String(r.id)]+'" loading="lazy" alt="" '+
               'style="display:block;width:100%;max-height:150px;object-fit:cover"></div>';
          }
          h+='<div class="nm">'+esc(r.name)+(r.urgent?' <span class="pill urgent">срочно</span>':'')+(r.status==='given'?' <span class="pill given">выдано</span>':'')+'</div>';
          var sub=[];
          if(r.qty) sub.push(esc(r.qty));
          if(r.byName) sub.push('заказал: '+esc(r.byName));
          sub.push(esc((r.createdAt||'').slice(0,10)));
          h+='<div class="sub">'+sub.join(' · ')+'</div>';
          if(r.comment) h+='<div class="sub">'+esc(r.comment)+'</div>';
          h+='<div class="row2"><span></span><span>';
          if(canMove){
            if(ci>0) h+='<button class="mv" data-mv="'+r.id+'" data-to="'+SUP_COLS[ci-1].key+'" title="В колонку «'+SUP_COLS[ci-1].title+'»">‹</button> ';
            if(ci<SUP_COLS.length-1) h+='<button class="mv" data-mv="'+r.id+'" data-to="'+SUP_COLS[ci+1].key+'" title="В колонку «'+SUP_COLS[ci+1].title+'»">›</button>';
          }
          h+='</span></div></div>';
        });
        h+='</div>';
      });
      h+='</div>';
      return h;
    }

    var supDragId=null;
    function wireReqBoard(){
      var nb=document.getElementById('supNewBtn'); if(nb) nb.onclick=openSupCreate;
      var canMove = CAN_SUPPLY||IS_ADMIN;
      [].forEach.call(document.querySelectorAll('.kcard'), function(c){
        c.onclick=function(e){ if(e.target.classList.contains('mv'))return; openSupCard(+this.getAttribute('data-id')); };
        if(canMove){
          c.ondragstart=function(e){ supDragId=+this.getAttribute('data-id'); this.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; };
          c.ondragend=function(){ this.classList.remove('dragging'); };
        }
      });
      if(canMove){
        [].forEach.call(document.querySelectorAll('.col'), function(col){
          col.ondragover=function(e){ e.preventDefault(); this.classList.add('dragover'); };
          col.ondragleave=function(){ this.classList.remove('dragover'); };
          col.ondrop=function(e){ e.preventDefault(); this.classList.remove('dragover');
            if(supDragId!=null) supMoveTo(supDragId, this.getAttribute('data-col')); supDragId=null; };
        });
      }
      [].forEach.call(document.querySelectorAll('.mv'), function(b){
        b.onclick=function(e){ e.stopPropagation(); supMoveTo(+this.getAttribute('data-mv'), this.getAttribute('data-to')); };
      });
    }

    function supMoveTo(id, col){
      var r=REQS.filter(function(x){return x.id===id;})[0];
      if(!r || reqCol(r)===col) return;
      var newStatus = col; // new|work|bought
      var old=r.status; r.status=newStatus; render();
      fetch(WORKER+'/supply-set',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:id,status:newStatus})})
        .then(function(x){return x.json();}).then(function(j){ if(!j||!j.ok) throw new Error((j&&j.error)||'сервер не подтвердил'); })
        .catch(function(e){ r.status=old; render(); alert('Не удалось перенести: '+(e&&e.message||e)); });
    }

    // файлы: фото жмём, PDF/документ как есть (лимит ~650 КБ)
    function fileToB64(file){
      return new Promise(function(res,rej){ var fr=new FileReader();
        fr.onload=function(){ res(String(fr.result).split(',')[1]); }; fr.onerror=rej; fr.readAsDataURL(file); });
    }
    function compressImage(file){
      return new Promise(function(resolve,reject){
        var fr=new FileReader();
        fr.onload=function(){ var img=new Image();
          img.onload=function(){ var maxSide=1280,w=img.width,hgt=img.height,k=Math.min(1,maxSide/Math.max(w,hgt));
            var cnv=document.createElement('canvas'); cnv.width=Math.round(w*k); cnv.height=Math.round(hgt*k);
            cnv.getContext('2d').drawImage(img,0,0,cnv.width,cnv.height);
            resolve(cnv.toDataURL('image/jpeg',0.72).split(',')[1]); };
          img.onerror=reject; img.src=fr.result; };
        fr.onerror=reject; fr.readAsDataURL(file);
      });
    }
    function prepFile(file){
      if(/^image\//.test(file.type||'')) return compressImage(file).then(function(b64){ return { b64:b64, mime:'image/jpeg', filename:file.name||'фото.jpg' }; });
      if(file.size > 650000) return Promise.reject(new Error('Файл «'+file.name+'» слишком большой (макс ~650 КБ). Фото можно любое — оно сожмётся.'));
      return fileToB64(file).then(function(b64){ return { b64:b64, mime:file.type||'application/octet-stream', filename:file.name||'файл' }; });
    }
    function uploadFiles(reqId, files, msgEl){
      var chain=Promise.resolve();
      [].forEach.call(files, function(f,i){
        chain=chain.then(function(){
          if(msgEl){ msgEl.textContent='Файл '+(i+1)+' из '+files.length+'…'; msgEl.style.color='var(--muted)'; }
          return prepFile(f).then(function(p){
            return fetch(WORKER+'/receipt-save',{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({kind:'req',refId:String(reqId),filename:p.filename,mime:p.mime,dataB64:p.b64})})
              .then(function(r){return r.json();})
              .then(function(jr){ if(!jr||!jr.ok) throw new Error((jr&&jr.error)||'файл не сохранился'); });
          });
        });
      });
      return chain;
    }
    function closeSupOvl(){ var el=document.getElementById('supOvlHost'); if(el) el.innerHTML=''; }

    function openSupCreate(){
      var h='<div class="ovl" id="supOvl"><div class="pop">';
      h+='<h3>Новая заявка на снабжение</h3><div class="muted">Что купить — опишите и приложите фото или документ. Заявка попадёт в колонку «Новая заявка».</div>';
      h+='<div class="fld"><label>Что нужно</label><input type="text" id="sName" placeholder="например: диски отрезные 125мм"></div>';
      h+='<div class="fld"><label>Количество</label><input type="text" id="sQty" placeholder="например: 20 шт"></div>';
      h+='<div class="fld"><label>Комментарий</label><input type="text" id="sComment" placeholder="какие именно, для чего"></div>';
      h+='<div class="fld"><label>Ссылка (если нашли в магазине)</label><input type="text" id="sLink" placeholder="https://…"></div>';
      h+='<label class="fchk"><input type="checkbox" id="sUrgent"> 🔥 Срочно</label>';
      h+='<label class="fchk">📎 Фото или документы <input type="file" id="sFiles" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx" multiple></label>';
      h+='<div class="muted" style="font-size:11.5px">Заказчик записывается автоматически: '+esc(ME.name||'вы')+'</div>';
      h+='<div class="popbar"><span class="muted" id="sMsg"></span><button class="btn" id="sCancel" type="button">Отмена</button><button class="btn primary" id="sSend" type="button">Отправить заявку</button></div>';
      h+='</div></div>';
      document.getElementById('supOvlHost').innerHTML=h;
      document.getElementById('sCancel').onclick=closeSupOvl;
      document.getElementById('supOvl').onclick=function(e){ if(e.target===this) closeSupOvl(); };
      document.getElementById('sSend').onclick=function(){
        var name=document.getElementById('sName').value.trim();
        if(!name){ alert('Опишите, что нужно купить.'); return; }
        var btn=this, msg=document.getElementById('sMsg');
        btn.disabled=true; msg.textContent='Отправка…';
        fetch(WORKER+'/supply-request',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ name:name, qty:document.getElementById('sQty').value.trim(),
            comment:document.getElementById('sComment').value.trim(), link:document.getElementById('sLink').value.trim(),
            urgent:document.getElementById('sUrgent').checked?1:0, byMemberId:ME.id, byName:ME.name })})
        .then(function(r){return r.json();}).then(function(j){
          if(!j||!j.ok) throw new Error((j&&j.error)||'сервер не подтвердил');
          var files=document.getElementById('sFiles').files;
          return files.length ? uploadFiles(j.id, files, msg) : null;
        }).then(function(){ closeSupOvl(); loadAll(); })
        .catch(function(e){ btn.disabled=false; msg.textContent='Ошибка: '+(e&&e.message||e); msg.style.color='var(--red)'; });
      };
    }

    function openSupCard(id){
      var r=REQS.filter(function(x){return x.id===id;})[0]; if(!r) return;
      var canMng=CAN_SUPPLY||IS_ADMIN;
      var h='<div class="ovl" id="supOvl"><div class="pop">';
      h+='<h3>'+esc(r.name)+(r.urgent?' <span class="pill urgent">срочно</span>':'')+'</h3>';
      h+='<div class="muted">'+(STATUS_LBL[r.status]||r.status)+' · заказал: '+esc(r.byName||'—')+' · '+esc((r.createdAt||'').slice(0,10))+'</div>';
      h+='<div style="margin-top:10px;font-size:13.5px;line-height:1.7">';
      if(r.qty) h+='Количество: <b>'+esc(r.qty)+'</b><br>';
      if(r.comment) h+='Комментарий: '+esc(r.comment)+'<br>';
      if(r.link) h+='<a href="'+esc(r.link)+'" target="_blank">ссылка на товар ↗</a><br>';
      if(r.note) h+='<span class="muted">Ответ снабжения: '+esc(r.note)+'</span>';
      h+='</div><div class="thumbs" id="supThumbs"></div>';
      h+='<label class="fchk">📎 Добавить фото или документ <input type="file" id="supAddFile" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx" multiple></label>';
      if(canMng){
        h+='<div class="fld"><label>Заметка снабжения (где купили, цена / причина отказа)</label>'+

    // фото → сжатое JPEG base64 (без префикса)
    function compressImage(file){
      return new Promise(function(resolve,reject){
        var fr=new FileReader();
        fr.onload=function(){
          var img=new Image();
          img.onload=function(){
            var maxSide=1280, w=img.width, hgt=img.height;
            var k=Math.min(1, maxSide/Math.max(w,hgt));
            var cnv=document.createElement('canvas');
            cnv.width=Math.round(w*k); cnv.height=Math.round(hgt*k);
            cnv.getContext('2d').drawImage(img,0,0,cnv.width,cnv.height);
            var url=cnv.toDataURL('image/jpeg',0.72);
            resolve(url.split(',')[1]);
          };
          img.onerror=reject;
          img.src=fr.result;
        };
        fr.onerror=reject;
        fr.readAsDataURL(file);
      });
    }
    // Файлы, выбранные ДО сохранения (по разделам): tp — инструмент, cp — наличные

    function drawPend(p){

      el.innerHTML = PEND[p].length
        ? PEND[p].map(function(f,i){ return '<span style="margin-right:10px">'+(f.type==='application/pdf'?'📄':'📷')+' '+String(f.name||'файл').replace(/[<>&"]/g,'')+' <a href="#" data-rm="'+i+'" style="color:#e8a59d;text-decoration:none">✕</a></span>'; }).join('')
        : '';
      [].forEach.call(el.querySelectorAll('[data-rm]'), function(a){
        a.onclick=function(ev){ ev.preventDefault(); PEND[p].splice(+this.getAttribute('data-rm'),1); drawPend(p); };

    // последовательная загрузка выбранных файлов к записи id; msgEl — куда писать прогресс
    function uploadPending(kind, refId, p, msgEl){
      var files=PEND[p].slice();
      var chain=Promise.resolve();
      files.forEach(function(f,i){
        chain=chain.then(function(){
          if(msgEl) msgEl.textContent='Файл '+(i+1)+' из '+files.length+'…';
          return prepFile(f).then(function(pf){
            return fetch(WORKER+'/receipt-save',{ method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ kind:kind, refId:String(refId), filename:pf.filename, mime:pf.mime, dataB64:pf.b64 }) })
              .then(function(r){return r.json();})
              .then(function(j){ if(!j||!j.ok) throw new Error((j&&j.error)||'файл не сохранился'); });
          });
        });
      });
      return chain.then(function(){ PEND[p]=[]; });
    }
    function fileToB64(file){
      return new Promise(function(res,rej){
        var fr=new FileReader();
        fr.onload=function(){ res(String(fr.result).split(',')[1]); };
        fr.onerror=rej; fr.readAsDataURL(file);
      });
    }
    function prepFile(file){
      if(file.type==='application/pdf'){
        if(file.size > 650000) return Promise.reject(new Error('PDF «'+(file.name||'')+'» слишком большой (макс ~650 КБ)'));
        return fileToB64(file).then(function(b64){ return { b64:b64, mime:'application/pdf', filename:file.name||'документ.pdf' }; });
      }
      return compressImage(file).then(function(b64){ return { b64:b64, mime:'image/jpeg', filename:file.name||'чек.jpg' }; });
    }
    function uploadReceipt(kind, refId, file, done){

        if(!j||!j.ok) throw new Error((j&&j.error)||'не сохранилось');
        done&&done(true);
      }).catch(function(e){ alert('Файл не сохранился: '+(e&&e.message||e)); done&&done(false); });

    // сохранение идёт через /pricing-save-materials, который сливает изменения

    var PR=null;       // загруженный pricing (переопределения)

    // ---------- «Номенклатура» (как в 1С): одна таблица, группы слева ----------
    // ЕДИНЫЙ ФОРМАТ (11.2026, просьба Асхата): заводские и добавленные позиции ничем не
    // отличаются — у каждой есть «Вид» (лист, профиль, труба…), характеристики, из
    // которых само собирается наименование, и группа = Вид + марка. Любую позицию можно
    // изменить или удалить.
    // Хранение (сервер не менялся): изменённая заводская позиция пишется в список своих

          Object.keys(it.attrs).forEach(function(k){ if(it.attrs[k]==='') delete it.attrs[k]; });

          if(sc.sheet===false && it.sheet===true){ it.sheet=false; DIRTY[kind+':'+it.code]=1; }

    // тело запроса для /pricing-save-materials (формат сервера прежний)
    function collectPricesTab(){
      var res={ mat:{}, cmp:{}, customMat:[], customCmp:[] };
      ['mat','cmp'].forEach(function(kind){
        var F=nomFact(kind), was=PR[kind]||{}, outP=res[kind], outC=(kind==='mat'?res.customMat:res.customCmp);
        ITEMS[kind].forEach(function(it){
          var key=kind+':'+it.code;
          if(it.factory){
            var b=F[it.code]||{};
            if(+it.u!==+(was[it.code]!=null&&was[it.code]!==''?was[it.code]:b.u)) outP[it.code]=+it.u||0;
            // накладка нужна, если позицию изменили/удалили или она уже была
            var changed = it.hidden || it.lbl!==b.lbl || (it.spec||'')!==String(b.spec||'').trim() || it.sec!==b.sec || it.hadOv || DIRTY[key];
            if(!changed) return;
            var o={ code:it.code, lbl:it.lbl, spec:it.spec||'', sec:it.sec, u:+it.u||0, ost:b.ost, rah:b.rah, attrs:it.attrs||{}, cat:it.cat||'' };
            if(kind==='cmp') o.m=(b.m!=null?b.m:1);
            if(it.sheet!==undefined) o.sheet=it.sheet;
            if(it.hidden) o.hidden=true;
            if(DIRTY[key]){ o.updatedAt=new Date().toISOString(); if(ME&&ME.name) o.by=ME.name; }
            outC.push(o);
          } else {
            if(it.hidden) return;   // удалённая своя позиция — просто не отправляем
            var lbl=String(it.lbl||'').trim(); if(!lbl) return;
            var c=nomClone(it); delete c.factory; delete c.hadOv;
            c.lbl=lbl; c.spec=String(it.spec||'').trim(); c.u=+it.u||0;
            c.sec=String(it.sec||'').trim()||(kind==='mat'?'ДРУГИЕ МАТЕРИАЛЫ':'ДРУГИЕ КОМПОНЕНТЫ');
            if(kind==='mat'){ if(c.ost==null) c.ost=0.15; if(c.rah==null) c.rah=0.04; }
            else { if(c.ost==null) c.ost=0; if(c.rah==null) c.rah=0.07; if(c.m==null) c.m=1; }
            if(DIRTY[key]){ c.updatedAt=new Date().toISOString(); if(ME&&ME.name) c.by=ME.name; }
            outC.push(c);
          }
        });
      });
      return res;
    }
    function sNewCode(t){ return (t==='mat'?'CUSTM_':'CUSTC_')+Date.now().toString(36)+Math.floor(Math.random()*1000); }
    function nomApplyFilter(){
      var q=NOM.q.trim().toLowerCase(), words=q?q.split(/\s+/):[], any=0, vis={};
      [].forEach.call(document.querySelectorAll('tr.nrow'), function(tr){
        var hay=tr.getAttribute('data-q')||'';
        var ok=words.every(function(w){ return hay.indexOf(w)>=0; });
        if(ok && NOM.grp){ var at={}; try{ at=JSON.parse(tr.getAttribute('data-attrs')||'{}'); }catch(e){}
          Object.keys(NOM.flt).forEach(function(k2){ var fv2=NOM.flt[k2]; if(fv2!==''&&fv2!=null&&String(at[k2]==null?'':at[k2])!==String(fv2)) ok=false; }); }
        tr.style.display=ok?'':'none';
        var ar=document.querySelector('tr.nattr[data-for="'+tr.getAttribute('data-code')+'"]');
        if(ar) ar.style.display=(ok&&NOM.open[tr.getAttribute('data-code')])?'':'none';
        if(ok){ any=1; vis[tr.getAttribute('data-g')]=1; }
      });
      [].forEach.call(document.querySelectorAll('tr.ngh'), function(tr){ tr.style.display=vis[tr.getAttribute('data-gh')]?'':'none'; });
      var none=document.getElementById('nomNone'); if(none) none.style.display=any?'none':'';

    // пересобрать наименование/группу позиции из её характеристик
    function nomRebuild(kind,it){
      var sc=nomSchemaById(it.cat)||nomClassify(kind,it), b=sc.build(it.attrs||{});
      it.lbl=b.lbl; it.spec=b.spec; it.sec=nomGroupFor(sc,it.attrs||{},kind,it.sec);
      if(sc.sheet!=null) it.sheet=sc.sheet;
    }
    function nomAddItem(){
      var k=NOM.kind, code=sNewCode(k), sc, a={};
      var inG=NOM.grp?nomList(k).filter(function(r){ return r.sec===NOM.grp; }):[];
      if(inG.length){ sc=nomClassify(k,inG[0]); if(sc.prefix&&inG[0].attrs&&inG[0].attrs.grade) a.grade=inG[0].attrs.grade; }
      else sc=nomSchemasOf(k)[0];
      var it={ code:code, factory:false, cat:sc.id, attrs:a, sec:NOM.grp||'', lbl:'', spec:'', u:'' };
      if(k==='mat'){ it.ost=0.15; it.rah=0.04; } else { it.ost=0; it.rah=0.07; it.m=1; }
      nomRebuild(k,it);
      ITEMS[k].push(it); DIRTY[k+':'+code]=1; NOM.open[code]=1; NOM.focus=code; NOM.q=''; NOM.flt={};
      if(it.sec) NOM.grp=it.sec;
      render();
    }
    function wirePricesTab(){
      var save=document.getElementById('sprSave'); if(!save) return;
      [].forEach.call(document.querySelectorAll('[data-nk]'), function(el){ el.onclick=function(){ NOM.kind=this.getAttribute('data-nk'); NOM.grp=''; NOM.flt={}; render(); }; });
      [].forEach.call(document.querySelectorAll('[data-ng]'), function(el){ el.onclick=function(){ NOM.grp=this.getAttribute('data-ng'); NOM.flt={}; render(); }; });
      [].forEach.call(document.querySelectorAll('[data-flt]'), function(el){ el.onchange=function(){ NOM.flt[el.getAttribute('data-flt')]=el.value; nomApplyFilter(); }; });
      var fc=document.getElementById('nomFltClr'); if(fc) fc.onclick=function(){ NOM.flt={}; render(); };
      var q=document.getElementById('nomQ');
      q.oninput=function(){ NOM.q=q.value; nomApplyFilter(); };
      nomApplyFilter();
      document.getElementById('nomAdd').onclick=nomAddItem;
      [].forEach.call(document.querySelectorAll('tr.nrow'), function(tr){
        var code=tr.getAttribute('data-code'), k=NOM.kind, key=k+':'+code, it=nomGet(k,code);
        if(!it) return;
        var ar=document.querySelector('tr.nattr[data-for="'+code+'"]');
        var pu=tr.querySelector('[data-cf="u"]');
        if(pu) pu.oninput=function(){ var F=nomFact(k); it.u=(pu.value===''?(it.factory&&F[code]?F[code].u:''):+pu.value); nomMark(tr,key); };
        var ed=tr.querySelector('.nom-ed');
        if(ed) ed.onclick=function(){ NOM.open[code]=!NOM.open[code]; if(ar) ar.style.display=NOM.open[code]?'':'none'; ed.classList.toggle('on',!!NOM.open[code]); };
        var x=tr.querySelector('.nom-x');
        if(x) x.onclick=function(){
          if(!confirm('Удалить «'+nomName(it)+'» из номенклатуры?\nИз калькулятора позиция пропадёт, а старые сохранённые расчёты с ней останутся как были.')) return;
          it.hidden=true; DIRTY[key]=1; render();
        };
        if(!ar) return;
        var cs=ar.querySelector('[data-cat]');
        if(cs) cs.onchange=function(){
          var sc=nomSchemaById(cs.value), old=it.attrs||{}, a={};
          // переносим то, что совпадает по смыслу; марку угадываем из старого текста
          sc.fields.forEach(function(f){ if(old[f.k]!=null) a[f.k]=old[f.k]; });
          if(sc.prefix && !a.grade) a.grade=nomGuessGrade(it.sec+' '+it.lbl);
          if(sc.id==='other' && !a.name) a.name=nomName(it);
          if(sc.parse){ var p2=sc.parse(it); Object.keys(p2).forEach(function(k3){ if((a[k3]==null||a[k3]==='') && p2[k3]) a[k3]=p2[k3]; }); }
          it.cat=sc.id; it.attrs=a; nomRebuild(k,it); NOM.open[code]=1; if(NOM.grp) NOM.grp=it.sec;
          DIRTY[key]=1; render();
        };
        [].forEach.call(ar.querySelectorAll('[data-af]'), function(el){
          var on2=function(){
            var fk=el.getAttribute('data-af'), sc=nomSchemaById(it.cat), fdef=sc.fields.filter(function(x){return x.k===fk;})[0]||{};
            var v=el.value;
            if(v==='__new__'){ v=(prompt(fdef.lbl+' (например «медь», «латунь»):')||'').trim(); if(!v){ el.value=(it.attrs||{})[fk]||''; return; } }
            it.attrs=it.attrs||{};
            if(v==='') delete it.attrs[fk]; else it.attrs[fk]=v;
            var oldSec=it.sec; nomRebuild(k,it);
            if(it.sec!==oldSec){ if(NOM.grp===oldSec) NOM.grp=it.sec; DIRTY[key]=1; render(); return; }
            var na=tr.querySelector('.nom-auto'); if(na) na.textContent=nomName(it);
            var ns=tr.querySelector('.nom-spec'); if(ns) ns.textContent=it.spec||'';
            var nu=tr.querySelector('.nom-unit'); if(nu) nu.textContent=nomUnit(k,it);
            tr.setAttribute('data-q',(it.lbl+' '+it.spec+' '+it.sec).toLowerCase());
            tr.setAttribute('data-attrs',JSON.stringify(it.attrs));
            nomMark(tr,key);
          };
          if(el.tagName==='SELECT') el.onchange=on2; else el.oninput=on2;
        });
      });
      if(NOM.focus){ var ar2=document.querySelector('tr.nattr[data-for="'+NOM.focus+'"]'); NOM.focus='';
        if(ar2){ var i=ar2.querySelector('input[data-af]'); if(i){ i.focus(); ar2.scrollIntoView({block:'center'}); } } }
      save.onclick=function(){
        var body=collectPricesTab();
        body.knownCustom=window.__KNOWN_CUSTOM||{};
        var msg=document.getElementById('sprMsg'); msg.textContent='Сохранение…'; msg.style.color='var(--muted)';
        save.disabled=true;
        fetch(WORKER+'/pricing-save-materials',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) })
          .then(function(r){return r.json();}).then(function(j){
            if(!j||!j.ok) throw new Error((j&&j.error)||'?');
            PR.mat=Object.assign({}, PR.mat, body.mat); PR.cmp=Object.assign({}, PR.cmp, body.cmp);
            PR.customMat=body.customMat; PR.customCmp=body.customCmp;
            window.__KNOWN_CUSTOM={ mat:body.customMat.map(function(x){return x.code;}), cmp:body.customCmp.map(function(x){return x.code;}) };
            nomInit(); render();
            var m2=document.getElementById('sprMsg'); if(m2){ m2.textContent='Сохранено ✓ Новые расчёты пойдут по этим ценам и названиям.'; m2.style.color='var(--green)'; }
          }).catch(function(e){ save.disabled=false; msg.textContent='Ошибка: '+(e&&e.message||e); msg.style.color='var(--red)'; });
      };
    }

    function render(){
      var app=document.getElementById('app');
      var h='';
      var tabs=[['req','Заявки'+(OPEN?'<span class="cnt">'+OPEN+'</span>':'')]];
      if(CAN_SUPPLY||IS_ADMIN){
        tabs.push(['tools','Инструмент и сервис'+(DUE?'<span class="cnt">'+DUE+'</span>':'')]);
        tabs.push(['cash','Наличные расходы']);
        tabs.push(['prices','💲 Цены материалов']);
      }
      tabs.forEach(function(x){
        h+='<div class="tab'+(TAB===x[0]?' active':'')+'" data-tab="'+x[0]+'">'+x[1]+'</div>';
      });
      document.getElementById('barTabs').innerHTML=h; h='';
      h+= TAB==='req' ? renderReq() : TAB==='tools' ? renderTools() : TAB==='prices' ? renderPrices() : renderCash();
      app.innerHTML=h;
      [].forEach.call(document.querySelectorAll('.tab[data-tab]'), function(el){ el.onclick=function(){ TAB=this.getAttribute('data-tab'); TOOL_EDIT=null; render(); }; });
      if(TAB==='prices'){ wirePricesTab(); return; }

      if(TAB==='req'){ wireReqBoard(); return; }

      var ta=document.getElementById('taddBtn'); if(ta) ta.onclick=function(){ TOOL_EDIT={}; render(); };
      [].forEach.call(document.querySelectorAll('.tedit'), function(b){
        b.onclick=function(){ var id=+this.getAttribute('data-id'); TOOL_EDIT=JSON.parse(JSON.stringify(TOOLS.filter(function(x){return x.id===id;})[0]||{})); render(); };
      });
      [].forEach.call(document.querySelectorAll('.tdel'), function(b){
        b.onclick=function(){ var id=+this.getAttribute('data-id');
          if(!confirm('Удалить из реестра вместе с чеками?')) return;
          fetch(WORKER+'/tool-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})})
            .then(function(){ loadAll(); });
        };
      });
      var ts=document.getElementById('tsave'); if(ts) ts.onclick=function(){
        TOOL_FIELDS.forEach(function(f){ var el=document.getElementById('tf_'+f[0]); if(el) TOOL_EDIT[f[0]]=el.value.trim(); });
        if(!TOOL_EDIT.name){ alert('Укажите наименование.'); return; }
        var btn=this; btn.disabled=true;
        fetch(WORKER+'/tool-save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tool:TOOL_EDIT})})
          .then(function(r){return r.json();}).then(function(j){
            if(!j.ok) throw new Error(j.error);
            return uploadPending('tool', j.id, 'tp', btn);
          }).then(function(){ TOOL_EDIT=null; loadAll(); })
          .catch(function(e){ alert('Не сохранилось: '+(e&&e.message||e)); btn.disabled=false; btn.textContent='💾 Сохранить'; });
      };
      var tc=document.getElementById('tcancel'); if(tc) tc.onclick=function(){ TOOL_EDIT=null; render(); };
      var trec=document.getElementById('trec'); if(trec && TOOL_EDIT && TOOL_EDIT.id) fillReceipts('tool', TOOL_EDIT.id, trec);
      wirePicker('tp');

      wirePicker('cp'); wirePicker('ip');
      var capply=document.getElementById('capply'); if(capply) capply.onclick=function(){
        var f=document.getElementById('cfrom').value, t2=document.getElementById('cto').value;
        if(!f||!t2) return; if(f>t2){var tmp=f;f=t2;t2=tmp;}
        CASH_RANGE.from=f; CASH_RANGE.to=t2; loadAll();
      };
      [].forEach.call(document.querySelectorAll('[data-pop]'), function(b){
        b.onclick=function(){ var o=document.getElementById(b.getAttribute('data-pop')); if(!o) return; o.style.display='';
          var f=o.querySelector('input[type="text"]'); if(f) f.focus(); };
      });
      [].forEach.call(document.querySelectorAll('[data-popclose]'), function(b){ b.onclick=function(){ document.getElementById(b.getAttribute('data-popclose')).style.display='none'; }; });
      [].forEach.call(document.querySelectorAll('#ipop,#cpop'), function(o){ o.onclick=function(e){ if(e.target===o) o.style.display='none'; }; });
      document.onkeydown=function(e){ if(e.key==='Escape') [].forEach.call(document.querySelectorAll('#ipop,#cpop'), function(o){ o.style.display='none'; }); };
      var iadd=document.getElementById('iadd'); if(iadd) iadd.onclick=function(){
        var amount=+String(document.getElementById('iamount').value).replace(/[^\d.]/g,'');
        var date=document.getElementById('idate').value;
        var note=document.getElementById('inote').value.trim();
        var msg=document.getElementById('imsg');
        if(!(amount>0)||!date){ msg.textContent='Заполните дату и сумму.'; return; }
        var btn=this; btn.disabled=true;
        fetch(WORKER+'/cash-issue-save',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({issue:{date:date,amount:amount,note:note}})})
          .then(function(r){return r.json();}).then(function(j){ if(!j.ok) throw new Error(j.error); return j.id?uploadPending('cash', 'issue-'+j.id, 'ip', msg):null; }).then(function(){ loadAll(); })
          .catch(function(e){ msg.textContent='Не сохранилось: '+(e&&e.message||e); btn.disabled=false; });
      };
      [].forEach.call(document.querySelectorAll('.idel'), function(b){
        b.onclick=function(){ var id=+this.getAttribute('data-id');
          if(!confirm('Удалить эту выдачу? Остаток пересчитается.')) return;
          fetch(WORKER+'/cash-issue-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})})
            .then(function(){ loadAll(); });
        };
      });
      var cadd=document.getElementById('cadd'); if(cadd) cadd.onclick=function(){
        var amount=+String(document.getElementById('camount').value).replace(/[^\d.]/g,'');
        var what=document.getElementById('cwhat').value.trim();
        var date=document.getElementById('cdate').value;
        var msg=document.getElementById('cmsg');
        if(!(amount>0)||!what||!date){ msg.textContent='Заполните дату, сумму и «на что».'; return; }
        var btn=this; btn.disabled=true;
        fetch(WORKER+'/cash-save',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({entry:{date:date,amount:amount,what:what,note:document.getElementById('cnote').value.trim()}})})
          .then(function(r){return r.json();}).then(function(j){
            if(!j.ok) throw new Error(j.error);
            return uploadPending('cash', j.id, 'cp', msg);
          }).then(function(){ btn.disabled=false; loadAll(); })
          .catch(function(e){ msg.textContent='Ошибка: '+(e&&e.message||e); btn.disabled=false; });
      };
      [].forEach.call(document.querySelectorAll('.cdel'), function(b){
        b.onclick=function(){ var id=+this.getAttribute('data-id');
          if(!confirm('Удалить запись вместе с чеками?')) return;
          fetch(WORKER+'/cash-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})})
            .then(function(){ loadAll(); });
        };
      });
      [].forEach.call(document.querySelectorAll('.crec'), function(el){ fillReceipts('cash', el.getAttribute('data-id'), el); });
      [].forEach.call(document.querySelectorAll('.cfile'), function(inp){
        inp.onchange=function(){ if(this.files && this.files[0]) uploadReceipt('cash', this.getAttribute('data-id'), this.files[0], function(){ render(); }); };
      });
    }

    // раздел «Заявки» видят все работники; инструмент/наличные/цены — снабженец и руководство
    t.member('id','fullName','username').then(function(m){
      ME.id=(m&&m.id)||''; ME.name=(m&&(m.fullName||m.username))||'';
      return isDirector();
    }).then(function(admin){
      IS_ADMIN=admin;
      if(admin){ CAN_SUPPLY=true; return; }
      return fetch(WORKER+'/worker-perms?memberId='+encodeURIComponent(ME.id))
        .then(function(r){return r.json();}).then(function(j){ CAN_SUPPLY=!!(j&&j.canSupply); })
        .catch(function(){ CAN_SUPPLY=false; });
    }).then(loadAll)
      .catch(function(e){ document.getElementById('boot').textContent='Ошибка: '+(e&&e.message||e); });
  </script>
</body>
</html>
