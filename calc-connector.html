<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Калькулятор стоимости - Connector</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./config.js"></script>
</head>
<body>
  <script>
    // Adds a "Калькулятор стоимости" section to the card back with a button
    // that opens the full calculator modal. Stores results on the card and
    // logs every order to the central D1 database via the Worker.
    window.TrelloPowerUp.initialize({
      'card-detail-badges': function (t, options) {
        // фишка «QR-этикетка» в одном ряду и стиле с «Метки» и «Card Number»
        return [{
          title: 'Этикетка',
          text: '▦ QR / печать',
          color: null,
          callback: function (t) {
            return Promise.all([ t.card('id'), t.board('id') ]).then(function (r) {
              var c = r[0], b = r[1];
              return t.modal({
                url: './label-modal.html?t=' + Date.now(),
                fullscreen: true,
                title: 'Этикетка со штрих-кодом',
                args: { cardId: (c && c.id) || '', boardId: (b && b.id) || '' }
              });
            });
          }
        }];
      },
      'card-back-section': function (t, options) {
        return {
          title: 'Калькулятор стоимости', // подпись СЕКЦИИ на карточке — не шапка окна
          icon: t.signUrl('./calc-icon.svg'),
          content: {
            type: 'iframe',
            url: t.signUrl('./calc-section.html'),
            height: 96
          }
        };
      },
      'board-buttons': function (t, options) {
        // Иконки кнопок доски — прямыми ссылками, без t.signUrl: подписанные прокси-ссылки
        // в новой шапке Trello не загружаются (официальный пример Trello тоже использует прямые URL)
        var ICON_BASE = window.location.href.replace(/[^/]*(\?.*)?$/, '');
        // «Мой заработок» видят все; «CRM» и «Панель руководителя» — только руководитель (админ доски/пространства)
        function isAdmin(){
          return Promise.all([
            t.member('id'),
            t.board('memberships'),
            t.organization('memberships').catch(function(){ return null; })
          ]).then(function(res){
            var me = res[0] || {};
            function adminIn(o){
              var ms = ((o && o.memberships) || []).filter(function(x){ return x.idMember === me.id; })[0];
              return !!(ms && ms.memberType === 'admin');
            }
            return adminIn(res[1]) || adminIn(res[2]);
          }).catch(function(){ return false; });
        }
        var earnBtn = {
          // эксперимент: подпись нарисована в самой иконке (новая шапка Trello не
          // показывает текст кнопок Power-Up). Если отрендерится читаемо — переведём все.
          icon: { dark: ICON_BASE + 'ic-lbl-earnings-w.png', light: ICON_BASE + 'ic-lbl-earnings-b.png' },
          text: 'Мой заработок',
          callback: function (t) {
            return t.modal({
              url: t.signUrl('./my-earnings-modal.html') + '?t=' + Date.now(),
              fullscreen: true,
              // title убран: шапку рисует само окно (синий бар)
            });
          }
        };
        var crmBtn = {
          icon: { dark: ICON_BASE + 'ic-crm-w.png', light: ICON_BASE + 'ic-crm-b.png' },
          text: 'CRM / Клиенты',
          callback: function (t) {
            return t.modal({
              url: './crm-modal.html?t=' + Date.now(),
              fullscreen: true,
              // title убран: шапку рисует само окно (синий бар)
            });
          }
        };
        var buhBtn = {
          icon: { dark: ICON_BASE + 'ic-buh-w.png', light: ICON_BASE + 'ic-buh-b.png' },
          text: 'Бухгалтерия',
          callback: function (t) {
            return t.modal({
              url: './buh-modal.html?t=' + Date.now(),
              fullscreen: true,
              // title убран: шапку рисует само окно (синий бар)
            });
          }
        };
        var repairBtn = {
          icon: { dark: ICON_BASE + 'ic-repair-w.png', light: ICON_BASE + 'ic-repair-b.png' },
          text: 'Ремонт',
          callback: function (t) {
            return t.modal({
              url: './repair-board-modal.html?t=' + Date.now(),
              fullscreen: true,
              // title убран: шапку рисует само окно (синий бар)
            });
          }
        };
        var supBtn = {
          icon: { dark: ICON_BASE + 'ic-supply-w.png', light: ICON_BASE + 'ic-supply-b.png' },
          text: 'Снабжение',
          callback: function (t) {
            return t.modal({
              url: './supply-modal.html?t=' + Date.now(),
              fullscreen: true,
              // title убран: шапку рисует само окно (синий бар)
            });
          }
        };
        var tabelBtn = {
          icon: { dark: ICON_BASE + 'ic-tabel-w.png', light: ICON_BASE + 'ic-tabel-b.png' },
          text: 'Табель',
          callback: function (t) {
            return t.modal({
              url: './timesheet-modal.html?t=' + Date.now(),
              fullscreen: true,
              // title убран: шапку рисует само окно (синий бар)
            });
          }
        };
        var dashBtn = {
          icon: { dark: ICON_BASE + 'ic-dashboard-w.png', light: ICON_BASE + 'ic-dashboard-b.png' },
          text: 'Панель руководителя',
          callback: function (t) {
            return t.modal({
              url: t.signUrl('./dashboard-modal.html') + '?t=' + Date.now(),
              fullscreen: true,
              // title убран: шапку рисует само окно (синий бар)
            });
          }
        };
        function perms(){
          var W = (window.CONFIG && window.CONFIG.WORKER_URL) || window.WORKER_URL || '';
          return t.member('id').then(function(me){
            return fetch(W + '/worker-perms?memberId=' + encodeURIComponent((me && me.id) || ''))
              .then(function(r){ return r.json(); })
              .then(function(j){ return { canInvoice: !!(j && j.canInvoice), canSupply: !!(j && j.canSupply), canCrm: !!(j && j.canCrm), canTimesheet: !!(j && j.canTimesheet), canDashboard: !!(j && j.canDashboard), canRepair: !!(j && j.canRepair) }; });
          }).catch(function(){ return { canInvoice:false, canSupply:false, canCrm:false, canTimesheet:false, canDashboard:false, canRepair:false }; });
        }
        // директорские разделы собраны в ОДНУ кнопку-меню: чем меньше кнопок в шапке,
        // тем выше шанс, что Trello покажет подписи текстом, а не свернёт в иконки
        function mgmtBtn(items){
          return {
            icon: { dark: ICON_BASE + 'ic-dashboard-w.png', light: ICON_BASE + 'ic-dashboard-b.png' },
            text: 'Управление',
            callback: function (t) {
              return t.popup({
                title: 'Управление', // заголовок попап-меню — не шапка модала
                items: items.map(function(b){ return { text: b.text, callback: b.callback }; })
              });
            }
          };
        }
        return isAdmin().then(function(admin){
          if (admin) return [earnBtn, repairBtn, supBtn, tabelBtn, mgmtBtn([dashBtn, buhBtn, crmBtn])];
          return perms().then(function(p){
            var out = [earnBtn, repairBtn, supBtn]; // ремонт и снабжение (канбан заявок) — любой работник;
            // внутри «Снабжения» инструмент/наличные/цены видят только снабженец и руководство
            if (p.canTimesheet || p.canInvoice) out.push(tabelBtn); // табель: начальник цеха (заполняет) и бухгалтер (смотрит)
            var mgmt = [];
            if (p.canDashboard) mgmt.push(dashBtn);
            if (p.canInvoice) mgmt.push(buhBtn);
            if (p.canCrm) mgmt.push(crmBtn);
            if (mgmt.length === 1) out.push(mgmt[0]);           // одна привилегия — прямой кнопкой
            else if (mgmt.length > 1) out.push(mgmtBtn(mgmt));  // несколько — единым меню
            return out;
          });
        });
      }
    });
  </script>
</body>
</html>
