<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DXF / Раскрой</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./config.js"></script>
  <style>
    html[data-color-mode="light"] { --txt:#172b4d; --muted:#5e6c84; --chip:#f4f5f7; --ok:#1f845a; --okbg:#e3fcef; }
    html[data-color-mode="dark"]  { --txt:#c7d1db; --muted:#9fadbc; --chip:#2c333a; --ok:#4bce97; --okbg:#1c3329; }
    html { --txt:#172b4d; --muted:#5e6c84; --chip:#f4f5f7; --ok:#1f845a; --okbg:#e3fcef; }
    html, body { margin:0; padding:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #list { padding:6px 4px; }
    .hdr { display:flex; align-items:center; gap:8px; padding:2px 4px 8px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
    .hdr b { color:var(--txt); }
    .hdr .pill { background:var(--chip); border-radius:10px; padding:2px 9px; font-weight:600; }
    .hdr .pill.done { background:var(--okbg); color:var(--ok); }
    .row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:5px 4px; }
    .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; color:var(--txt); }
    .ext { display:inline-block; font-size:10px; font-weight:700; color:var(--muted); background:var(--chip); border-radius:3px; padding:1px 5px; margin-right:6px; }
    .btn { flex:0 0 auto; background:#0c66e4; color:#fff; border:none; border-radius:3px; padding:5px 12px; font-size:12px; font-weight:600; cursor:pointer; }
    .btn:hover { background:#0055cc; }
    .st { flex:0 0 68px; text-align:left; font-size:12px; white-space:nowrap; }
    .st .ok { color:var(--ok); font-weight:700; }
    .st .no { color:var(--muted); opacity:.55; }
    .empty { padding:8px 4px; font-size:12px; color:var(--muted); }
    .tools { display:flex; gap:6px; flex-wrap:wrap; padding:0 4px 8px; }
    .tbtn { background:var(--chip); color:var(--txt); border:1px solid rgba(9,30,66,.15); border-radius:3px; padding:4px 10px; font-size:12px; font-weight:600; cursor:pointer; }
    .tbtn.go { background:#1f845a; color:#fff; border-color:#1f845a; }
    .item { border:1px solid rgba(9,30,66,.15); border-radius:6px; margin:0 2px 8px; padding:4px 6px 2px; }
    .item.free { border-style:dashed; }
    .ihd { display:flex; align-items:center; gap:6px; padding:3px 0 4px; font-size:12px; color:var(--muted); }
    .ihd input { font-size:13px; padding:3px 6px; border:1px solid rgba(9,30,66,.25); border-radius:3px; color:#172b4d; background:#fff; }
    .ihd input.nm { flex:1; min-width:80px; font-weight:600; }
    .ihd input.q { width:58px; text-align:right; }
    .ihd .del { background:none; border:none; color:#c9372c; cursor:pointer; font-size:14px; padding:0 4px; }
    .ihd .ttl { flex:1; font-weight:600; }
    .up { background:#e9f2ff; color:#0c66e4; border:1px solid #85b8ff; border-radius:3px; padding:3px 9px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
    .dlb { flex:0 0 auto; display:inline-block; text-decoration:none; background:#e9f2ff; color:#0c66e4; border:1px solid #85b8ff; border-radius:3px; padding:4px 8px; font-size:12px; font-weight:700; }
    .dlb:hover { background:#cce0ff; }
    .up.dlall { background:#e3fcef; color:#1f845a; border-color:#7ee2b8; }
    .fdel { flex:0 0 auto; background:none; border:none; color:#8590a2; cursor:pointer; font-size:13px; padding:0 4px; }
    .fdel:hover, .fdel[data-sure="1"] { color:#c9372c; }
    select.mv { flex:0 0 auto; max-width:120px; font-size:11px; padding:2px; border:1px solid rgba(9,30,66,.2); border-radius:3px; color:#172b4d; background:#fff; }
  </style>
</head>
<body>
  <div id="list"><div class="empty">Загрузка…</div></div>
  <script>
    var t = window.TrelloPowerUp.iframe();
    var WORKER = (window.CONFIG && window.CONFIG.WORKER_URL) || window.WORKER_URL || '';
    function getExt(n){ var m=/\.[^.]+$/.exec((n||'').toLowerCase()); return m?m[0]:''; }
    function isDxf(a){ return getExt(a.fileName||a.name||a.url||'')==='.dxf'; }
    function isZzx(a){ return getExt(a.fileName||a.name||a.url||'')==='.zzx'; }
    // ПРОЧИЕ ФАЙЛЫ ИЗДЕЛИЯ (решение Асхата, 12.11.2026): PDF, фото, STEP… — загруженные в карточку
    // (не ссылки). Лежат в изделии рядом с DXF/ZZX, качаются по одному, в «Скачать все» не входят.
    function isOther(a){ return !isDxf(a) && !isZzx(a) && (a.isUpload!==false) && /trello/i.test(String(a.url||'trello')); }
    function extLabel(a){ var e=getExt(a.fileName||a.name||a.url||'').replace('.',''); return (e||'файл').toUpperCase().slice(0,5); }
    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    var ITEMS = [];          // [{id,name,qty,files:[attId]}] — изделия этой карточки
    var CARD_ID = null, FILES = [], METRICS = {};
    function itemOf(attId){ for (var i=0;i<ITEMS.length;i++) if ((ITEMS[i].files||[]).indexOf(attId)>=0) return ITEMS[i]; return null; }

    function openViewer(att, cardId, queue){
      var fileName = att.fileName || att.name;
      var it = itemOf(att.id);
      return t.modal({
        title: (it ? (it.name + ' · ') : '') + (att.name || fileName),
        url: './dxf-viewer.html',
        args: { cardId: cardId, attachmentId: att.id, fileName: fileName, itemName: it ? it.name : '', itemQty: it ? (+it.qty||1) : 0, queue: queue || [] },
        accentColor: '#172b4d',
        fullscreen: true
      });
    }
    function openZzx(att, cardId){
      var fileName = att.fileName || att.name;
      return t.modal({
        title: att.name || fileName,
        url: './zzx-modal.html?t=' + Date.now(),
        args: { cardId: cardId, attachmentId: att.id, fileName: fileName, url: att.url },
        accentColor: '#8a5a2b',
        fullscreen: true
      });
    }

    // сохранённые расчёты: из базы (D1) + старые записи с карточки; заодно изделия
    function loadMetrics(cardId){
      var fromD1 = fetch(WORKER+'/dxf-get?cardId='+encodeURIComponent(cardId))
        .then(function(r){ return r.json(); })
        .then(function(j){ if (j && j.ok && Array.isArray(j.items) && !editing()) ITEMS = j.items; return (j && j.ok && j.metrics) || {}; })
        .catch(function(){ return {}; });
      var fromCard = t.get('card','shared','dxfMetrics', {}).catch(function(){ return {}; });
      return Promise.all([fromCard, fromD1]).then(function(res){
        return Object.assign({}, res[0]||{}, res[1]||{});   // база главнее
      });
    }
    function saveItems(){
      setMsg('Сохраняю изделия…');
      return fetch(WORKER+'/card-items', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ cardId: CARD_ID, items: ITEMS }) })
        .then(function(r){ return r.json(); })
        .then(function(j){ if (!j || !j.ok) throw new Error((j&&j.error)||'не сохранено'); ITEMS = j.items || ITEMS; setMsg('Изделия сохранены ✓'); })
        .catch(function(e){ setMsg('Ошибка сохранения изделий: '+(e&&e.message||'')); });
    }
    var _msgT=null;
    var LASTMSG='';
    function setMsg(tx){ LASTMSG=tx||''; var m=document.getElementById('msg'); if(m) m.textContent=LASTMSG; clearTimeout(_msgT); if(tx) _msgT=setTimeout(function(){ LASTMSG=''; var m2=document.getElementById('msg'); if(m2) m2.textContent=''; }, 6000); }
    function editing(){ var a=document.activeElement; return !!(a && (a.tagName==='INPUT' || a.tagName==='SELECT')); }

    // загрузка DXF сразу в изделие (по одному файлу, чтобы не зависало)
    function uploadFiles(fileList, itemId){
      // в изделие — любые файлы (PDF, фото, чертежи); без изделия — только DXF/ZZX
      var list=[].slice.call(fileList||[]).filter(function(f){ return itemId ? true : /\.(dxf|zzx)$/i.test(f.name); });
      var skipped=(fileList||[]).length-list.length;
      if(!list.length){ setMsg('Можно загружать только .dxf и .zzx'); return Promise.resolve(); }
      var i=0, ok=0, errs=[]; UPLOADING++;
      function next(){
        if(i>=list.length){
          UPLOADING=Math.max(0,UPLOADING-1);
          setMsg('Загружено '+ok+' из '+list.length+(skipped?(' · пропущено не-DXF: '+skipped):'')+(errs.length?(' · ошибки: '+errs.join('; ')):''));
          return autoPlace().then(draw);
        }
        var f=list[i++]; setMsg('Загружаю '+i+' из '+list.length+': '+f.name+'…');
        var fd=new FormData(); fd.append('cardId', CARD_ID); if(itemId) fd.append('itemId', itemId); fd.append('file', f, f.name);
        return fetch(WORKER+'/card-file-upload', { method:'POST', body: fd })
          .then(function(r){ return r.json(); })
          .then(function(j){
            if(!j||!j.ok) throw new Error((j&&j.error)||'не загружено');
            ok++; if(Array.isArray(j.items)) ITEMS=j.items;
            if(!FILES.some(function(a){ return a.id===j.attachment.id; })) FILES.push(j.attachment);
          })
          .catch(function(e){ errs.push(f.name+': '+(e&&e.message||'')); })
          .then(next);
      }
      return next();
    }
    function pickAndUpload(itemId){
      var inp=document.createElement('input'); inp.type='file'; inp.multiple=true; if(!itemId) inp.accept='.dxf,.zzx';
      inp.style.display='none'; document.body.appendChild(inp);
      inp.addEventListener('change', function(){ var fl=inp.files; uploadFiles(fl, itemId).then(function(){ inp.remove(); }); });
      inp.click();
    }
    function deleteFile(att){
      setMsg('Удаляю '+(att.name||'')+'…');
      return fetch(WORKER+'/card-file-delete', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ cardId: CARD_ID, attachmentId: att.id }) })
        .then(function(r){ return r.json(); })
        .then(function(j){
          if(!j||!j.ok) throw new Error((j&&j.error)||'не удалено');
          if(Array.isArray(j.items)) ITEMS=j.items;
          FILES=FILES.filter(function(a){ return a.id!==att.id; }); delete METRICS[att.id];
          setMsg('Файл удалён'); return draw();
        })
        .catch(function(e){ setMsg('Ошибка удаления: '+(e&&e.message||'')); });
    }

    // РАЗЛОЖИТЬ ПО НАЗВАНИЮ: файл «Шкаф_стенка.dxf» → изделие «Шкаф».
    // Сравниваем без регистра, пробелов, «_», «-»; при двух подходящих изделиях
    // берём то, чьё название длиннее совпало; если неясно — файл не трогаем.
    function norm(x){ return String(x||'').toLowerCase().replace(/ё/g,'е').replace(/\.[a-z0-9]+$/,'').replace(/[^a-zа-я0-9]+/g,''); }
    function guessItem(att){
      var fn=norm(att.name||att.fileName), best=null, bestLen=0, tie=false;
      ITEMS.forEach(function(it){
        var n=norm(it.name); if(n.length<2 || /^изделие\d*$/.test(n)) return;
        if(fn.indexOf(n)>=0){ if(n.length>bestLen){ best=it; bestLen=n.length; tie=false; } else if(n.length===bestLen) tie=true; }
      });
      return tie?null:best;
    }
    // переносим, если по имени файл явно от другого изделия, а к текущему имя не подходит
    function wantsMove(a){
      var g=guessItem(a); if(!g) return null; var cur=itemOf(a.id);
      if(cur===g) return null;
      if(cur){ var cn=norm(cur.name); if(cn.length>=2 && !/^изделие\d*$/.test(cn) && norm(a.name||a.fileName).indexOf(cn)>=0) return null; }
      return g;
    }
    function autoAssign(){
      var dx=FILES.filter(function(a){ return isDxf(a)||isZzx(a); }), moved=0;
      dx.forEach(function(a){ var it=wantsMove(a); if(!it) return;
        ITEMS.forEach(function(x){ x.files=(x.files||[]).filter(function(f){ return f!==a.id; }); });
        it.files.push(a.id); moved++; });
      if(!moved){ setMsg('По названиям не нашёл, куда разложить: в имени файла должно быть название изделия'); return; }
      saveItems().then(function(){ setMsg('Разложено по названию: '+moved+' файл(ов)'); return draw(); });
    }

    function recFor(att){ return METRICS[att.id] || METRICS['zzx:'+(att.fileName||att.name||'')] || null; }

    function statusCell(rec, inItem){
      var st=document.createElement('span'); st.className='st';
      if (rec){
        var q = +rec.quantity || 1;
        st.innerHTML='<span class="ok" title="Расчёт сохранён'+(rec.thicknessMm?(' · '+rec.thicknessMm+' мм'):'')+'">✓ '+q+(inItem?' шт/изд':' шт')+'</span>';
      } else {
        st.innerHTML='<span class="no" title="Расчёт ещё не сохранён">—</span>';
      }
      return st;
    }
    function moveSelect(att){
      var sel=document.createElement('select'); sel.className='mv'; sel.title='Перенести этот файл в другое изделие';
      var cur=itemOf(att.id);
      sel.innerHTML='<option value="">'+(cur?'→ без изделия':'— без изделия —')+'</option>'+ITEMS.map(function(it){ return '<option value="'+esc(it.id)+'"'+(cur&&cur.id===it.id?' selected':'')+'>'+(cur&&cur.id===it.id?'':'→ ')+esc(it.name)+'</option>'; }).join('');
      sel.addEventListener('change', function(){
        ITEMS.forEach(function(it){ it.files=(it.files||[]).filter(function(f){ return f!==att.id; }); });
        var to=ITEMS.filter(function(it){ return it.id===sel.value; })[0];
        if (to) to.files.push(att.id);
        sel.blur(); saveItems().then(draw);
      });
      return sel;
    }
    // СКАЧИВАНИЕ ДЛЯ ОПЕРАТОРА СТАНКА (решение Асхата, 11.11.2026): файл — под именем, что дал
    // инженер; «Скачать все» — все файлы изделия в папку с названием изделия (без zip)
    function dlUrl(att){
      var fn=att.fileName||att.name||'';
      return WORKER+'/download?'+new URLSearchParams({ cardId:CARD_ID, attachmentId:att.id, fileName:fn }).toString()+'&save=1&as='+encodeURIComponent(att.name||fn);
    }
    function dlAll(it, list, kind){
      if(!list.length){ setMsg('В изделии «'+it.name+'» нет файлов'); return; }
      var data=list.map(function(a){ return { id:a.id, name:a.name||a.fileName||'', fileName:a.fileName||a.name||'' }; });
      var u=new URL('./dl-files.html', location.href);
      u.search='?cardId='+encodeURIComponent(CARD_ID)+'&item='+encodeURIComponent(it.name)+(kind?'&kind='+kind:'');
      u.hash=encodeURIComponent(JSON.stringify(data));
      var w=window.open(u.toString(), '_blank');
      if(!w) setMsg('Браузер заблокировал окно — разрешите всплывающие окна для trello.com');
    }
    // ОТКРЫТЬ PDF / КАРТИНКУ / STEP во всплывающем окне Trello (не скачивать; закрывается
    // крестиком или кликом мимо окна) — решение Асхата, 12.11.2026
    function openOther(att){
      var fn=att.fileName||att.name||'', e=getExt(fn||att.url||'');
      if (e==='.step'||e==='.stp') return t.modal({ title: att.name||fn, url:'./viewer.html', args:{ cardId:CARD_ID, attachmentId:att.id, fileName:fn, isUpload: att.isUpload===false?'0':'1' }, accentColor:'#172b4d', fullscreen:true });
      if (/^\.(pdf|png|jpe?g|webp|gif|svg|bmp)$/.test(e)) return t.modal({ title: att.name||fn, url:'./file-preview.html', args:{ cardId:CARD_ID, attachmentId:att.id, fileName:fn }, accentColor:'#172b4d', height: 760 });
      setMsg('«'+(att.name||fn)+'» нельзя показать в окне — скачайте кнопкой ⬇');
    }
    function fileRow(att, isZ){
      var fileName=att.fileName||att.name||'';
      var isO=isOther(att);
      var row=document.createElement('div'); row.className='row';
      var nm=document.createElement('span'); nm.className='name';
      var ext=document.createElement('span'); ext.className='ext'; ext.textContent=isO?extLabel(att):(isZ?'ZZX':'DXF');
      if (isO) ext.style.background='#dfe1e6';
      var txt=document.createElement('span'); txt.textContent=att.name||fileName;
      nm.appendChild(ext); nm.appendChild(txt);
      var btn=document.createElement('button'); btn.className='btn'; btn.type='button';
      if (isO){ btn.style.background='#626f86'; btn.textContent='Открыть'; btn.addEventListener('click', function(){ openOther(att); }); }
      else if (isZ){ btn.style.background='#8a5a2b'; btn.textContent='Просмотр'; btn.addEventListener('click', function(){ openZzx(att, CARD_ID); }); }
      else { btn.textContent='Открыть / Расчёт'; btn.addEventListener('click', function(){ openViewer(att, CARD_ID); }); }
      row.appendChild(nm);
      // выбор нужен только когда есть куда перенести: 2+ изделия или файл пока без изделия
      if (ITEMS.length > 1 || (ITEMS.length && !itemOf(att.id))) row.appendChild(moveSelect(att));
      // галочка для массового переноса — у файлов без изделия
      if (ITEMS.length && !itemOf(att.id)) { var cb=document.createElement('input'); cb.type='checkbox'; cb.className='pick'; cb.setAttribute('data-id', att.id); cb.title='Отметить для переноса'; cb.style.marginRight='4px'; row.insertBefore(cb, row.firstChild); }
      var dl=document.createElement('a'); dl.className='dlb'; dl.href=dlUrl(att); dl.target='_blank'; dl.rel='noopener'; dl.textContent='⬇'; dl.title='Скачать файл «'+(att.name||fileName)+'»';
      row.appendChild(btn); row.appendChild(dl);
      if (isO){ var sp=document.createElement('span'); sp.className='st'; row.appendChild(sp); } else row.appendChild(statusCell(recFor(att), !!itemOf(att.id)));
      var fx=document.createElement('button'); fx.className='fdel'; fx.type='button'; fx.textContent='✕'; fx.title='Удалить файл с карточки (ошибочно загружен)';
      fx.addEventListener('click', function(){
        if (fx.getAttribute('data-sure')!=='1'){ fx.setAttribute('data-sure','1'); fx.textContent='удалить?'; setTimeout(function(){ if(fx.isConnected){ fx.removeAttribute('data-sure'); fx.textContent='✕'; } }, 3000); return; }
        fx.disabled=true; deleteFile(att);
      });
      row.appendChild(fx);
      return row;
    }

    // рамка файлов без изделия: галочки + «перенести отмеченные в…»; collapsed — свернуть по умолчанию
    var OPEN_OTHERS=false;
    function freeBox(el, free, title, collapsed){
      if (!free.length) return;
      var fb=document.createElement('div'); fb.className='item free';
      var fh=document.createElement('div'); fh.className='ihd';
      var open=!collapsed || OPEN_OTHERS;
      fh.innerHTML='<label style="display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" class="pickAll"> все</label><span class="ttl" style="cursor:'+(collapsed?'pointer':'default')+'">'+(collapsed?(open?'▾ ':'▸ '):'')+esc(title)+' ('+free.length+')</span>';
      if (collapsed) fh.querySelector('.ttl').addEventListener('click', function(){ OPEN_OTHERS=!OPEN_OTHERS; draw(); });
      // МАССОВЫЙ ПЕРЕНОС: отметить галочками → выбрать изделие (решение Асхата, 11.11.2026)
      var bulk=document.createElement('select'); bulk.className='mv'; bulk.style.maxWidth='190px';
      bulk.innerHTML='<option value="">перенести отмеченные в…</option>'+ITEMS.map(function(it){ return '<option value="'+esc(it.id)+'">→ '+esc(it.name)+'</option>'; }).join('');
      bulk.addEventListener('change', function(){
        var to=ITEMS.filter(function(it){ return it.id===bulk.value; })[0]; if(!to) return;
        var ids=[].map.call(fb.querySelectorAll('input.pick:checked'), function(c){ return c.getAttribute('data-id'); });
        if(!ids.length){ bulk.value=''; setMsg('Сначала отметьте файлы галочками'); return; }
        ids.forEach(function(id){ if(to.files.indexOf(id)<0) to.files.push(id); });
        bulk.blur(); saveItems().then(function(){ setMsg('Перенесено в «'+to.name+'»: '+ids.length); return draw(); });
      });
      fh.appendChild(bulk); fb.appendChild(fh);
      if (open) free.forEach(function(att){ fb.appendChild(fileRow(att,isZzx(att))); });
      el.appendChild(fb);
      var pa=fb.querySelector('.pickAll'); pa.addEventListener('change', function(){ if(!open){ OPEN_OTHERS=true; draw(); return; } [].forEach.call(fb.querySelectorAll('input.pick'), function(c){ c.checked=pa.checked; }); });
    }

    function draw(){
      var el=document.getElementById('list');
      var dxfs=FILES.filter(isDxf), zzxs=FILES.filter(isZzx), others=FILES.filter(isOther);
      if (dxfs.length===0 && zzxs.length===0 && !ITEMS.length){ el.innerHTML='<div class="empty">Нет файлов DXF или .zzx на карточке.</div>'; return t.sizeTo('#list'); }
      // файлы, которых уже нет на карточке, из изделий убираем только на экране
      var alive={}; dxfs.forEach(function(a){ alive[a.id]=1; });
      var files=dxfs.concat(zzxs);
      var done=files.filter(recFor).length;
      var totalQty=files.reduce(function(s,a){ var r=recFor(a); if(!r) return s; var it=itemOf(a.id); return s+(+r.quantity||1)*(it?(+it.qty||1):1); },0);
      el.innerHTML='';
      var hdr=document.createElement('div'); hdr.className='hdr';
      hdr.innerHTML='Файлов: <b>'+files.length+'</b>'
        +(zzxs.length?('&nbsp;<span class="pill">DXF '+dxfs.length+' · ZZX '+zzxs.length+'</span>'):'')
        +'&nbsp;<span class="pill'+(done===files.length?' done':'')+'">рассчитано '+done+' из '+files.length+'</span>'
        +(totalQty?('&nbsp;<span class="pill done">итого деталей '+totalQty+' шт</span>'):'')
        +(ITEMS.length?('&nbsp;<span class="pill">изделий '+ITEMS.length+' · '+ITEMS.reduce(function(s,i){return s+(+i.qty||1);},0)+' шт</span>'):'');
      el.appendChild(hdr);

      var tools=document.createElement('div'); tools.className='tools';
      var addB=document.createElement('button'); addB.className='tbtn'; addB.type='button'; addB.textContent='+ Изделие';
      addB.title='Объект из нескольких разных изделий: каждое изделие — своя папка DXF-деталей и своё количество';
      addB.addEventListener('click', function(){
        var nm=(ITEMS.length?'Изделие '+(ITEMS.length+1):'Изделие 1');
        var it={ id:'i'+Date.now().toString(36), name:nm, qty:1, files:[] };
        // первое изделие: все DXF без изделия сразу кладём в него (обычный случай — одно изделие)
        if (!ITEMS.length) it.files = files.map(function(a){ return a.id; });
        // новое изделие — СВЕРХУ, сразу под кнопкой, с курсором в названии (решение Асхата, 11.11.2026)
        ITEMS.unshift(it); FOCUS_ITEM=it.id; saveItems().then(draw);
      });
      tools.appendChild(addB);
      if (!ITEMS.length){
        var upB=document.createElement('button'); upB.className='up'; upB.type='button'; upB.textContent='⬆ Загрузить DXF';
        upB.addEventListener('click', function(){ pickAndUpload(''); });
        tools.appendChild(upB);
      }
      var freeGuess=ITEMS.length>0 ? files.filter(function(a){ return !!wantsMove(a); }).length : 0;
      if (freeGuess){
        var agB=document.createElement('button'); agB.className='tbtn'; agB.type='button'; agB.textContent='Разложить по названию ('+freeGuess+')';
        agB.title='Файл, в имени которого есть название изделия (например «Шкаф_стенка.dxf»), попадёт в это изделие';
        agB.addEventListener('click', autoAssign);
        tools.appendChild(agB);
      }
      var todo=dxfs.filter(function(a){ return !recFor(a); });
      if (todo.length){
        var qB=document.createElement('button'); qB.className='tbtn go'; qB.type='button';
        qB.textContent='Рассчитать по очереди ('+todo.length+')';
        qB.title='Откроет нерассчитанные DXF один за другим: сохранили — сразу открывается следующий';
        qB.addEventListener('click', function(){
          var q=todo.map(function(a){ var it=itemOf(a.id); return { id:a.id, fileName:a.fileName||a.name, name:a.name, itemName: it?it.name:'', itemQty: it?(+it.qty||1):0 }; });
          q.shift(); openViewer(todo[0], CARD_ID, q);
        });
        tools.appendChild(qB);
      }
      var msg=document.createElement('span'); msg.id='msg'; msg.textContent=LASTMSG; msg.style.cssText='font-size:12px;color:var(--muted);align-self:center';
      tools.appendChild(msg);
      el.appendChild(tools);

      if (!ITEMS.length){
        dxfs.forEach(function(att){ el.appendChild(fileRow(att,false)); });
      } else {
        ITEMS.forEach(function(it, idx){
          var box=document.createElement('div'); box.className='item';
          var h=document.createElement('div'); h.className='ihd';
          var nm=document.createElement('input'); nm.className='nm'; nm.value=it.name; nm.title='Название изделия';
          if (FOCUS_ITEM===it.id) { FOCUS_ITEM=null; setTimeout(function(){ try{ nm.focus(); nm.select(); nm.scrollIntoView({block:'nearest'}); }catch(e){} }, 30); }
          nm.addEventListener('change', function(){ it.name=(nm.value||'').trim()||('Изделие '+(idx+1)); saveItems().then(draw); });
          var x=document.createElement('span'); x.textContent='×';
          var q=document.createElement('input'); q.className='q'; q.type='number'; q.min='1'; q.step='1'; q.value=it.qty; q.title='Сколько таких изделий в заказе';
          q.addEventListener('change', function(){ it.qty=Math.max(1,Math.round(+q.value||1)); q.value=it.qty; saveItems().then(draw); });
          var sh=document.createElement('span'); sh.textContent='шт';
          var del=document.createElement('button'); del.className='del'; del.type='button'; del.textContent='✕'; del.title='Удалить изделие (файлы останутся на карточке, станут «без изделия»)';
          del.addEventListener('click', function(){
            if (del.getAttribute('data-sure')!=='1'){ del.setAttribute('data-sure','1'); del.textContent='удалить?'; setTimeout(function(){ del.removeAttribute('data-sure'); del.textContent='✕'; }, 3000); return; }
            ITEMS.splice(idx,1); saveItems().then(draw); });
          var up=document.createElement('button'); up.className='up'; up.type='button'; up.textContent='⬆ Файлы'; up.title='Загрузить файлы сразу в изделие «'+it.name+'»: DXF, ZZX и любые другие (PDF, фото, чертежи)';
          up.addEventListener('click', function(){ pickAndUpload(it.id); });
          h.appendChild(nm); h.appendChild(x); h.appendChild(q); h.appendChild(sh); h.appendChild(up);
          // СКАЧАТЬ ВСЕ — отдельно DXF и отдельно ZZX: станки (ПК) разные и читают разные файлы
          [['DXF', dxfs], ['ZZX', zzxs]].forEach(function(k){
            var lst=k[1].filter(function(a){ return (it.files||[]).indexOf(a.id)>=0; });
            if (!lst.length) return;
            var b=document.createElement('button'); b.className='up dlall'; b.type='button'; b.textContent='⬇ Все '+k[0]+' ('+lst.length+')';
            b.title='Скачать все '+k[0]+' изделия «'+it.name+'» в папку с его названием (другие файлы не скачиваются)';
            b.addEventListener('click', function(){ dlAll(it, lst, k[0]); });
            h.appendChild(b);
          });
          h.appendChild(del);
          // перетащить файлы мышкой прямо на изделие
          box.addEventListener('dragover', function(e){ e.preventDefault(); box.style.background='rgba(12,102,228,.06)'; });
          box.addEventListener('dragleave', function(){ box.style.background=''; });
          box.addEventListener('drop', function(e){ e.preventDefault(); box.style.background=''; uploadFiles(e.dataTransfer.files, it.id); });
          box.appendChild(h);
          // сначала модель/чертёж/фото (PDF, STEP, картинки), потом DXF/ZZX — полная картина без прокрутки
          var mine=others.concat(files).filter(function(a){ return (it.files||[]).indexOf(a.id)>=0; });
          if (!mine.length){ var e=document.createElement('div'); e.className='empty'; e.textContent='Нет файлов — нажмите «⬆ Файлы», перетащите файлы сюда или отметьте их галочкой ниже и перенесите.'; box.appendChild(e); }
          mine.forEach(function(att){ box.appendChild(fileRow(att,isZzx(att))); });
          el.appendChild(box);
        });
        freeBox(el, files.filter(function(a){ return !itemOf(a.id); }), 'Без изделия', false);
        freeBox(el, others.filter(function(a){ return !itemOf(a.id); }), 'Другие файлы карточки', true);
      }
      if (!ITEMS.length) zzxs.forEach(function(att){ el.appendChild(fileRow(att,true)); });
      return t.sizeTo('#list');
    }

    // ФАЙЛ ВСЕГДА В ИЗДЕЛИИ (решение Асхата, 11.11.2026): тогда «количество» в расчёте DXF
    // всегда значит «штук на одно изделие».
    //  · новая карточка (изделий нет и ни один DXF ещё не рассчитан) — создаём изделие
    //    с названием карточки, количество 1, и кладём туда все DXF;
    //  · одно изделие — новые DXF сами попадают в него;
    //  · несколько изделий — раскладываем по названию файла, остальное остаётся «без изделия».
    // Старые карточки (расчёты есть, изделий нет) не трогаем — считаются по-старому.
    var CARD_NAME='';
    function itemNameFromCard(){
      var n=String(CARD_NAME||'').replace(/^\s*[#№]?\s*\d+\s*[.:\-–—]?\s*/,'').trim();
      return (n||'Изделие 1').slice(0,60);
    }
    function autoPlace(){
      var dx=FILES.filter(function(a){ return isDxf(a)||isZzx(a); }); if(!dx.length || editing()) return Promise.resolve();
      var changed=false;
      if(!ITEMS.length){
        var anyCalc=dx.some(function(a){ return !!recFor(a); });
        if(anyCalc) return Promise.resolve();   // старая карточка
        ITEMS=[{ id:'i'+Date.now().toString(36), name:itemNameFromCard(), qty:1, files:dx.map(function(a){ return a.id; }) }];
        changed=true;
      } else {
        dx.forEach(function(a){
          if(itemOf(a.id)) return;
          if(recFor(a)) return;               // уже рассчитан «без изделия» — не переносим молча
          var it = ITEMS.length===1 ? ITEMS[0] : guessItem(a);
          if(it){ it.files.push(a.id); changed=true; }
        });
      }
      if(!changed) return Promise.resolve();
      return saveItems().then(function(){ setMsg('Файлы разложены по изделиям автоматически'); });
    }

    var rendering=false, FOCUS_ITEM=null, UPLOADING=0;
    function render(){
      // пока идёт загрузка, Trello уже видит новый файл, а изделие на сервере ещё не обновлено —
      // не перерисовываем, иначе файл на мгновение окажется «без изделия» (и может туда записаться)
      if (rendering || editing() || UPLOADING) return Promise.resolve();
      rendering=true;
      return t.card('id','attachments','name').then(function(card){
        CARD_ID=card.id; FILES=(card.attachments||[]); CARD_NAME=card.name||'';
        return loadMetrics(card.id).then(function(m){ METRICS=m; return autoPlace(); }).then(draw);
      }).catch(function(err){
        document.getElementById('list').innerHTML='<div class="empty">Ошибка: '+esc(err&&err.message?err.message:'неизвестно')+'</div>';
        return t.sizeTo('#list');
      }).then(function(r){ rendering=false; return r; }, function(e){ rendering=false; throw e; });
    }

    t.render(render);
    // расчёты хранятся в базе — Trello о них не знает, поэтому обновляемся сами:
    setInterval(render, 12000);
    window.addEventListener('focus', render);
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) render(); });
  </script>
</body>
</html>
