<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Мой заработок</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./trello-shim.js"></script>
  <script src="./config.js"></script>
  <style>
    :root{ --bg:#1d2125; --bg2:#22272b; --line:#3c444c; --txt:#e6edf3; --muted:#9fadbc; --accent:#4f7cff; --green:#3aa657; }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
    .wrap{padding:16px;max-width:840px;margin:0 auto}
    .sec{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
    h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
    .muted{color:var(--muted)}
    .small{font-size:12px}
    .period{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px}
    .period button{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:16px}
    .period .lbl{min-width:190px;text-align:center;font-weight:600;font-size:15px}
    .total{font-size:30px;font-weight:800;color:var(--green)}
    table{width:100%;border-collapse:collapse;margin-top:6px}
    th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
    th{font-size:12px;color:var(--muted);font-weight:600}
    td.num,th.num{text-align:right}
    .bar{height:8px;background:var(--accent);border-radius:4px;min-width:2px}
    .barwrap{background:var(--bg);border-radius:4px;overflow:hidden;width:100%}
  </style>
</head>
<body>
  <div class="wrap" id="app"><div class="muted" id="boot">Загрузка…</div></div>

<script>
  var t = window.TrelloPowerUp.iframe();
  var WORKER = (window.CONFIG && window.CONFIG.WORKER_URL) || window.WORKER_URL || '';
  var MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var WD=['вс','пн','вт','ср','чт','пт','сб'];

  function money(v){ v=Math.round(+v||0); return v.toLocaleString('ru-RU'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function pad(n){ return n<10?'0'+n:''+n; }
  function iso(y,m,d){ return y+'-'+pad(m+1)+'-'+pad(d); }

  var memberId=null, memberName='';
  var now=new Date();
  var cur={ y:now.getFullYear(), m:now.getMonth() };  // viewed month

  function boot(msg){ var b=document.getElementById('boot'); if(b) b.textContent=msg; }

  function monthRange(){
    var y=cur.y, m=cur.m;
    var from=iso(y,m,1);
    var last=new Date(y,m+1,0).getDate();
    var isCurrent=(y===now.getFullYear() && m===now.getMonth());
    var toDay=isCurrent? now.getDate() : last;
    var to=iso(y,m,toDay);
    return { from:from, to:to, last:last, isCurrent:isCurrent };
  }

  var VIEW_AS=''; // руководитель: смотреть заработок выбранного сотрудника (его глазами)
  var TEAM=null;  // список работников для селектора (только если есть право)
  function load(){
    boot('Загрузка…');
    var r=monthRange();
    var u=WORKER+'/my-earnings?memberId='+encodeURIComponent(memberId)+'&from='+r.from+'&to='+r.to+(VIEW_AS?('&asWorkerId='+encodeURIComponent(VIEW_AS)):'');
    fetch(u).then(function(x){return x.json();}).then(function(j){
      if(!j || j.error){ render(null, 'Ошибка: '+((j&&j.error)||'?')); return; }
      if(!j.linked){ render(null, 'linked_false'); return; }
      render(j, null);
    }).catch(function(e){ render(null, 'Сеть недоступна: '+(e&&e.message||e)); });
  }

  function periodBar(){
    return '<div class="period">'+
      '<button id="prev" type="button">‹</button>'+
      '<div class="lbl">'+MONTHS[cur.m]+' '+cur.y+'</div>'+
      '<button id="next" type="button">›</button>'+
      '</div>';
  }

  function render(j, err){
    // панель руководителя: выбор сотрудника
    var teamSel = '';
    if (TEAM && TEAM.length) {
      teamSel = '<div style="margin:0 0 12px"><label class="small muted">Смотреть заработок: </label>'+
        '<select id="viewAs" style="padding:6px 10px;border-radius:8px;background:var(--bg2,#22272b);color:inherit;border:1px solid var(--line,#3a414a)">'+
        '<option value="">Мой ('+(memberName||'я')+')</option>'+
        TEAM.map(function(w){ return '<option value="'+w.id+'"'+(VIEW_AS===w.id?' selected':'')+'>'+String(w.name).replace(/</g,'&lt;')+'</option>'; }).join('')+
        '</select></div>';
    }

    var html='';
    html=teamSel+html;
    html+='<div class="sec" style="text-align:center"><h3>Мой заработок'+(memberName?(' · '+esc(memberName)):'')+'</h3>'+periodBar();
    if(err==='linked_false'){
      html+='<div class="muted">Ваш аккаунт Trello не привязан к работнику. Обратитесь к руководителю, чтобы он привязал ваш аккаунт в «Зарплата / Работники».</div></div>';
      document.getElementById('app').innerHTML=html; wirePeriod(); return;
    }
    if(err){ html+='<div class="muted">'+esc(err)+'</div></div>'; document.getElementById('app').innerHTML=html; wirePeriod(); return; }

    html+='<div class="total">'+money(j.total)+' ₸</div>';
    html+='<div class="small muted" style="margin-top:4px">за '+MONTHS[cur.m].toLowerCase()+' '+cur.y+'</div>';
    // выплата подтверждается сдачей заказа: показываем работнику честную разбивку
    if(j.totalDelivered!=null){
      html+='<div style="display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap">'+
        '<div style="background:#1c3329;border:1px solid #2e5c44;border-radius:12px;padding:8px 16px;min-width:150px">'+
          '<div class="small" style="color:#7ee2b8;text-transform:uppercase;font-size:10.5px">✅ К выплате — заказ сдан</div>'+
          '<div style="font-size:17px;font-weight:700;color:#4bce97">'+money(j.totalDelivered)+' ₸</div></div>'+
        '<div style="background:#3a2f1a;border:1px solid #5c4a2e;border-radius:12px;padding:8px 16px;min-width:150px">'+
          '<div class="small" style="color:#e8c07d;text-transform:uppercase;font-size:10.5px">⏳ Заказ ещё в работе</div>'+
          '<div style="font-size:17px;font-weight:700;color:#e8c07d">'+money(j.totalPending)+' ₸</div></div>'+
      '</div>';
      html+='<div class="small muted" style="margin-top:8px;max-width:420px;margin-left:auto;margin-right:auto">Деньги выплачиваются, когда заказ <b>сдан клиенту и претензий нет</b> — ваш этап может быть готов, но заказ ещё идёт по цеху. Помогайте двигать заказ до сдачи: чем быстрее сдан весь заказ, тем быстрее выплата у всех.</div>';
    }
    html+='</div>';

    // by day
    var days=j.days||[];
    html+='<div class="sec"><h3>По дням</h3>';
    if(!days.length){ html+='<div class="muted">В этом месяце начислений пока нет.</div>'; }
    else {
      var max=days.reduce(function(m,d){return Math.max(m,d.amount);},0)||1;
      html+='<table><tbody>';
      days.forEach(function(d){
        var dt=new Date(d.date+'T00:00:00');
        var w=Math.round(100*d.amount/max);
        html+='<tr>'+
          '<td style="width:120px">'+d.date.slice(8,10)+'.'+d.date.slice(5,7)+' <span class="small muted">'+WD[dt.getDay()]+'</span></td>'+
          '<td><div class="barwrap"><div class="bar" style="width:'+w+'%"></div></div></td>'+
          '<td class="num" style="width:120px">'+money(d.amount)+' ₸</td>'+
        '</tr>';
      });
      html+='</tbody></table>';
    }
    html+='</div>';

    // бонус агента ремонта (если аккаунт помечен агентом)
    var ab=j.agentBonus;
    if(ab && (ab.count>0 || ab.perItem>0)){
      html+='<div class="sec"><h3>Бонус за заявки на ремонт</h3>';
      html+='<div class="small muted" style="margin-bottom:6px">Начисляется за каждую полностью оформленную заявку: описание поломки, фирма-заказчик, контактное лицо и фото. Итог уже включён в сумму месяца сверху.</div>';
      if(!ab.count){ html+='<div class="muted">В этом месяце оформленных заявок пока нет. Бонус за заявку: '+money(ab.perItem)+' ₸.</div>'; }
      else {
        html+='<div style="margin-bottom:6px"><b>'+ab.count+'</b> заяв'+(ab.count===1?'ка':(ab.count<5?'ки':'ок'))+' × '+money(ab.perItem)+' ₸ = <b style="color:var(--green,#4bce97)">'+money(ab.total)+' ₸</b></div>';
        html+='<table><thead><tr><th>№</th><th>Заявка</th><th style="width:110px">Дата</th></tr></thead><tbody>';
        (ab.items||[]).forEach(function(x){
          html+='<tr><td class="small">'+esc(x.number)+'</td><td>'+esc(x.title||'')+'</td><td class="small">'+esc(x.date||'')+'</td></tr>';
        });
        html+='</tbody></table>';
      }
      html+='</div>';
    }

    // by order (my share only — no order cost)
    var orders=j.orders||[];
    html+='<div class="sec"><h3>По заказам (моя доля)</h3>';
    if(!orders.length){ html+='<div class="muted">Нет заказов с вашим участием в этом месяце.</div>'; }
    else {
      html+='<div class="small muted" style="margin-bottom:6px">Показана только ваша доля по каждому заказу. Стоимость самих заказов здесь не отображается.</div>';
      html+='<table><thead><tr><th>№ карт.</th><th>Заказ</th><th style="width:96px">Статус</th><th class="num">Моя доля</th></tr></thead><tbody>';
      orders.forEach(function(o){
        var st = o.delivered
          ? '<span style="color:#4bce97;font-size:11.5px">✅ сдан</span>'
          : '<span style="color:#e8c07d;font-size:11.5px">⏳ в работе</span>';
        html+='<tr><td class="small">'+esc(o.number||'—')+'</td><td>'+esc(o.name||'(без названия)')+'</td><td>'+st+'</td><td class="num">'+money(o.amount)+' ₸</td></tr>';
      });
      html+='</tbody></table>';
    }
    html+='</div>';

    document.getElementById('app').innerHTML=html;
    var vs=document.getElementById('viewAs');
    if(vs) vs.onchange=function(){ VIEW_AS=this.value||''; load(); };
    wirePeriod();
  }

  function wirePeriod(){
    var p=document.getElementById('prev'), n=document.getElementById('next');
    if(p) p.onclick=function(){ cur.m--; if(cur.m<0){ cur.m=11; cur.y--; } load(); };
    if(n) n.onclick=function(){
      // don't go past the current month
      if(cur.y===now.getFullYear() && cur.m===now.getMonth()) return;
      cur.m++; if(cur.m>11){ cur.m=0; cur.y++; } load();
    };
  }

  t.member('id','fullName').then(function(m){
    memberId=(m&&m.id)||null; memberName=(m&&m.fullName)||'';
    if(!memberId){ boot('Не удалось определить ваш аккаунт.'); return; }
    // руководителю (Панель руководителя / Бухгалтерия) — селектор сотрудников
    fetch(WORKER+'/worker-perms?memberId='+encodeURIComponent(memberId))
      .then(function(r){return r.json();})
      .then(function(p){
        if(p && (p.canDashboard || p.canInvoice)){
          return fetch(WORKER+'/workers-list').then(function(r){return r.json();}).then(function(j){
            TEAM=(j&&j.workers||[]).filter(function(w){return w.active!==0;}).map(function(w){return {id:w.id, name:w.name};});
          });
        }
      })
      .catch(function(){})
      .then(load);
  }).catch(function(){ boot('Не удалось определить ваш аккаунт.'); });
</script>
</body>
</html>
